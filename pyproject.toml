[project]
name = "covenant-lens"
version = "0.2.0"
description = "Reads credit agreements from SEC filings, tests their financial covenants every quarter, and grades itself against what companies report."
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
