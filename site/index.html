0,"ltm_ebitda_adjusted":117600000.0,"debt":347600000,"cash":85300000},{"period_end":"2026-07-03","before_agreement":false,"limit":1.2,"xbrl":null,"adjusted":null,"reported":null,"reported_limit":1.2,"ltm_ebitda_xbrl":114500000.0,"ltm_ebitda_adjusted":123200000.0,"debt":347100000,"cash":99200000}]}],"terms":[{"kind":"j_crew_blocker","present":"yes","section":"Section 6.02 (final paragraph); definition of \"Unrestricted Subsidiary\" clause (z)","quote":"no Restricted Payment or Investment (other than an Investment in Parent Borrower or another Loan Party) of material intellectual property owned by Parent Borrower or another Loan Party shall be permitted under this Agreement.","summary":"Investments or restricted payments of material IP outside the Loan Parties are prohibited. A subsidiary also cannot be designated (or remain) unrestricted if it owns or holds exclusive rights to IP material to the Parent Borrower or its business. Separately, IP dispositions to non-Loan Parties must be made subject to a non-exclusive license in favor of the Administrative Agent.","quote_verified":true},{"kind":"serta_protection","present":"yes","section":"Section 9.02(b)(viii)","quote":"contractually subordinate (A) any of the Obligations in right of payment or otherwise adversely affect the priority of payment of any of such Obligations or (B) any of the Liens securing the Obligations, in each case without the consent of each Lender","summary":"Subordinating the Obligations in right of payment, or subordinating their Liens, requires every Lender's consent. The only exception is the agent's ability to subordinate liens to permitted purchase-money liens. Changes to pro rata sharing or the payment waterfall need each directly and adversely affected Lender's consent, and assignments to the Borrowers or their Affiliates are barred.","quote_verified":true},{"kind":"chewy_protection","present":"partial","section":"Section 10.12(a); Section 8.12(a)(iii)","quote":"the sale, disposition, exchange or other transfer (including through merger, consolidation amalgamation or otherwise) of the Capital Stock (including any sale, disposition or other transfer following which the applicable Loan Party is no longer a Restricted Subsidiary), of the applicable Loan Party to a Person that is not an Affiliate of a Loan Party if such sale, disposition, exchange or other transfer is made in a manner not in violation of this Agreement and for a bona fide business purpose other than causing the release of the Obligations;","summary":"There is no express statement that a guarantor stays bound if it merely stops being wholly owned. However, release on a sale of its equity requires that the buyer be a non-Affiliate and that the sale have a bona fide business purpose other than releasing the guaranty. In addition, a Change of Control default arises if the Parent Borrower stops owning 100% of the other Loan Parties except through permitted transactions.","quote_verified":true},{"kind":"unrestricted_sub_cap","present":"partial","section":"Definition of \"Permitted Investments\" clause (15); Section 6.02","quote":"Investments in Unrestricted Subsidiaries and Joint Ventures in an aggregate principal amount at any time outstanding (after giving effect to any cash returns or other payments in respect of any such Investment) not exceeding the greater of (i) $25,000,000 or (ii) 25% of Consolidated Adjusted EBITDA measured as of the last day of the most recently ended Fiscal Quarter","summary":"There is a dedicated basket of the greater of $25M and 25% of EBITDA for investments in unrestricted subsidiaries and joint ventures, and designation is treated as an investment. Additional capacity exists, though: the general investment basket (greater of $40M and 40% of EBITDA) and unlimited restricted payments under Section 6.02(l) when the Payment Conditions are met (no Event of Default; a 50%-of-net-income cap applies only above 2.50x leverage). So the cap is not hard.","quote_verified":true},{"kind":"addback_cap","present":"yes","section":"Definition of \"Consolidated Adjusted EBITDA\" clauses (13) and (14)","quote":"costs, charges, accruals, reserves or expenses attributable to the undertaking and/or implementation of cost savings initiatives and operating expense reductions, restructuring and similar charges, severance, relocation costs, integration and facilities opening costs and other business optimization expenses, signing costs, retention or completion bonuses, transition costs, costs related to closure/consolidation of facilities and curtailments or modifications to pension and post-retirement employee benefit plans (including any settlement of pension liabilities) in an aggregate amount not to exceed 20% (when taken together with amounts added under","summary":"Restructuring and cost-savings charges plus projected run-rate cost savings and synergies (12-month realization window) are together capped at 20% of EBITDA. There is leakage, however: clause (23) adds back unusual or non-recurring costs without a cap, and the Pro Forma Basis definition allows acquisition run-rate savings without an express cap.","quote_verified":true},{"kind":"equity_cure","present":"no","section":null,"quote":null,"summary":"The agreement has no equity cure right; a breach of Section 6.12 is an immediate Event of Default under Section 7.01(c)(i).","quote_verified":null}],"accuracy":[{"metric":"fixed_charge_coverage","period_end":"2025-10-03","reported":null,"reported_limit":1.25,"our_limit":1.2,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162225000108/var-20251003.htm"},{"metric":"net_leverage","period_end":"2025-10-03","reported":null,"reported_limit":3.75,"our_limit":null,"limit_match":null,"xbrl":2.4699907663896585,"adjusted":2.15378421900161,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162225000108/var-20251003.htm"},{"metric":"fixed_charge_coverage","period_end":"2026-01-02","reported":null,"reported_limit":1.25,"our_limit":1.2,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000016/var-20260102.htm"},{"metric":"net_leverage","period_end":"2026-01-02","reported":null,"reported_limit":3.75,"our_limit":null,"limit_match":null,"xbrl":2.39142091152815,"adjusted":2.1037735849056602,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000016/var-20260102.htm"},{"metric":"fixed_charge_coverage","period_end":"2026-04-03","reported":null,"reported_limit":1.2,"our_limit":1.2,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000052/var-20260403.htm"},{"metric":"net_leverage","period_end":"2026-04-03","reported":null,"reported_limit":4.25,"our_limit":4.25,"limit_match":true,"xbrl":2.5076481835564053,"adjusted":2.2304421768707483,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000052/var-20260403.htm"},{"metric":"fixed_charge_coverage","period_end":"2026-07-03","reported":null,"reported_limit":1.2,"our_limit":1.2,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000063/var-20260703.htm"},{"metric":"net_leverage","period_end":"2026-07-03","reported":null,"reported_limit":4.25,"our_limit":4.25,"limit_match":true,"xbrl":2.165065502183406,"adjusted":2.012175324675325,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000063/var-20260703.htm"}],"notes":"Leverage table is labeled by month (\"Closing Date to September, 2027\" 4.25x; \"December, 2027 to September, 2028\" 4.00x; \"December, 2028 and thereafter\" 3.75x). The company uses a 52/53-week fiscal year ending around early October (FY2026 ends October 2, 2026), so actual test dates fall on Fridays near these months. The 2026-04-03 start date for the 4.25x level is inferred as the first fiscal quarter-end after closing; the December step-down dates are approximated as month-end.\n\nAcquisition holiday: in the quarter a Permitted Acquisition with total consideration of $125M or more is signed or closed (at the borrower's option), and for the next three quarters, the maximum leverage ratio rises by 0.50x, capped at 4.50x.\n\nNet debt calculation:\n- Only Unrestricted cash and Cash Equivalents of the Parent Borrower and Loan Parties may be netted, capped at $100M.\n- From 90 days after closing, that cash must sit in accounts controlled by the Administrative Agent or held at a Cash Management Bank.\n- Debt counts only borrowed money, bankers' acceptances, Disqualified Stock and subsidiary Preferred Stock; undrawn letters of credit are excluded.\n\nFixed charge coverage calculation:\n- Numerator: EBITDA less Unfinanced Capital Expenditures, cash income taxes and cash Restricted Payments.\n- Denominator: Fixed Charges (net interest, preferred dividends, receivables fees and certain dividends) plus scheduled principal payments plus payments on earn-out/indemnity debt under Section 6.01(e).\n\nEBITDA (Consolidated Adjusted EBITDA) add-backs and exclusions:\n- Broad non-cash charges and impairments, excluding inventory and receivables write-downs.\n- Non-cash equity compensation.\n- Transaction costs.\n- Restructuring and run-rate synergies, together capped at 20% of EBITDA.\n- IP and tax litigation costs, FX losses, insured or indemnified losses, earn-out changes.\n- An uncapped add-back for unusual, extraordinary or non-recurring costs (clause 23).\n- The Pro Forma Basis definition separately allows acquisition run-rate cost savings without an express cap.\n\nCovenant levels also drive other baskets:\n- Delayed draw term loan draws require pro forma covenant compliance.\n- Incremental facilities and incremental equivalent debt require leverage 0.25x inside the covenant.\n- Acquired debt and the acquisition Payment Conditions require leverage 0.50x inside the covenant.\n\nOther points:\n- No equity cure.\n- Compliance certificates are delivered with quarterly and annual financials; quarterly reporting starts with the quarter ending July 3, 2026.\n- Required Lenders becomes all Lenders if there are two or fewer unaffiliated Lenders.\n- Assignments to the Borrowers or their Affiliates are prohibited, which limits non-pro-rata repurchases.\n- Closing proceeds refinanced the 7.875% senior secured notes due 2027 and the 2024 revolver.","compliance":null,"qa":[{"question":"How much additional debt could the borrower take on today, and under which baskets or ratio tests? Name the sections.","answer":"**Short answer:** The ceiling can't be quantified from the agreement alone. It depends on current Consolidated Adjusted EBITDA, pro forma leverage and how much of each basket is already used. Only the original March 13, 2026 agreement was provided, with no amendments. The main sources of capacity are:\n\n**Committed facilities**\n- **Revolver (\u00a72.01(a)):** $100,000,000 aggregate principal amount of Revolving Credit Commitments [1], less current drawings and letters of credit.\n- **Delayed draw term loan (\u00a72.01(c)):** $40,000,000, solely to finance Capital Expenditures [2]. Each draw requires compliance with the financial covenants set forth in Section 6.12 on a Pro Forma Basis [3].\n\n**Incremental facilities and Incremental Equivalent Debt**\n- **Incremental facilities (\u00a72.25(c)):** up to the greater of (x) $150,000,000 and (y) the maximum amount which, after giving effect to the establishment of such Incremental Commitment (assuming any Revolving Commitment Increase has been fully funded on such date) on a Pro Forma Basis, would not cause the Consolidated Total Net Leverage Ratio to exceed 3.00:1.00 [4].\n  - Leverage condition (\u00a72.25(f)(iii)): pro forma leverage must be at least 0.25x inside the \u00a76.12 covenant. The covenant is 4.25:1.00 [5] through September 2027, so the test is 4.00x today.\n- **Incremental Equivalent Debt (definition; \u00a76.01(y)):** capped at the greater of (x) $200,000,000 and (y) 175% of Consolidated Adjusted EBITDA [6]. This cap is not additive to the incremental cap: the amounts listed clauses (x) and (y) and in clause (a) of the definition of \"Incremental Equivalent Debt\" are not cumulative [7].\n\n**\u00a76.01 debt baskets**\n- **(w) general basket:** the greater of (i) $35,000,000 or (ii) 35% of Consolidated Adjusted EBITDA [8].\n- **(c)(ii) purchase-money / capital leases:** $25,000,000.\n- **(k):** $5,000,000.\n- **(s) acquired debt:** permitted subject to pro forma leverage of at least 0.50x inside the covenant (i.e., 3.75x today).","citations":[{"n":1,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"EX-10.1\n2\nexhibit101-creditandguaran.htm\nEX-10.1\nDocument\nEXHIBIT 10.1\nCREDIT AND GUARANTY AGREEMENT\ndated as of\nMarch 13, 2026\namong\nVAREX IMAGING CORPORATION,\nas the Parent Borrower,\nCERTAIN SUBSIDIARIES OF PARENT BORROWER IDENTIFIED HEREIN,\nas the Borrowers and Guarantors, as applicable,\nTHE OTHER LOAN PARTIES FROM TIME TO TIME PARTY HERETO,\nTHE LENDERS FROM TIME TO TIME PARTY HERETO,\nTHE ISSUING BANKS FROM TIME TO TIME PARTY HERETO,\nZIONS BANCORPORATION, N.A. ","found":true},{"n":2,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"Use the proceeds of (i) the Revolving Loans and the Letters of Credit issued hereunder solely for working capital and other general corporate purposes of the Parent Borrower and its Subsidiaries, (ii) the Initial Term Loans solely to consummate the Closing Date Refinancing and to pay fees and expenses in connection therewith, and (iii) the Delayed Draw Term Loans solely to finance Capital Expenditures and to pay fees and expenses in connection therewith, and, in each case, not in contravention of any Law and not prohibited by this Agreement or the other Loan Documents.\n","found":true},{"n":3,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"Subject to the terms and conditions of\nSection 1.08\n, the obligation of each Lender (including each Swingline Lender) and each Issuing Bank to make a Credit Extension (including its initial Credit Extensions on the Closing Date) is additionally subject to the satisfaction of the following conditions:\n(a)\nthe Administrative Agent and, if applicable, the applicable Swingline Lender or the applicable Issuing Bank shall have received a written Borrowing Request or request for L/C Credit Extension, as applicable, from the Parent Borrower in accordance with the requirements hereof;\n(b)\nthe representations and warranties of the Loan Parties set forth in this Agreement and in any other Loan Document shall be true and correct in all material respects (or, in the case of any such representation or warranty already qualified by materiality, in all respects) on and as of the date of\n113\nsuch Credit Extension (or, in the case of any such representation or warranty expressly stated to have been made as of a specific date, as of such specific date);\n(c)\nno Default or Event of Default shall have occurred and be continuing or would result from such Credit Extension or from the application of proceeds thereof;\n(d)\nafter the making of the requested Credit Extensions, as applicable, (x) the aggregate Revolving Credit Exposures shall not exceed the aggregate Revolving Credit Commitments then in effect or (y) the aggregate Delayed Draw Term Loan Credit Exposures shall not exceed the original aggregate Delayed Draw Term Loan Commitments in effect as of the Closing Date; and\n(e)\nwith respect to any Delayed Draw Term Loans made on any date, the Loan Parties shall be in compliance with the financial covenants set forth in Section 6.12 on a Pro Forma Basis for the most recently ended Fiscal Quarter after giving effect to the incurrence of such Delayed Draw Term Loans and the use of proceeds thereof, measured as of the last day of the most recently ended Fiscal Quarter for which financial statements have been delivered pursuant to\nSection 5.01(b)\n.\n","found":true},{"n":4,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"The aggregate principal amount of Incremental Commitments on any date Indebtedness thereunder is Incurred will not exceed an amount equal to the greater of (x) $150,000,000 and (y) the maximum amount which, after giving effect to the establishment of such Incremental Commitment (assuming any Revolving Commitment Increase has been fully funded on such date) on a Pro Forma Basis, would not cause the Consolidated Total Net Leverage Ratio to exceed 3.00:1.00;\nprovided\nthat, for avoidance of any doubt, (i) the amounts listed in\nclauses (x)\nand\n(y)\nare not cumulative and (ii) the amounts listed\nclauses (x)\nand\n(y)\nand in\nclause (a)\nof the definition of \u201cIncremental Equivalent Debt\u201d are not cumulative.\n","found":true},{"n":5,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"The Parent Borrower shall not permit the Consolidated Total Net Leverage Ratio, on the last day of any Fiscal Quarter, to be greater than the ratio set forth below opposite such Fiscal Quarter:\nFiscal Quarters Ending\nMaximum\nConsolidated Total\nNet Leverage Ratio\nClosing Date to September, 2027\n4.25:1.00\nDecember, 2027 to September, 2028\n4.00:1.00\nDecember, 2028 and thereafter\n3.75:1.00\n;\nprovided\nthat, in any Fiscal Quarter in which a Permitted Acquisition for which the total consideration paid or payable is equal to or greater than $125,000,000 is consummated (meaning, at the option of the Parent Borrower, either (x) the signing of definitive transaction documentation relating to such Permitted Acquisition or (y) the completion of such Permitted Acquisition), the applicable Maximum Consolidated Total Net Leverage Ratio for that Fiscal Quarter and for the immediately succeeding three (3) Fiscal Quarters shall be 0.50:1.00 greater than the level otherwise applicable pursuant to this\nSection 6.12(a)\n;\nprovided\nfurther\nthat in no event shall the applicable Maximum Consolidated Total Net Leverage Ratio exceed 4.50:1.00.\n","found":true},{"n":6,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"EX-10.1\n2\nexhibit101-creditandguaran.htm\nEX-10.1\nDocument\nEXHIBIT 10.1\nCREDIT AND GUARANTY AGREEMENT\ndated as of\nMarch 13, 2026\namong\nVAREX IMAGING CORPORATION,\nas the Parent Borrower,\nCERTAIN SUBSIDIARIES OF PARENT BORROWER IDENTIFIED HEREIN,\nas the Borrowers and Guarantors, as applicable,\nTHE OTHER LOAN PARTIES FROM TIME TO TIME PARTY HERETO,\nTHE LENDERS FROM TIME TO TIME PARTY HERETO,\nTHE ISSUING BANKS FROM TIME TO TIME PARTY HERETO,\nZIONS BANCORPORATION, N.A. ","found":true},{"n":7,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"The aggregate principal amount of Incremental Commitments on any date Indebtedness thereunder is Incurred will not exceed an amount equal to the greater of (x) $150,000,000 and (y) the maximum amount which, after giving effect to the establishment of such Incremental Commitment (assuming any Revolving Commitment Increase has been fully funded on such date) on a Pro Forma Basis, would not cause the Consolidated Total Net Leverage Ratio to exceed 3.00:1.00;\nprovided\nthat, for avoidance of any doubt, (i) the amounts listed in\nclauses (x)\nand\n(y)\nare not cumulative and (ii) the amounts listed\nclauses (x)\nand\n(y)\nand in\nclause (a)\nof the definition of \u201cIncremental Equivalent Debt\u201d are not cumulative.\n","found":true},{"n":8,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"(i) Parent Borrower shall not, and shall not permit any of the Restricted Subsidiaries to, directly or indirectly, Incur any Indebtedness or issue any shares of Disqualified Stock; and (ii) Parent Borrower shall not permit any of the Restricted Subsidiaries (other than any Loan Party) to issue any shares of Preferred Stock;\nprovided\nthat the foregoing limitations shall not apply to:\n(a)\nthe Incurrence by Parent Borrower or any Restricted Subsidiary of Indebtedness pursuant to any Loan Document;\n(b)\nIndebtedness, Preferred Stock and Disqualified Stock of Parent Borrower and the Restricted Subsidiaries existing on the Closing Date (other than Indebtedness described in clause (a) of this\nSection 6.01\n) and listed on\nSchedule 6.01\nand renewals, modifications, extensions and amendments thereof and thereto;\nprovided\nthat the amount of such Indebtedness is not increased at the time of such renewal, modification, extension or amendment except by an amount equal to a reasonable premium or other reasonable amount paid, and fees and expenses reasonably incurred, in connection therewith and by an amount equal to any existing commitments unutilized thereunder;\n(c)\n(i) [reserved] and (ii) Indebtedness (including Capital Lease Obligations) Incurred by Parent Borrower or any Restricted Subsidiary, Disqualified Stock issued by Parent Borrower or any Restricted Subsidiary and Preferred Stock issued by any Restricted Subsidiary to finance (whether prior to or within 365 days after) the acquisition, lease, construction, repair, replacement or improvement of property (real or personal) or equipment (whether through the direct purchase of assets or the Capital Stock of any Person owning such assets) that, when aggregated with the principal amount or liquidation preference of all other Indebtedness, Disqualified Stock or Preferred Stock then outstanding and Incurred pursuant to this clause (c)(ii), does not exceed at any one time outstanding $25,000,000 (plus, in the case of any Refinancing Indebtedness, the Additional Refinancing Amount);\n(d)\nIndebtedness Incurred by Parent Borrower or any Restricted Subsidiary constituting reimbursement obligations with respect to letters of credit and bank guarantees issued in the ordinary course of business, including without limitation letters of credit in respect of workers\u2019 compensation claims, health, disability or other benefits to employees or former employees or their families or property, casualty or liability insurance or self-insurance, and letters of credit in connection with the maintenance of, or pursuant to the requirements of, Environmental Law, or other Indebtedness with respect to reimbursement type obligations regarding workers\u2019 compensation claims;\n(e)\nIndebtedness arising from agreements of Parent Borrower or any Restricted Subsidiary providing for indemnification, adjustment of acquisition or purchase price or similar obligations (including earn-outs), in each case, Incurred and owing to the selling party of such acquisition or assumed in connection with the Transactions, any Investments or any acquisition or disposition of any business, assets or a Subsidiary not prohibited by this Agreement, other than guarantees of Indebtedness Incurred by any Person acquiring all or any portion of such business, assets or Subsidiary for the purpose of financing such acquisition;\nprovided\nthat no payments shall be made on such Indebtedness unless the Borrowers are in Pro Forma Compliance with the Payment Conditions;\n(f)\nIndebtedness of any Loan Party owed to another Loan Party;\n125\n(g)\nBank Product Obligations;\n(h)\nIndebtedness of a Loan Party to any Subsidiary that is not a Loan Party, (including, without limitation, any Guarantees by a Loan Party to any Subsidiary that is not a Loan Party);\nprovided\nthat (except in respect of intercompany current liabilities incurred in the ordinary course of business in connection with the cash management, tax and accounting operations of Parent Borrower and its Subsidiaries), such Indebtedness is subordinated in right of payment to the Obligations in a manner reasonably satisfactory to the Administrative Agent;\nprovided\nfurther\nthat the aggregate amount of Indebtedness Incurred pursuant to this\nclause (h)\nwhen aggregated with Indebtedness Incurred pursuant to\nclause (o)\nof this Section 6.01 shall not exceed the greater of (x) $50,000,000 and (y) 50% of Consolidated Adjusted EBITDA measured as of the last day of the most recently ended Fiscal Quarter for which financial statements have been delivered pursuant to\nSection 5.01(b)\n;\n(i)\nHedging Obligations (x) that are not incurred for speculative purposes but (A) for the purpose of fixing or hedging interest rate risk with respect to any Indebtedness that is permitted by the terms of this Agreement to be outstanding; (B) for the purpose of fixing or hedging currency exchange rate risk with respect to any currency exchanges; or (C) for the purpose of fixing or hedging commodity price risk with respect to any commodity purchases or sales and, in each case, extensions or replacements thereof and (y) entered into in connection with a Permitted Bond Hedge Transaction or a Permitted Warrant Transaction;\n(j)\nobligations (including reimbursement obligations with respect to letters of credit, bank guarantees, warehouse receipts and similar instruments) in respect of performance, bid, appeal and surety bonds, completion guarantees and similar obligations provided by Parent Borrower or any Restricted Subsidiary in the ordinary course of business or consistent with past practice or industry practice;\n(k)\nIndebtedness or Disqualified Stock of Parent Borrower or Indebtedness, Disqualified Stock or Preferred Stock of any Restricted Subsidiary in an aggregate principal amount or liquidation preference, which when aggregated with the principal amount and liquidation preference of all other Indebtedness, Disqualified Stock and Preferred Stock then outstanding and Incurred pursuant to this\nclause (k)\ndoes not exceed at any one time outstanding $5,000,000 (plus, in the case of any Refinancing Indebtedness, the Additional Refinancing Amount);\n(l)\n[reserved];\n(m)\nany guarantee by Parent Borrower or any Restricted Subsidiary of Indebtedness or other obligations of Parent Borrower or any Restricted Subsidiary so long as the Incurrence of such Indebtedness or other obligations Incurred by Parent Borrower or such Restricted Subsidiary is permitted under the terms of this Agreement;\nprovided\n, that (A) if such Indebtedness is by its express terms subordinated in right of payment to the Obligations by such Restricted Subsidiary, as applicable, any such guarantee with respect to such Indebtedness shall be subordinated in right of payment to the Obligations, substantially to the same extent as such Indebtedness is subordinated to the Obligations and (B) if such guarantee is of Indebtedness of Parent Borrower, such guarantee is Incurred in accordance with, or not in contravention of,\nSection 5.16\nsolely to the extent\nSection 5.16\nis applicable;\n(n)\nthe Incurrence by Parent Borrower or any of the Restricted Subsidiaries of Indebtedness or Disqualified Stock, or by any Restricted Subsidiary of Preferred Stock of a Restricted Subsidiary, that serves to refund, refinance or defease any Indebtedness Incurred or Disqualified Stock or\n126\nPreferred Stock issued as permitted under clauses (b), (k), and (x) of this\nSection 6.01\nup to the outstanding principal amount (or, if applicable, the liquidation preference, face amount, or the like) or, if greater, committed amount (only to the extent the committed amount could have been Incurred on the date of initial Incurrence and was deemed Incurred at such time for the purposes of this\nSection 6.01\n) of such Indebtedness or Disqualified Stock or Preferred Stock, in each case at the time such Indebtedness was Incurred or Disqualified Stock or Preferred Stock was issued pursuant to clauses (b), (k), and (x) of this\nSection 6.01\n, or any Indebtedness, Disqualified Stock or Preferred Stock Incurred to so refund or refinance such Indebtedness, Disqualified Stock or Preferred Stock, plus any additional Indebtedness, Disqualified Stock or Preferred Stock Incurred to pay premiums (including tender premiums), accrued and unpaid interest, expenses, defeasance costs and fees in connection therewith (subject to the following proviso, \u201c\nRefinancing Indebtedness\n\u201d) prior to its respective maturity;\nprovided\n,\nhowever\n, that such Refinancing Indebtedness:\n(i)\nhas a Weighted Average Life to Maturity at the time such Refinancing Indebtedness is Incurred which is not less than the shorter of (x) the remaining Weighted Average Life to Maturity of the Indebtedness, Disqualified Stock or Preferred Stock being refunded, refinanced or defeased and (y) the Weighted Average Life to Maturity that would result if all payments of principal on the Indebtedness, Disqualified Stock and Preferred Stock being refunded or refinanced that were due on or after the date that is one year following the Maturity Date were instead due on such date;\n(ii)\nto the extent such Refinancing Indebtedness refinances (A) Indebtedness junior in right of payment to the Obligations, such Refinancing Indebtedness is junior in right of payment to the Obligations, (B) Disqualified Stock or Preferred Stock, such Refinancing Indebtedness is Disqualified Stock or Preferred Stock and (C) Indebtedness secured by a Lien on the Collateral that is\npari passu\nor junior to the Lien on the Collateral securing the Obligations, such Refinancing Indebtedness is secured by a Lien on the Collateral that is\npari passu\nwith or junior to the Lien on the Collateral securing the Obligations to the same extent as such Indebtedness; and\n(iii)\nshall not include (x) Indebtedness of a Restricted Subsidiary that is not a Loan Party that refinances Indebtedness of Parent Borrower or another Loan Party, or (y) Indebtedness of Parent Borrower or a Restricted Subsidiary that refinances Indebtedness of an Unrestricted Subsidiary, unless, in the case of either\n(x)\nor\n(y)\n, such Indebtedness is otherwise permitted pursuant to the terms of this\nSection 6.01\n;\n(o)\nIndebtedness of any Subsidiary that is not a Loan Party to any Loan Party;\nprovided\nthat the aggregate amount of Indebtedness incurred pursuant to this\nclause (o)\nshall not exceed the greater of (x) $25,000,000 and (y) 20% of Consolidated Adjusted EBITDA measured as of the last day of the most recently ended Fiscal Quarter for which financial statements have been delivered pursuant to\nSection 5.01(b)\n;\nprovided\n,\nfurther\n, that the aggregate amount of Indebtedness Incurred pursuant to this\nclause (o)\nwhen aggregated with Indebtedness Incurred pursuant to\nclause (h)\nof this\nSection 6.01\nshall not exceed the greater of (x) $50,000,000 and (y) 50% of Consolidated Adjusted EBITDA measured as of the last day of the most recently ended Fiscal Quarter for which financial statements have been delivered pursuant to\nSection 5.01(b)\n;\n(p)\nIndebtedness of any Subsidiary that is not a Loan Party to any Subsidiary that is not a Loan Party;\nprovided\nthat the aggregate amount of Indebtedness incurred pursuant to this\nclause (p)\nshall not exceed the greater of (x) $25,000,000 and (y) 20% of Consolidated Adjusted EBITDA measured\n127\nas of the last day of the most recently ended Fiscal Quarter for which financial statements have been delivered pursuant to\nSection 5.01(b)\n;\n(q)\nIndebtedness arising from the honoring by a bank or other financial institution of a check, draft or similar instrument drawn against insufficient funds in the ordinary course of business;\nprovided\nthat such Indebtedness is extinguished within five Business Days of its Incurrence;\n(r)\nIndebtedness of Parent Borrower or any Restricted Subsidiary supported by a Letter of Credit, in a principal amount not in excess of the stated amount of such Letter of Credit;\n(s)\nIndebtedness acquired or assumed by any Loan Party or any Subsidiary in connection with any acquisition or other investment not prohibited by this Agreement;\nprovided\nthat such Indebtedness acquired or assumed (x) existed at the time of such acquisition or other investment, (y) was not created in connection therewith or in contemplation thereof and (z) after giving effect to the acquisition or assumption of such Indebtedness, the Consolidated Total Net Leverage Ratio on a Pro Forma Basis shall not exceed 0.50:1.00 less than the then current Consolidated Total Net Leverage Ratio required under the financial covenants set forth in\nSection 6.12\nfor the most recently ended Fiscal Quarter;\n(t)\nIndebtedness of Parent Borrower or any Restricted Subsidiary consisting of (i) the financing of insurance premiums or (ii) take-or-pay obligations contained in supply arrangements, in each case, in the ordinary course of business;\n(u)\nunsecured Indebtedness of Parent Borrower or a Restricted Subsidiary to current or former officers, directors and employees thereof, their respective estates, spouses or former spouses, in each case to finance the purchase or redemption of Equity Interests of Parent Borrower to the extent described in\nSection 6.02(d)\n;\nprovided\nthat no payments shall be made on such Indebtedness unless the Borrowers are in Pro Forma Compliance with the Payment Conditions;\n(v)\nIndebtedness in respect of Obligations of Parent Borrower or any Restricted Subsidiary to pay the deferred purchase price of goods or services or progress payments in connection with such goods and services;\nprovided\nthat such obligations are incurred in connection with open accounts extended by suppliers on customary trade terms in the ordinary course of business and not in connection with the borrowing of money or any Hedging Obligations;\n(w)\nIndebtedness in an aggregate principal amount at any time outstanding not exceeding the greater of (i) $35,000,000 or (ii) 35% of Consolidated Adjusted EBITDA measured as of the last day of the most recently ended Fiscal Quarter for which financial statements have been delivered pursuant to\nSection 5.01(b)\n;\n(x)\n[reserved];\n(y) Incremental Equivalent Debt and Refinancing Indebtedness in respect thereof (plus, in the case of any Refinancing Indebtedness, the Additional Refinancing Amount); and\n(z) [reserved];\n(aa) any liability arising as a result of or in connection with any fiscal unity (\nfiscale eenheid\n) for Dutch corporate income tax and/or VAT purposes with the Parent Borrower, any Restricted Subsidiary, and/or any Loan Party, for the avoidance of doubt including Varex Imaging International\n128\nHoldings B.V., VI Investments NL, Varex Imaging Group Nederland B.V. and/or Varex Imaging Nederland B.V.; and\n(bb) any liability in respect of any Parent Borrower or any Restricted Subsidiary arising under a declaration of joint and several liability (\nhoofdelike aansprakelijkheid\n) as referred to in Section 2:403 of the Dutch Civil Code (and any residual liability under such declaration arising pursuant to Section 2:404(2) of the Dutch Civil Code.\n","found":true}]},{"question":"If the borrower missed its financial covenant next quarter, what happens? Is there an equity cure or a grace period, and what can the lenders do?","answer":"**Short answer: a missed covenant is an immediate Event of Default. The agreement has no equity cure and no grace period.**\n\n**The covenants (Section 6.12)**\n- **Leverage:** The Consolidated Total Net Leverage Ratio may not exceed 4.25:1.00 from the Closing Date to September 2027, 4.00:1.00 from December 2027 to September 2028, and 3.75:1.00 for December 2028 and thereafter [1]. A $125M+ Permitted Acquisition steps the limit up by 0.50x for four quarters, capped at 4.50:1.00 [2].\n- **Fixed charge coverage:** The Consolidated Fixed Charge Coverage Ratio may not be less than 1.20:1.00 [3] on the last day of any Fiscal Quarter.\n- Whether the borrower actually breaches depends on its EBITDA and net debt for that quarter, which the documents don't give.\n\n**No grace period or cure**\n- Section 7.01(c)(i) makes any failure to observe Article VI [4] an Event of Default with no cure window.\n- By contrast, late financial statements or compliance certificates (Sections 5.01/5.02) get five Business Days [5].\n- I found no equity cure right anywhere in the agreement.\n\n**What the lenders can do**\n- **Section 7.01 remedies:** The Agent may, and at the request (or with the consent) of the Required Lenders shall [6]:\n  - terminate the commitments;\n  - accelerate the loans;\n  - stop new Letters of Credit;\n  - require cash collateral for L/Cs at 103% of the total L/C Obligations [7];\n  - exercise all other remedies.\n- **Default interest:** At the Required Lenders' request, an additional 2.00% per annum [8] applies.\n- **Funding freeze:** No new borrowings are available, because each credit extension requires that no Default or Event of Default shall have occurred and be continuing [9].\n- **Setoff:** Lenders may set off against the borrower's deposits under Section 9.08.\n\n**Fixing it**\n- The realistic path is a waiver or amendment, which needs Required Lenders, meaning more than 50% [10] of Total Credit Exposures.","citations":[{"n":1,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"The Parent Borrower shall not permit the Consolidated Total Net Leverage Ratio, on the last day of any Fiscal Quarter, to be greater than the ratio set forth below opposite such Fiscal Quarter:\nFiscal Quarters Ending\nMaximum\nConsolidated Total\nNet Leverage Ratio\nClosing Date to September, 2027\n4.25:1.00\nDecember, 2027 to September, 2028\n4.00:1.00\nDecember, 2028 and thereafter\n3.75:1.00\n;\nprovided\nthat, in any Fiscal Quarter in which a Permitted Acquisition for which the total consideration paid or payable is equal to or greater than $125,000,000 is consummated (meaning, at the option of the Parent Borrower, either (x) the signing of definitive transaction documentation relating to such Permitted Acquisition or (y) the completion of such Permitted Acquisition), the applicable Maximum Consolidated Total Net Leverage Ratio for that Fiscal Quarter and for the immediately succeeding three (3) Fiscal Quarters shall be 0.50:1.00 greater than the level otherwise applicable pursuant to this\nSection 6.12(a)\n;\nprovided\nfurther\nthat in no event shall the applicable Maximum Consolidated Total Net Leverage Ratio exceed 4.50:1.00.\n","found":true},{"n":2,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"The Parent Borrower shall not permit the Consolidated Total Net Leverage Ratio, on the last day of any Fiscal Quarter, to be greater than the ratio set forth below opposite such Fiscal Quarter:\nFiscal Quarters Ending\nMaximum\nConsolidated Total\nNet Leverage Ratio\nClosing Date to September, 2027\n4.25:1.00\nDecember, 2027 to September, 2028\n4.00:1.00\nDecember, 2028 and thereafter\n3.75:1.00\n;\nprovided\nthat, in any Fiscal Quarter in which a Permitted Acquisition for which the total consideration paid or payable is equal to or greater than $125,000,000 is consummated (meaning, at the option of the Parent Borrower, either (x) the signing of definitive transaction documentation relating to such Permitted Acquisition or (y) the completion of such Permitted Acquisition), the applicable Maximum Consolidated Total Net Leverage Ratio for that Fiscal Quarter and for the immediately succeeding three (3) Fiscal Quarters shall be 0.50:1.00 greater than the level otherwise applicable pursuant to this\nSection 6.12(a)\n;\nprovided\nfurther\nthat in no event shall the applicable Maximum Consolidated Total Net Leverage Ratio exceed 4.50:1.00.\n","found":true},{"n":3,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"The Parent Borrower shall not permit the Consolidated Fixed Charge Coverage Ratio, on the last day of any Fiscal Quarter, to be less than 1.20:1.00.\n","found":true},{"n":4,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"(i) Any Loan Party shall fail to perform or observe any covenant, condition or agreement contained in\nSection 5.03\n,\nSection 5.04\n(with respect to each Borrower\u2019s existence),\nSection 5.12\n,\nSection 5.16\n,\nSection 5.22\n,\nSection 5.23\n,\nSection 5.24\nor\nArticle VI\n; (ii) any Loan Party shall fail to perform or observe any covenant, condition or agreement contained in\nSection 5.01\nor\nSection 5.02\nif the failure to perform or observe such covenant, condition or agreement shall continue unremedied for five Business Days; and (iii) any Loan Party shall fail to perform or observe such other term, convent or agreement contained in any Loan Document on its part to be performed or observed if the failure to perform or observe such other term, covenant, condition or agreement shall remain unremedied for 30 days after written notice thereof shall have been given to such owing actions, at the same or different times:\n(iii)\nterminate the Commitments, and thereupon the Commitments shall terminate immediately;\n(iv)\ndeclare the Loans then outstanding to be due and payable in whole (or in part, in which case any principal not so declared to be due and payable may thereafter be declared to be due and payable), and thereupon the principal of the Loans so declared to be due and payable, together with accrued interest thereon and all fees and other Obligations accrued hereunder, shall become due and payable immediately, without presentment, demand, protest or other notice of any kind, all of which are hereby waived by each Loan Party;\n(v)\ndeclare the obligation of the Issuing Banks to issue further Letters of Credit to be terminated, and thereupon the obligation of the Issuing Banks to issue further Letters of Credit shall terminate immediately;\n(vi)\nrequire that the Parent Borrower Cash Collateralize the L/C Obligations as provided in\nSection 2.05(k)\n; and\n(vii)\nexercise on behalf of itself, the Lenders and the Issuing Banks all rights and remedies available to it, the Lenders and the Issuing Banks under the Loan Documents and Applicable Law;\n145\nprovided\nthat, in case of any Insolvency Event of Default, the Commitments shall automatically terminate and the principal of the Loans then outstanding, together with accrued interest thereon and all fees and other Obligations accrued hereunder, shall automatically become due and payable, and the obligation of the Parent Borrower to Cash Collateralize the L/C Obligations as provided in\nclause (iv)\nabove shall automatically become effective, in each case without presentment, demand, protest or other notice of any kind, all of which are hereby waived by each Loan Party, and the obligation of the Issuing Banks to issue Letters of Credit shall automatically be terminated.\n","found":true},{"n":7,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"If any Event of Default shall occur and be continuing, on the Business Day that the Parent Borrower receives written notice from the Administrative Agent or the Required Revolving Lenders (or, if the maturity of the Loans has been accelerated, Revolving Lenders with L/C Obligations representing more than 50% of the total L/C Obligations) demanding the deposit of cash collateral pursuant to this paragraph, the Borrowers shall promptly deposit into an account or accounts established and maintained on the books and records of the Administrative Agent (the \u201c\nCollateral Account\n\u201d) an amount in cash equal to 103% of the total L/C Obligations as of such date\nplus\nany accrued and unpaid interest thereon,\nprovided\nthat the obligation to deposit such cash collateral shall become effective immediately, and such deposit shall become immediately due and payable, without demand or other notice of any kind, upon the occurrence of any Insolvency Event of Default. ","found":true},{"n":8,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","text":"Default Rate\n\u201d means an interest rate (before as well as after judgment) equal to (a) with respect to overdue principal, the applicable interest rate\nplus\n2.00% per annum (\nprovided\nthat, with respect to a SOFR Loan, the determination of the applicable interest rate is subject to\nSection 2.07(e)\nto the extent that Loans may not be converted to, or continued as, SOFR Loans, pursuant thereto) and (b) with respect to any other overdue amount (including overdue interest), the interest rate applicable to Base Rate Loans in the case of overdue interest or fee\nplus\n2.00% per annum.\n\u201c\n","found":true},{"n":9,"document":"Credit and Guaranty Agreement","url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm tment, Lien, sale, conveyance, transfer or other Disposition, and whether in a single transaction or a series of transactions) of intellectual property that is material to the business of the Borrower and its Restricted Subsidiaries to any Unrestricted Subsidiary or Affiliate of the Borrower that is not a Loan Party;","summary":"Material IP may not be transferred (by any means, including investment or restricted payment) to an Unrestricted Subsidiary or non-Loan Party affiliate; only ordinary-course non-exclusive licenses are allowed. Section 5.10(a)(ix) also bars an Unrestricted Subsidiary from owning material IP after designation.","quote_verified":true},{"kind":"serta_protection","present":"yes","section":"Section 9.02(b)(ix); Section 8.07(e); Section 9.21","quote":"subordinate the Liens on all or substantially all of the Collateral or subordinate the right of payment of the Secured Obligations without the written consent of each Lender","summary":"Lien subordination (Section 9.21 extends this to all or any portion of the Collateral unless otherwise permitted) and payment subordination of the Secured Obligations require every lender's consent. Changes to pro rata sharing and payment waterfall in Section 2.18(b) and (d) also need each lender's consent. There is no explicit language addressing non-pro-rata exchanges, and loan buybacks are limited to Borrower Dutch auctions with Required Lender consent.","quote_verified":true},{"kind":"chewy_protection","present":"no","section":null,"quote":null,"summary":"The agreement has no express provision preventing release of a guarantor that ceases to be wholly owned. Guarantor releases arise when a guarantor stops being a Material Domestic Subsidiary (subject to Section 6.04 compliance), when it is designated unrestricted with Agent consent, or when its equity is sold in a permitted disposition.","quote_verified":null},{"kind":"unrestricted_sub_cap","present":"yes","section":"Section 5.10(a)(v); definition of Restricted Intercompany Transactions Amount","quote":"No Restricted Subsidiary shall be designated as an Unrestricted Subsidiary unless after giving effect thereto the aggregate amount of all such designations, when taken together with all other Restricted Intercompany Transactions, shall not exceed the Restricted Intercompany Transaction Amount;","summary":"Designations of unrestricted subsidiaries and investments, loans, guarantees and asset transfers to them share a hard $25M Restricted Intercompany Transactions cap, with a separate $50M general investment basket. Loan Party Guarantors cannot be designated unrestricted, and designations also require leverage tests and pro forma covenant compliance.","quote_verified":true},{"kind":"addback_cap","present":"yes","section":"Section 1.01, definition of Consolidated EBITDA, clause (xii)","quote":"so long as the aggregate amount added back to Consolidated EBITDA for any measurement period pursuant to this clause (xii) does not exceed 20% of Consolidated EBITDA for such Period (calculated prior to giving effect to any add-backs pursuant to this clause (xii))","summary":"Cost savings and acquisition synergy add-backs are capped at 20% of EBITDA, calculated before the add-back. Cash restructuring charges are separately capped at $100M per fiscal year through the Permitted Cash Restructuring Charges definition.","quote_verified":true},{"kind":"equity_cure","present":"no","section":null,"quote":null,"summary":"The agreement has no right to cure a financial covenant breach with new equity; a breach of Section 6.11 is an immediate Event of Default under Section 7.01(d).","quote_verified":null}],"accuracy":[{"metric":"secured_net_leverage","period_end":"2025-12-31","reported":null,"reported_limit":3.0,"our_limit":3.0,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1481792/000148179226000042/quad-20251231.htm"},{"metric":"total_leverage","period_end":"2025-1 74669320830836,"url":"https://www.sec.gov/Archives/edgar/data/1481792/000148179226000130/quad-20260630.htm"},{"metric":"total_leverage","period_end":"2026-09-30","reported":2.22,"reported_limit":3.5,"our_limit":3.5,"limit_match":true,"xbrl":null,"adjusted":2.290155440414508,"xbrl_error":null,"adjusted_error":0.03160154973626472,"url":"https://www.sec.gov/Archives/edgar/data/1481792/000148179226000150/quad-20260930.htm"},{"metric":"secured_net_leverage","period_end":"2026-09-30","reported":2.21,"reported_limit":3.0,"our_limit":3.0,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1481792/000148179226000150/quad-20260930.htm"},{"metric":"interest_coverage","period_end":"2026-09-30","reported":5.32,"reported_limit":3.0,"our_limit":3.0,"limit_match":true,"xbrl":null,"adjusted":4.742014742014742,"xbrl_error":null,"adjusted_error":-0.10864384548595074,"url":"https://www.sec.gov/Archives/edgar/data/1481792/000148179226000150/quad-20260930.htm"}],"notes":"Only document provided is Amendment No. 10 (Aug 20, 2025) with a conformed copy of the Second A&R Credit Agreement; it adds a $20M incremental Extended Term A Loan and a $15M Extended Revolving Commitment (Flagstar) and does not change Section 6.11. Covenants are tested quarterly with flat levels (3.50x total leverage and 3.00x senior secured leverage stated to apply from FQ ending 9/30/2024 onward; 3.00x minimum interest coverage). Senior Secured Leverage uses Consolidated Senior Secured Net Indebtedness, which nets unrestricted cash and Permitted Investments held in U.S. accounts free of non-permitted liens, with no dollar cap; proceeds of newly incurred debt are excluded from cash netting in pro forma tests. Total Leverage is gross (not net); pension/post-employment liabilities are excluded from debt, while Attributable Receivables Indebtedness is included. Interest coverage uses cash Consolidated Interest Expense. Consolidated EBITDA add-backs: non-cash unusual/non-recurring losses including goodwill/asset impairments, non-cash stock compensation, Transaction Charges (acquisition-related portion capped at $10M after Amendment No. 9), MEPP Exit Expenses (up to $150M), Permitted Cash Restructuring Charges (capped at $100M per fiscal year, amounts over $25M limited to plant closures, severance, equipment relocation and lease/contract termination, with synergy calculations subject to Agent approval), losses on debt extinguishment, and cost savings/synergies capped at 20% of EBITDA. Material acquisitions/dispositions (>$50M) are given pro forma effect. Financial covenant compliance on a pro forma basis is a condition to incremental facilities, unrestricted subsidiary designations, and several debt baskets. Other features: MFN-style 'More Favorable Term' provision for unsecured/subordinated debt and Senior Secured Notes (Section 6.09(b)); collateral may be released upon BBB/Baa2 ratings (Section 9.02(e)); restricted payments basket tied to Total Leverage below 2.50x/2.75x with dollar caps. No equity cure.","compliance":{"form":"10-Q","filed":"2026-10-29","url":"https://www.sec.gov/Archives/edgar/data/1481792/000148179226000150/quad-20260930.htm","sentences":["\u201d), including trade restrictions, currency fluctuations, the global economy, costs incurred or reputational damage suffered due to improper conduct of its employees, contractors or agents, and geopolitical events like war and terrorism; \u2022 The impact of significant capital expenditures and investments that may be needed to sustain and grow the Company\u2019s platforms, processes, systems, client and product technology, marketing and talent, to remain technologically and economically competitive, and to adapt to future changes, such as artificial intelligence; \u2022 The impact of the various restrictive covenants in the Company\u2019s debt facilities on the Company\u2019s ability to operate its business, as well as the uncertain negative impacts macroeconomic conditions may have on the Company\u2019s ability to continue to be in compliance with these restrictive covenants; \u2022 The impact of an other than temporary decline in operating results and enterprise value that could lead to non-cash impairment charges due to the impairment of property, plant and equipment, goodwill and other intangible assets; \u2022 The impact of regulatory matters and legislative developments or changes in laws, including changes in cyber-security, consumer protection, safety, privacy and environmental laws; and \u2022 The impact on the holders of Quad\u2019s class A common stock of a limited active market for such shares and the inability to independently elect directors or control decisions due to the voting power of the class B common stock.","The Company was in compliance with all financial covenants in its debt agreements as of September 30, 2026."]},"qa":[]},{"cik":"1766368","name":"Mayville Engineering Company Inc.","borrower":"Mayville Engineering Company, Inc.","gold":false,"facility":"Senior secured revolving credit facility reduced to $275,000,000 (from $350,000,000) by the Third Amendment, with $25M swingline and $5M L/C sublimits; incremental capacity of the greater of $100M and 125% of trailing EBITDA (unavailable during the Covenant Adjustment Period); matures June 28, 2028.","stale":true,"agreement_date":"2023-06-28","cov_lite":false,"tightest":null,"chain":{"source":"automatic","notes":["Third Amendment to Amended and Restated Credit Agreement restates the full agreement; used as the base"],"used":[{"url":"https://www.sec.gov/Archives/edgar/data/1766368/000110465926020541/tmb-20260225xex10d2.htm","title":"Third Amendment to Amended and Restated Credit Agreement","dated":"2026-02-25"}]},"covenants":[{"name":"Consolidated Total Leverage Ratio","metric":"net_leverage","direction":"max","section":"Section 9.15(a)","quote":"permit the Consolidated Total Leverage Ratio to be greater than the corresponding ratio set forth below","quote_verified":true,"thresholds":[{"value":4.0,"applies_from":"2023-06-30"},{"value":5.25,"applies_from":"2026-03-31"},{"value":5.0,"applies_from":"2026-09-30"},{"value":4.0,"applies_from":"2026-12-31"},{"value":3.5,"applies_from":"2027-03-31"}],"test_frequency":"quarterly","springing_condition":null,"cash_netting_cap":25000000.0,"cash_netting_cap_pct_ebitda":null,"latest":null,"steps":[],"rows":[]},{"name":"Consolidated Interest Coverage Ratio","metric":"interest_coverage","direction":"min","section":"Section 9.15(b)","quote":"permit the Consolidated Interest Coverage Ratio to be less than","quote_verified":true,"thresholds":[{"value":3.0,"applies_from":"2023-06-30"},{"value":2.75,"applies_from":"2026-06-30"},{"value":3.0,"applies_from":"2027-03-31"}],"test_frequency":"quarterly","springing_condition":null,"cash_netting_cap":null,"cash_netting_cap_pct_ebitda":null,"latest":null,"steps":[],"rows":[]}],"terms":[{"kind":"j_crew_blocker","present":"no","section":null,"quote":null,"summary":"The agreement has no unrestricted subsidiary concept and no specific restriction on transferring or exclusively licensing material IP to non-guarantor entities. Asset sale and investment covenants limit such transfers generally, but there is no dedicated J.Crew blocker.","quote_verified":null},{"kind":"serta_protection","present":"partial","section":"Section 12.2(e)","quote":"sharing of payments or order of application required thereby without the written consent of each Lender directly and adversely affected thereby","summary":"Changing the pro rata sharing (Section 5.6) or the payment waterfall (Section 10.4) requires each directly and adversely affected lender's consent. There is no express requirement of each affected lender's consent to subordinate the loans or liens to other debt.","quote_verified":true},{"kind":"chewy_protection","present":"yes","section":"Section 1.1 (Change in Control, clause (a)); Section 11.9(a)(iii)","quote":"at any time, the Borrower shall fail to own, directly or indirectly, one hundred percent (100%) of the Equity Interests of the Subsidiary Guarantors entitled to vote in the election of members of the board of directors (or equivalent governing body) of the Subsidiary Guarantors","summary":"A guarantor is released only if it ceases to be a Subsidiary in a permitted transaction, not merely because it stops being wholly owned. Failing to own 100% of any Subsidiary Guarantor is a Change in Control and therefore an Event of Default.","quote_verified":true},{"kind":"unrestricted_sub_cap","present":"no","section":null,"quote":null,"summary":"The agreement has no unrestricted subsidiary designation mechanism, so there is no cap. All domestic subsidiaries must become guarantors, and investments are limited to enumerated baskets.","quote_verified":null},{"kind":"addback_cap","present":"yes","section":"Section 1.1 (Consolidated EBITDA)","quote":"in no event shall the amount of cash items added back to Consolidated EBITDA under clauses (v), (vii), (viii), (xi), (xii) and (xiii) for any period exceed fifteen percent (15%) of aggregate Consolidated EBITDA for such period (calculated before giving effect to any such add back)","summary":"Cash add-backs for restructuring, discontinued operations, casualty/disposition items, transaction costs, CFO transition and Peloton legal fees are capped at 15% of pre-add-back EBITDA. Start-up costs have a separate $10M lifetime cap, and there is no projected synergy add-back.","quote_verified":true},{"kind":"equity_cure","present":"no","section":null,"quote":null,"summary":"The agreement contains no equity cure right for financial covenant defaults.","quote_verified":null}],"accuracy":[{"metric":"total_leverage","period_end":"2025-12-31","reported":3.68,"reported_limit":4.0,"our_limit":4.0,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1766368/000110465926023496/tmb-20251231x10k.htm ta/1766368/000110465926122720/tmb-20260930x10q.htm"}],"notes":"Source is the Third Amendment (Feb 25, 2026) with a conformed copy of the A&R Credit Agreement attached. The conformed text shows deleted and added language without visible markup, so the readings below rely on context.\n\nLeverage covenant:\n- The leverage test is a net ratio: debt minus unrestricted cash.\n- Netted cash is capped at $25M, but only $10M during the Covenant Adjustment Period.\n- The Covenant Adjustment Period runs from Feb 25, 2026 until Q1 2027 compliance is shown.\n- The Borrower may end that period early by showing compliance with the pre-amendment covenants (3.50x leverage / 3.00x coverage). If it does, the covenants revert to 3.50x / 3.00x.\n- After the Covenant Adjustment Period, a Leverage Increase Period adds 0.50x for four quarters after an Acquisition over $40M. The ratio may never exceed 4.00x, at most two such periods are allowed, and at least one quarter must pass at the base level between them.\n- No Leverage Increase Period applies during the Covenant Adjustment Period. The 4.00x level through Q4 2025 reflects the Accu-Fab acquisition.\n\nInterest coverage covenant:\n- Despite its name, the numerator is EBITDA minus 50% of capex, minus cash-paid discretionary ESOP repurchase payments, minus income taxes, plus mandatory ESOP repurchase payments.\n\nEBITDA definition:\n- It adds back non-cash stock/ESOP compensation, non-cash charges, facility-exit/workforce-reduction restructuring, discontinued operations, and casualty/condemnation items.\n- It also adds back acquisition transaction costs (max $7M per deal), CFO transition costs ($1.17M), and Peloton litigation legal fees.\n- Other add-backs: data center/critical power start-up costs ($10M lifetime cap), fair value step-up and earn-out adjustments, one-time non-operating items, and fixed Accu-Fab EBITDA figures for Q4 2024 to Q2 2025.\n- Cash add-backs under clauses (v), (vii), (viii), (xi), (xii) and (xiii) are capped at 15% of EBITDA.\n- There is no projected cost-savings or synergy add-back.\n\nOther terms:\n- Section 9.14 caps annual capex at $40M from FY2026, with a limited carry-forward from FY2027.\n- Restrictions during the Covenant Adjustment Period:\n  - no incremental facility;\n  - only one acquisition, up to $25M, equity-funded, with pro forma leverage at or below 3.25x;\n  - no new general debt or lien basket usage;\n  - pricing grid tops out at SOFR+3.25%.\n- Monthly financials are required from February 2026.\n- A Specified Disposition is permitted, and a 0.075% consent fee was paid.\n- Collateral release on asset sales now requires a bona fide purpose and no transfer to an Affiliate.\n- Restricted payments to shareholders require leverage at or below 2.75x.","compliance":{"form":"10-Q","filed":"2026-11-04","url":"https://www.sec.gov/Archives/edgar/data/1766368/000110465926122720/tmb-20260930x10q.htm","sentences":["The Company was in compliance with all financial covenants of its Credit Agreement as of September 30, 2026 and December 31, 2025.","Based on our estimates at this time, we expect to be in compliance with these financial covenants through 2026 and the foreseeable future."]},"qa":[]},{"cik":"1280058","name":"Blackbaud Inc.","borrower":"Blackbaud, Inc.","gold":false,"facility":"$700M multicurrency revolving credit facility (Dollar Tranche and Designated Currency Tranche, $50M L/C and $50M swingline sublimits) and an $800M term loan amortizing $5M per quarter from September 30, 2024; all maturing April 30, 2029.","stale":true,"agreement_date":"2020-10-30","cov_lite":false,"tightest":{"name":"Net Leverage Ratio","period_end":"2026-09-30","basis":"reported","value":2.29,"limit":3.75,"headroom":0.3893333333333333,"cushion":0.3893333333333333},"chain":{"source":"automatic","notes":["Third Amendment to Credit Agreement restates the full agreement; used as the base"],"used":[{"url":"https://www.sec.gov/Archives/edgar/data/1280058/000128005824000037/blkbq1202410-qexx1  other Loan Document, the Borrowers shall not, and shall not permit any of their Restricted Subsidiaries to consummate any transaction that results in the transfer (whether by way of any dividend, distribution, Investment, disposition, designation of any Restricted Subsidiary as an Unrestricted Subsidiary, or otherwise, and whether in a single transaction or a series of related transactions) of Material Intellectual Property from any Borrower or any of their Restricted Subsidiaries to any Unrestricted Subsidiary.","summary":"Added by the Third Amendment: no transfer of Material Intellectual Property to an Unrestricted Subsidiary by any means, including designating a Restricted Subsidiary that owns it as unrestricted. Exclusive licenses are not named expressly, but the ban covers transfers 'or otherwise'; only non-exclusive ordinary-course licenses are expressly permitted under Section 10.5(g).","quote_verified":true},{"kind":"serta_protection","present":"yes","section":"Section 13.2(a)","quote":"subordinate, or have the effect of subordinating, the Obligations or Liens securing the Obligations hereunder to any other Indebtedness, Liens securing the Obligations or other obligation without the written consent of each Lender directly affected thereby;","summary":"Added by the Third Amendment: subordinating the loans or their liens to other debt requires the consent of each directly affected lender. Changes to the pro rata sharing provisions (Sections 4.4 and 4.6) and to the payment waterfall (Section 11.4) also require the consent of each affected lender.","quote_verified":true},{"kind":"chewy_protection","present":"partial","section":"Section 12.10(c)","quote":"to release any Guarantor from its obligations under the Guaranty Agreement if such Person ceases to be a Material Domestic Subsidiary as a result of a transaction permitted under the Loan Documents.","summary":"There is no express Chewy language. However, automatic guarantor release is triggered only when a guarantor stops being a Material Domestic Subsidiary, not when it stops being wholly owned. A non-wholly-owned subsidiary that is more than 50% owned remains a Material Domestic Subsidiary if it meets the size tests.","quote_verified":true},{"kind":"unrestricted_sub_cap","present":"no","section":"Section 8.14; Section 10.3","quote":null,"summary":"Designating an unrestricted subsidiary counts as an Investment and must fit an investment basket. The dedicated basket for Foreign and Unrestricted Subsidiaries is $75M, but Section 10.3(k) allows unlimited other Investments if there is no default and pro forma covenant compliance, so there is no hard cap.","quote_verified":null},{"kind":"addback_cap","present":"yes","section":"Section 1.1 (definitions of EBITDA and Transaction Costs)","quote":"provided that the aggregate amount of Pro Forma Adjustments added back to EBITDA shall not exceed ten percent (10%) of EBITDA (determined prior to giving effect to the add back in this clause (vi))","summary":"Pro Forma Adjustments (synergies, cost savings and operating improvements from acquisitions, investments and dispositions) are capped at 10% of EBITDA. Cash Transaction Costs, which include acquisition restructuring costs and projected synergies, are separately capped at 10% of pro forma EBITDA per acquisition.","quote_verified":true},{"kind":"equity_cure","present":"no","section":null,"quote":null,"summary":"The agreement contains no equity cure right; a breach of Article IX is an immediate Event of Default under Section 11.1(d).","quote_verified":null}],"accuracy":[{"metric":"net_leverage","period_end":"2025-03-31","reported":2.91,"reported_limit":null,"our_limit":3.75,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1280058/000128005826000006/blkb-20251231.htm"},{"metric":"net_leverage","period_end":"2025-12-31","reported":2.52,"reported_limit":3.75,"our_limit":3.75,"limit_match":true,"xbrl":2 anty requires all-lender consent unless done in a permitted merger or disposition. Sales of minority stakes in subsidiaries are prohibited, and non-wholly-owned subsidiaries are generally barred except as permitted Investments. There is no express anti-Chewy clause.","quote_verified":true},{"kind":"unrestricted_sub_cap","present":"no","section":null,"quote":null,"summary":"The agreement has no unrestricted subsidiary designation mechanism, so no such cap exists. Separately, investments in non-guarantor non-wholly-owned subsidiaries, joint ventures and foreign subsidiaries are capped at 10% of Consolidated Total Assets under Section 7.02(k).","quote_verified":null},{"kind":"addback_cap","present":"yes","section":"Definition of Consolidated EBITDA, clause (b)(ix)","quote":"shall not exceed ten percent (10%) of Consolidated EBITDA (determined without giving effect to this add back)","summary":"Pro forma run-rate cost savings, operating expense reductions and synergies from acquisitions, dispositions, restructurings and other initiatives are capped at 10% of Consolidated EBITDA. Transaction-related fees and expenses are separately capped at 20%.","quote_verified":true},{"kind":"equity_cure","present":"no","section":null,"quote":null,"summary":"The agreement contains no equity cure right for the financial covenants. A breach of Section 7.11 is an immediate Event of Default under Section 8.01(b)(ii).","quote_verified":null}],"accuracy":[{"metric":"interest_coverage","period_end":"2026-06-30","reported":13.5,"reported_limit":3.0,"our_limit":3.0,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1728688/000172868826000045/iiiv-20260630.htm"},{"metric":"total_leverage","period_end":"2026-06-30","reported":1.9,"reported_limit":5.0,"our_limit":4.0,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1728688/000172868826000045/iiiv-20260630.htm"}],"notes":"Acquisition holiday: the 4.00x max total net leverage steps up by 0.25x (to 4.25x) for the four fiscal quarters beginning with the quarter in which a Qualified Acquisition (consideration > $20M, with election certificate) closes; at most three such Leverage Increase Periods over the life of the deal, only one at a time, and at least one quarter at the base level between them. Net leverage nets up to $20M of unrestricted cash of Loan Parties. Interest coverage excludes non-cash interest on Permitted Convertible Indebtedness. EBITDA add-backs include a general add-back for non-cash charges (other than write-downs of current assets and accruals for future cash charges), which covers non-cash stock compensation and impairments. There is no express add-back for restructuring charges themselves. Other add-backs: transaction/financing fees (capped at 20% of EBITDA); run-rate cost savings and synergies, including from restructurings (capped at 10% of EBITDA, actions taken within 12 months); legal expenses on pre-closing acquisition claims (lifetime cap $1M); the Louisiana Claim Amount (up to $15M, in one quarter only); indemnified and insured expenses; earn-out mark-to-market losses; and deferred revenue write-downs. A Consolidated Senior Secured Leverage Ratio is defined but is not a maintenance covenant. Pricing grid is based on total net leverage (SOFR +1.50%-2.50%). Incurrence-style tests include: Restricted Payments under 7.06(j) require net leverage \u2264 2.75x pro forma; junior debt prepayments require a 0.25x cushion to the covenant level; Permitted Acquisitions are capped at $75M of consideration each and require pro forma covenant compliance. The agreement has no unrestricted subsidiary concept. All Subsidiaries are subject to the covenants, and minority-owned subsidiaries are restricted by Sections 7.14 and 7.05(c)(iii). Specified Refinancing Notes and Incremental Equivalent Debt may be secured on a junior or pari basis u  any guarantor's status on 15 business days' notice, subject only to pro forma covenant compliance (Section 10.12).\n\nConsolidated EBITDA definition:\n- Starts from net income and adds back interest, taxes, depreciation and amortization (including goodwill and intangibles) and other non-cash expenses (excluding accruals or reserves for future cash charges).\n- Net income excludes non-operating, non-recurring and extraordinary gains and losses.\n- Actuarial non-cash VEBA retiree medical and pension income or expense are excluded.\n- There is no add-back for projected cost savings or synergies. Pro forma adjustments for acquisitions and dispositions cover only actual historical income statement items.\n\nCash netting in the net leverage ratio:\n- Nets domestically held unrestricted, unencumbered cash and Cash Equivalents of Loan Parties.\n- Also nets up to $40M of non-domestic cash held with the Administrative Agent or its affiliates.\n- The aggregate netted amount is capped at $200M.\n\nOther points:\n- The Consolidated Total Leverage Ratio is used only for pricing.\n- Several incurrence-style tests are not maintenance covenants:\n  - Permitted Acquisitions require net leverage below 3.00x.\n  - Non-Loan Party investments are capped at $75M when net leverage is at or above 3.00x.\n  - Share repurchases and dividends are capped at $75M per 12 months when net leverage is at or above 2.75x.\n  - Incrementals require pro forma net leverage at least 0.25x inside the covenant.\n- Leases are accounted for on a pre-ASC 842 basis.\n- Ratio amendments need only Required Lenders.\n- There is no unrestricted subsidiary concept in the agreement.","compliance":{"form":"10-Q","filed":"2026-10-22","url":"https://www.sec.gov/Archives/edgar/data/17843/000001784326000045/crs-20260930.htm","sentences":["As of September 30, 2026, the Company was in compliance with all of the covenants of the Credit Facility.","As of September 30, 2026, we were in compliance with all of the covenants of
