<style>
/* Layout: a credit desk watchlist. Summary strip, then the ranked table; each borrower opens its own page
   (#b-<cik>) with covenant charts and the contract language behind every number. */
:root {
  color-scheme: light;
  --bg: #f6f7f8;            /* page plane: cool grey with a slight blue bias */
  --surface: #fdfdfd;       /* cards, table */
  --ink: #0e1419;
  --ink-2: #4a545d;
  --muted: #7d868e;
  --line: #e1e5e8;
  --line-strong: #c5ccd2;
  --accent: #1d4e6e;        /* deep ledger blue: links, focus, selected row */
  --accent-wash: #e6eef4;
  --clause: #f1f3f0;        /* contract quote ground */
  --series-1: #2a78d6;      /* company reported */
  --series-2: #eb6834;      /* estimate: company adjusted EBITDA */
  --series-3: #1baf7a;      /* estimate: GAAP line items */
  --limit: #52514e;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-ink: #006300; --critical-ink: #b02a2a; --warning-ink: #7a5200;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #0f1215; --surface: #171b1f; --ink: #eef1f3; --ink-2: #b9c1c8; --muted: #87909a;
  --line: #262c32; --line-strong: #39414a; --accent: #7fb3d9; --accent-wash: #1b2a36; --clause: #1d2226;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --limit: #c3c2b7;
  --good-ink: #3cc23c; --critical-ink: #f07a7a; --warning-ink: #fab219;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1215; --surface: #171b1f; --ink: #eef1f3; --ink-2: #b9c1c8; --muted: #87909a;
  --line: #262c32; --line-strong: #39414a; --accent: #7fb3d9; --accent-wash: #1b2a36; --clause: #1d2226;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --limit: #c3c2b7;
  --good-ink: #3cc23c; --critical-ink: #f07a7a; --warning-ink: #fab219;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, tr:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: 0.005em; }
h1 { font-size: 30px; line-height: 1.1; }
h2 { font-size: 21px; }
h3 { font-size: 17px; }
.num, td.n, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 11.5px/1.2 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--ink-2); max-width: 68ch; }
.small { font-size: 13px; color: var(--ink-2); }
header.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between;
  border-bottom: 1px solid var(--line-strong); padding-bottom: 16px; margin-bottom: 22px; }
header.top .mark { display: flex; align-items: baseline; gap: 12px; }
header.top .mark span { font: 500 13px var(--f-data); color: var(--muted); }
nav.top a { margin-left: 16px; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 22px 0 28px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.stat .v { font: 500 26px/1.15 var(--f-data); font-variant-numeric: normal; margin: 6px 0 4px; }
.stat .v small { font-size: 15px; color: var(--muted); }
.stat p { margin: 0; font-size: 13px; color: var(--ink-2); }
@media (max-width: 860px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .stats { grid-template-columns: 1fr; } }
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 14px 0 10px; }
.filters input[type=search], .filters select { font: 14px var(--f-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--r); padding: 7px 10px; min-width: 0; }
.filters input[type=search] { width: min(280px, 100%); }
.filters label { font-size: 14px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 12px var(--f-body); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
  white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
th button { all: unset; cursor: pointer; }
th button:hover { color: var(--ink); }
td.n, th.n { text-align: right; white-space: nowrap; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover { background: var(--accent-wash); }
tbody tr:last-child td { border-bottom: 0; }
.co { font-weight: 600; min-width: 190px; }
.watch td.test { min-width: 150px; }
.co small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12.5px var(--f-body); white-space: nowrap; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.chip.over i { background: var(--critical); } .chip.over { color: var(--critical-ink); }
.chip.close i { background: var(--warning); } .chip.close { color: var(--warning-ink); }
.chip.pass i { background: var(--good); } .chip.pass { color: var(--good-ink); }
.chip.na i { background: var(--line-strong); } .chip.na { color: var(--muted); }
.basis { font: 500 10.5px var(--f-body); letter-spacing: 0.05em; text-transform: uppercase; border-radius: 3px;
  padding: 1px 5px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.basis.reported { background: var(--series-1); color: #fff; }
.basis.adjusted { border: 1px solid var(--series-2); color: var(--ink-2); }
.basis.xbrl { border: 1px solid var(--series-3); color: var(--ink-2); }
.terms { display: inline-flex; gap: 4px; }
.terms b { width: 16px; height: 16px; border-radius: 3px; font: 600 10px/16px var(--f-body); text-align: center; color: #fff; }
.terms b.open { background: var(--critical); } .terms b.partial { background: var(--warning); color: #0b0b0b; }
.terms b.shut { background: var(--line-strong); color: var(--ink-2); }
section { margin-top: 40px; }
section > h2 { margin-bottom: 6px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.steps { counter-reset: s; display: grid; gap: 10px; padding: 0; list-style: none; margin: 14px 0 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; }
.steps li::before { content: counter(s); font: 500 13px/22px var(--f-data); color: var(--accent); }
.back { display: inline-block; margin-bottom: 14px; font-size: 14px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
.facts b { color: var(--ink); font-weight: 500; }
.cov { margin-top: 18px; }
.cov > svg { max-width: 560px; margin: 10px 0 2px; }
.cov-head { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; justify-content: space-between; }
.cov-head .lim { font: 500 14px var(--f-data); color: var(--ink-2); }
.clause { background: var(--clause); border-radius: var(--r); padding: 12px 14px 12px 14px; margin: 12px 0 0;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.clause .sec { font: 500 12px/1.6 var(--f-data); color: var(--muted); max-width: 9.5rem; }
@media (max-width: 560px) { .clause { grid-template-columns: 1fr; } .clause .sec { max-width: none; } }
.clause q { quotes: "\201C" "\201D"; color: var(--ink); }
.ok { color: var(--good-ink); font-size: 12.5px; white-space: nowrap; }
.bad { color: var(--critical-ink); font-size: 12.5px; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); margin: 14px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
.legend i.dash { border-top-style: dashed; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--r); padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  min-width: 170px; z-index: 2; }
.tip .row2 { display: flex; justify-content: space-between; gap: 14px; }
.tip .row2 span:last-child { font-family: var(--f-data); }
.toggle { all: unset; cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 6px; }
.toggle:hover { text-decoration: underline; }
.termgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
@media (max-width: 760px) { .termgrid { grid-template-columns: 1fr; } }
.term h3 { font-size: 15px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.term p { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); }
.term blockquote { margin: 8px 0 0; padding: 8px 10px; background: var(--clause); border-radius: var(--r); font-size: 13px; }
.state { font: 500 12.5px var(--f-body); white-space: nowrap; }
.state.open { color: var(--critical-ink); } .state.partial { color: var(--warning-ink); } .state.shut { color: var(--good-ink); }
.strip svg { width: 100%; height: auto; display: block; }
.note { border-left: 3px solid var(--line-strong); padding: 2px 0 2px 12px; color: var(--ink-2); font-size: 14px; margin: 12px 0 0; }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { tbody tr.row { transition: background 120ms; } }

/* explainer */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; margin-bottom: 6px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 18px; } }
.hero .lead { font-size: 17px; line-height: 1.55; margin: 0 0 12px; max-width: 60ch; text-wrap: pretty; }
.hero p { margin: 0 0 10px; color: var(--ink-2); max-width: 62ch; text-wrap: pretty; }
.example { border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); padding: 14px 16px 12px; }
.example .who { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.example .who b { color: var(--ink); font-weight: 600; font-size: 14px; }
.example svg { width: 100%; height: auto; display: block; margin: 8px 0 6px; }
.example p { margin: 0; font-size: 14px; color: var(--ink-2); }
.example .src { font-size: 12.5px; margin-top: 6px; display: inline-block; }
/* report card: the four numbers that grade the tool */
.report { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 26px 0 8px; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
.report > div { padding: 12px 16px 12px 0; min-width: 0; }
.report > div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.report .num { display: block; font-size: 22px; line-height: 1.2; font-weight: 500; }
.report .num small { font-size: 14px; color: var(--muted); font-weight: 400; }
.report span.cap { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
@media (max-width: 860px) { .report { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .report > div:nth-child(3) { padding-left: 0; border-left: 0; } .report > div:nth-child(n+3) { border-top: 1px solid var(--line); } }
@media (max-width: 420px) { .report { grid-template-columns: 1fr; } .report > div, .report > div + div { padding-left: 0; border-left: 0; }
  .report > div + div { border-top: 1px solid var(--line); } }
/* findings log */
.log { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 0; }
.log li { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 4px 18px; padding: 12px 0; border-top: 1px solid var(--line); }
.log li:last-child { border-bottom: 1px solid var(--line); }
.log time { font: 500 13px/1.6 var(--f-data); color: var(--muted); }
.log h3 { font-size: 16px; margin-bottom: 2px; }
.log p { margin: 0; color: var(--ink-2); max-width: 72ch; }
@media (max-width: 560px) { .log li { grid-template-columns: 1fr; } }
/* glossary */
.gl { all: unset; cursor: help; border-bottom: 1px dotted var(--muted); color: inherit; }
.gl:hover, .gl:focus-visible { border-bottom-color: var(--accent); color: var(--accent); }
.gl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
#glpop { position: fixed; z-index: 20; max-width: min(320px, calc(100vw - 32px)); background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: var(--r); padding: 9px 11px; font-size: 13.5px; line-height: 1.45;
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.16); }
#glpop b { display: block; font-size: 12.5px; margin-bottom: 2px; }
/* headroom gauge in the watchlist */
.gauge { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.gauge svg { width: 96px; height: 14px; flex: none; }
/* phone: the watchlist becomes a stack of entries */
@media (max-width: 700px) {
  .co { min-width: 0; } .watch td.test { min-width: 0; }
  .tablebox.watch { overflow: visible; background: transparent; border: 0; }
  .watch table, .watch tbody { display: block; }
  .watch thead { display: none; }
  .watch tr.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 14px; margin-bottom: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  .watch td { display: block; border: 0; padding: 0; text-align: left; }
  .watch td.co, .watch td.test, .watch td.gaugecell { grid-column: 1 / -1; }
  .watch td.test { color: var(--ink-2); font-size: 13.5px; }
  .watch td[data-label]::before { content: attr(data-label); display: block; font-size: 11.5px; color: var(--muted); }
  .watch td[data-label]:empty { display: none; }
  .watch td.n { text-align: left; }
}
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; }
.foot .by { color: var(--ink-2); }
.foot .by a { margin-left: 10px; }
</style>
</head>

alse,"limit":2.5,"xbrl":null,"adjusted":null,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":60120000.0,"ltm_ebitda_adjusted":93145000.0,"debt":321479000,"cash":93260000},{"period_end":"2026-06-30","before_agreement":false,"limit":2.5,"xbrl":null,"adjusted":null,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":61691000.0,"ltm_ebitda_adjusted":95602000.0,"debt":307353000,"cash":90595000},{"period_end":"2026-09-30","before_agreement":false,"limit":2.5,"xbrl":null,"adjusted":null,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":61365000.0,"ltm_ebitda_adjusted":98478000.0,"debt":307708000,"cash":101708000}]},{"name":"Consolidated Interest Coverage Ratio","metric":"interest_coverage","direction":"min","section":"Section 9.16(c)","quote":"As of the last day of any fiscal quarter (commencing with the fiscal quarter ending September 30, 2024), the Borrower shall not permit the Consolidated Interest Coverage Ratio to be less than 3.00 to 1.00.","quote_verified":true,"thresholds":[{"value":3.0,"applies_from":null}],"test_frequency":"quarterly","springing_condition":null,"cash_netting_cap":null,"cash_netting_cap_pct_ebitda":null,"latest":{"period_end":"2026-09-30","basis":"adjusted","value":5.678911250792918,"limit":3.0,"headroom":0.8929704169309728,"cushion":0.47172972643636135},"steps":[],"rows":[{"period_end":"2024-12-31","before_agreement":false,"limit":3.0,"xbrl":2.264413995742512,"adjusted":null,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":75525000.0,"ltm_ebitda_adjusted":null,"debt":364530000,"cash":104200000},{"period_end":"2025-03-31","before_agreement":false,"limit":3.0,"xbrl":2.828666481840865,"adjusted":null,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":81624000.0,"ltm_ebitda_adjusted":null,"debt":349964000,"cash":88050000},{"period_end":"2025-06-30","before_agreement":false,"limit":3.0,"xbrl":3.29272345635823,"adjusted":4.087939478747595,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":75298000.0,"ltm_ebitda_adjusted":93483000.0,"debt":335382000,"cash":81300000},{"period_end":"2025-09-30","before_agreement":false,"limit":3.0,"xbrl":3.4193890431709164,"adjusted":4.487250694269124,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":67721000.0,"ltm_ebitda_adjusted":88870000.0,"debt":325789000,"cash":75900000},{"period_end":"2025-12-31","before_agreement":false,"limit":3.0,"xbrl":3.308032345013477,"adjusted":4.917735849056604,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":61364000.0,"ltm_ebitda_adjusted":91224000.0,"debt":321170000,"cash":86882000},{"period_end":"2026-03-31","before_agreement":false,"limit":3.0,"xbrl":3.384182381086406,"adjusted":5.2431747818744725,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":60120000.0,"ltm_ebitda_adjusted":93145000.0,"debt":321479000,"cash":93260000},{"period_end":"2026-06-30","before_agreement":false,"limit":3.0,"xbrl":3.4318535825545173,"adjusted":5.3183133066310635,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":61691000.0,"ltm_ebitda_adjusted":95602000.0,"debt":307353000,"cash":90595000},{"period_end":"2026-09-30","before_agreement":false,"limit":3.0,"xbrl":3.538723257020933,"adjusted":5.678911250792918,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":61365000.0,"ltm_ebitda_adjusted":98478000.0,"debt":307708000,"cash":101708000}]}],"terms":[{"kind":"j_crew_blocker","present":"no","section":null,"quote":null,"summary":"There is no specific blocker on transferring or exclusively licensing material IP to unrestricted subsidiaries. The agreement has no unrestricted subsidiary concept at all, so all subsidiaries remain subject to the covenants. IP could still move to non-guarantor subsidiaries within the investment and asset-disposition baskets.","quote_verified":null},{"kind":"serta_protection","present":"yes","section":"Section 12.2(a)","quote":"(a) (i) subordinate any of the Obligations in right of payment or otherwise adversely affect the priority of payment of any of such Obligations or (ii) subordinate any of the Liens securing the Obligations, in each case without the consent of each of the Lenders directly affected thereby;","summary":"Subordinating the loans in right of payment, adversely affecting payment priority, or subordinating the liens requires the consent of each directly affected lender. Changes to pro rata sharing or the payment waterfall (Section 12.2(e)) also require each affected lender's consent.","quote_verified":true},{"kind":"chewy_protection","present":"partial","section":"Section 11.9(a)(iii)","quote":"to release any Subsidiary that is a Guarantor from its obligations under any Loan Documents if such Person ceases to be a Subsidiary as a result of a transaction permitted under the Loan Documents, as certified by the Borrower","summary":"There is no express clause saying guarantors stay bound when they become non-wholly owned. However, automatic release applies only when a guarantor ceases to be a Subsidiary (more than 50% owned), not merely when it stops being wholly owned. Section 9.10(q) also limits issuance of subsidiary equity to third parties to non-dilutive issuances.","quote_verified":true},{"kind":"unrestricted_sub_cap","present":"no","section":null,"quote":null,"summary":"The agreement has no unrestricted subsidiaries and no mechanism to designate them, so there is no cap specific to them. Investments in non-guarantor subsidiaries are limited to $10M under Section 9.5(a)(iii), plus general baskets.","quote_verified":null},{"kind":"addback_cap","present":"partial","section":"Section 1.1 (definition of Adjusted Cash EBITDA, clause (b)(iv))","quote":"(iv) unusual and non-recurring charges and losses in an aggregate amount not to exceed 15% of Adjusted Cash EBITDA for such period (calculated prior to giving effect to any add-back under this clause (b)(iv))","summary":"There is no add-back for projected cost savings or synergies. Unusual and non-recurring charges, which would capture restructuring-type costs, are capped at 15% of Adjusted Cash EBITDA.","quote_verified":true},{"kind":"equity_cure","present":"no","section":null,"quote":null,"summary":"The agreement has no equity cure right. A breach of Section 9.16 is an immediate Event of Default under Section 10.1(c)(i).","quote_verified":null}],"accuracy":[],"notes":"The First Amendment (July 29, 2025) replaced the stepped net leverage covenant with a flat 4.50x maximum. The original schedule was 4.50x through 6/30/25, 4.25x from 9/30/25 and 4.00x from 9/30/26. In exchange, the borrower made a $10M prepayment applied to the maturity bullet. The amendment also cut the combined restricted payment / junior debt payment basket from the greater of $35M and 30% of EBITDA to a flat $10M. It added a $25M carve-out allowing acquisitions that miss the 3.75x pro forma leverage condition.\n\nAdjusted Cash EBITDA is a cash-oriented definition:\n- It adds back interest, taxes, D&A, impairments, stock-based compensation, and certain non-cash losses (tax, debt extinguishment, warrant remeasurement, asset sales).\n- Unusual and non-recurring charges are added back but capped at 15% of EBITDA.\n- Losses on non-ordinary-course asset sales are added back, and other cash items can be added only with Agent and Required Lender approval.\n- It deducts deferred sales commission costs and capitalized software costs.\n- There is no add-back for projected cost savings or synergies.\n- EBITDA is deemed for the quarters from June 2023 through March 2024 ($31.68M, $31.671M, $31.435M, $25.465M).\n\nConsolidated Interest Expense is annualized for test periods ending 9/30/24 through 6/30/25, with 9/30/24 deemed at $24.737M.\n\nDebt definitions:\n- Funded debt includes the $201.9M 4.00% 2028 convertible notes at full principal amount; ASC 470-20 effects are disregarded. These notes are unsecured, so they count only in the total net leverage test.\n- Netted cash must be unrestricted and, after 120 days, held in control accounts (with a $30M exception for cash at Lender institutions), and is capped at 50% of Adjusted Cash EBITDA.\n\nGovernance and structure:\n- Financial covenants can be amended by Required Lenders (>50%).\n- There is no equity cure.\n- The agreement has no unrestricted subsidiary concept: all subsidiaries are restricted.\n- Investments by Credit Parties in non-guarantor subsidiaries are capped at $10M, plus a general investment basket of the greater of $25M and 20% of EBITDA.\n- Foreign subsidiaries are excluded from the guarantee and collateral package, with 65% of voting stock of CFCs pledged.\n- Pricing grid runs SOFR + 2.50%-3.00% based on net leverage.","compliance":{"form":"10-Q","filed":"2026-11-05","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373126000170/eght-20260930.htm","sentences":["As of September 30, 2026, the Company was in compliance with all covenants set forth in the 2024 Credit Agreement.","As of September 30, 2026, the Company was in compliance with all covenants set forth in the indenture governing the 2028 Notes."]},"qa":[{"question":"How much additional debt could the borrower take on today, and under which baskets or ratio tests? Name the sections.","answer":"**Short answer:** the documents don't support a single dollar figure. Capacity depends on current Adjusted Cash EBITDA, existing basket usage and current leverage, none of which are given. The First Amendment changed the RP/junior-debt baskets and the leverage covenant but did not amend Section 9.2.\n\n**Section 9.2 debt baskets**\n- **9.2(o), general:** not to exceed, at the time of any incurrence thereof, the greater of (i) $50,000,000 and (ii) 40% of Adjusted Cash EBITDA [1].\n- **9.2(e), capex/capital leases:** the greater of (i) $16,000,000 and (ii) 10% of Adjusted Cash EBITDA [2].\n- **9.2(f), letters of credit/guarantees:** $15,000,000 [3].\n- **9.2(h), cash management/cards:** $15,000,000 at any time [4].\n- **9.2(j), subordinated debt:** no cap, but it requires a customary subordination agreement reasonably satisfactory to the Administrative Agent [5].\n- **9.2(p), unsecured convertible notes:** a ratio test. Pro forma, the Consolidated Total Net Leverage Ratio would not exceed 3.50 to 1.00 [6], with no default and maturity at least 91 days after the term loan maturity.\n\n**Liens (Section 9.3)**\n- Secured debt is limited. The general lien basket is $10,000,000 [7], and it must be junior on Collateral.\n- 9.2(e) debt may be secured under 9.3(i).\n\n**Overriding caps (Section 9.16, as amended)**\n- Total net leverage must not exceed 4.50 to 1.00 [8].\n- Secured leverage must not exceed 2.50 to 1.00 [9].\n- Interest coverage must be at least 3.00 to 1.00 [10].\n- Covenants are given independent effect [11] under Section 12.19, so basket room is usable only to the extent these ratios hold pro forma.\n\n**Consequence of exceeding the baskets**\nProceeds of debt not permitted under 9.2 trigger a one hundred percent (100%) [12] mandatory prepayment under Section 4.4(b)(i).","citations":[{"n":1,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"The Borrower shall not, and shall not permit any Subsidiary to, incur, create, assume or suffer to exist any Indebtedness, except: (a) the Secured Obligations arising under the Loan Documents or any guaranty of or suretyship arrangement for the Secured Obligations arising under the Loan Documents;\n76 188841529_7 (b) Indebtedness in respect of (i) the 2028 Convertible Senior Notes (and any Permitted Refinancing thereof) and (ii) Hedge Agreements to the extent permitted under Section 9.14; (c) (i) Indebtedness existing on the Closing Date and set forth in Schedule 9.2 and any Permitted Refinancing thereof and (ii) prior to the funding of the Delayed Draw Term Loan, Indebtedness outstanding under the Existing Credit Agreement; (d) to the extent constituting Indebtedness: (i) accounts payable and accrued expenses, liabilities or other obligations to pay the deferred purchase price of Property or services, from time to time incurred in the ordinary course of business, (ii) obligations to make purchase price adjustments, earn-out obligations and indemnities or obligations under deferred compensation or similar arrangements, in each case in connection with the Transactions, any Permitted Acquisition or other Investment or any sale, transfer or other disposition permitted hereunder (other than earn-outs and similar obligations), and (iii) deferred compensation to current or former directors, officers, employees, members of management, managers, members, partners, independent contractors and consultants of the Borrower or any of its Subsidiaries in the ordinary course of business; (e) Indebtedness of any Credit Party or any Subsidiary of a Credit Party incurred to finance the acquisition, construction or improvement of any fixed or capital assets (whether or not constituting purchase money Indebtedness), including Capital Lease Obligations and any Indebtedness assumed in connection with the acquisition of any such assets or secured by a Lien on any such assets prior to the acquisition thereof, in an aggregate principal amount at any time outstanding not to exceed, at the time of any incurrence thereof, the greater of (i) $16,000,000 and (ii) 10% of Adjusted Cash EBITDA as of the most recently ended Reference Period for which financial statements have been delivered under this Agreement, and Permitted Refinancings thereof; (f) Indebtedness incurred by any Credit Party or any Subsidiary of a Credit Party in respect of cash secured or unsecured letters of credit, bank guarantees, bankers\u2019 acceptances or similar instruments issued or created, or related to obligations or liabilities incurred, in the ordinary course of business, including in respect of workers compensation claims, health, disability or other employee benefits or property, casualty or liability insurance or self-insurance or other reimbursement-type obligations regarding workers compensation claims in an aggregate principal amount not to exceed $15,000,000 at any one time outstanding; (g) intercompany Indebtedness between the Borrower and any Subsidiary or between any Subsidiary and any other Subsidiary to the extent permitted by Section 9.5(a); provided that any such Indebtedness owed by either the Borrower or a Guarantor shall be subordinated to the prior payment in full in cash of the Secured Obligations on customary terms reasonably satisfactory to the Administrative Agent; (h) (i) Indebtedness in connection with (A) credit cards (including, without limitation, \u201ccommercial credit cards\u201d and purchasing cards), (B) stored value cards, (C) merchant processing services, (D) treasury management services (including, without limitation, controlled disbursement, automated clearinghouse transactions, return items, any direct debit scheme or arrangement, overdrafts, cash pooling services, and interstate depository network services), and (E) foreign exchange and currency management services incurred in the ordinary course of business, (ii) other Indebtedness incurred in the ordinary course of business in respect of netting services, overdraft protections and similar arrangements and Indebtedness incurred in the ordinary course of business arising from the honoring of a bank or other financial institution of a check, draft or similar instrument drawn against insufficient funds; and (iii) endorsements of negotiable instruments for collection in the ordinary course of business; provided that, such Indebtedness under this clause (h) shall be in an aggregate amount not to exceed $15,000,000 at any time;\n77 188841529_7 (i) Indebtedness owing to any insurance company in connection with the financing of any insurance premiums permitted by such insurance company in the ordinary course of business; (j) Subordinated Indebtedness of the Borrower subject to a customary subordination agreement reasonably satisfactory to the Administrative Agent; (k) to the extent constituting Indebtedness, obligations arising under indemnity agreements to title insurers to cause such title insurers to issue to the Administrative Agent title insurance policies; (l) Indebtedness (including deposits) in respect of performance, bid, customs, government, appeal and surety bonds, performance and completion guarantees and similar obligations or obligations in respect of letters of credit, bank guarantees or similar instruments related thereto, in each case provided in the ordinary course of business; (m) Guarantees by the Borrower or any of its Subsidiaries in respect of Indebtedness of the Borrower or any of its Subsidiaries otherwise permitted under this Section 9.2; provided that if such Indebtedness is subordinated to the Secured Obligations, any such guaranty shall be subordinated to the same extent; (n) any Guarantee by a Credit Party of Indebtedness of a Subsidiary that is not a Credit Party shall be permitted under Section 9.5; (o) other Indebtedness incurred by the Credit Parties in an aggregate amount at any time outstanding not to exceed, at the time of any incurrence thereof, the greater of (i) $50,000,000 and (ii) 40% of Adjusted Cash EBITDA as of the most recently ended Reference Period for which financial statements have been delivered under this Agreement; and (p) any unsecured Permitted Convertible Indebtedness, any guarantee by any Credit Party thereof, and any Permitted Refinancing in respect thereof; provided, that in the case of each incurrence of such Permitted Convertible Indebtedness: (i) no Default or Event of Default shall have occurred and be continuing or would be caused by the incurrence of such Indebtedness; (ii) after giving effect to the issuance of such Indebtedness and the use of proceeds thereof on a Pro Forma Basis as of the most recently ended Reference Period, the Consolidated Total Net Leverage Ratio would not exceed 3.50 to 1.00; (iii) such Indebtedness does not mature, or require any principal amortization, mandatory prepayment, put right or sinking fund obligation prior to the date that is 91 days after the then latest scheduled maturity date of the Term Loans; provided that (x) any Indebtedness consisting of a customary bridge facility shall be deemed to satisfy this requirement so long as such Indebtedness automatically converts into long-term debt which satisfies this clause (iii), (y) reasonable and customary prepayment, redemption, repurchase or defeasance obligations in connection with a change of control, asset sale or the exercise of remedies after an event of default shall not disqualify such Indebtedness from satisfying the requirements of this clause (iii) and (z) neither any settlement upon conversion of or exchange for such Permitted Convertible Indebtedness (whether in cash, stock or other property) nor any required redemption or repurchase thereof upon a \u201cfundamental change\u201d (as customarily defined for such Permitted Convertible Indebtedness) shall disqualify such Permitted Convertible Indebtedness from satisfying such requirements\n78 188841529_7 notwithstanding a possible occurrence prior to the then latest scheduled maturity date of the Term Loans; (iv) such Permitted Convertible Indebtedness shall not be guaranteed by or otherwise recourse to any Person other than the Credit Parties; and (v) the covenants and events of default applicable to such Permitted Convertible Indebtedness shall not be more restrictive, taken as a whole, to the Borrower and its Subsidiaries than the covenants and events of default contained in this Agreement (it being understood that customary provisions with respect to a \u201cfundamental change\u201d or any other provision that is customary with respect to convertible notes shall not be considered, for the purposes of this clause (v), to be more restrictive to the Borrower and its Subsidiaries than the covenants and events of default contained in this Agreement). ","found" rrower and its Subsidiaries than the covenants and events of default contained in this Agreement). ","found":true},{"n":6,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"The Borrower shall not, and shall not permit any Subsidiary to, incur, create, assume or suffer to exist any Indebtedness, except: (a) the Secured Obligations arising under the Loan Documents or any guaranty of or suretyship arrangement for the Secured Obligations arising under the Loan Documents;\n76 188841529_7 (b) Indebtedness in respect of (i) the 2028 Convertible Senior Notes (and any Permitted Refinancing thereof) and (ii) Hedge Agreements to the extent permitted under Section 9.14; (c) (i) Indebtedness existing on the Closing Date and set forth in Schedule 9.2 and any Permitted Refinancing thereof and (ii) prior to the funding of the Delayed Draw Term Loan, Indebtedness outstanding under the Existing Credit Agreement; (d) to the extent constituting Indebtedness: (i) accounts payable and accrued expenses, liabilities or other obligations to pay the deferred purchase price of Property or services, from time to time incurred in the ordinary course of business, (ii) obligations to make purchase price adjustments, earn-out obligations and indemnities or obligations under deferred compensation or similar arrangements, in each case in connection with the Transactions, any Permitted Acquisition or other Investment or any sale, transfer or other disposition permitted hereunder (other than earn-outs and similar obligations), and (iii) deferred compensation to current or former directors, officers, employees, members of management, managers, members, partners, independent contractors and consultants of the Borrower or any of its Subsidiaries in the ordinary course of business; (e) Indebtedness of any Credit Party or any Subsidiary of a Credit Party incurred to finance the acquisition, construction or ame extent; (n) any Guarantee by a Credit Party of Indebtedness of a Subsidiary that is not a Credit Party shall be permitted under Section 9.5; (o) other Indebtedness incurred by the Credit Parties in an aggregate amount at any time outstanding not to exceed, at the time of any incurrence thereof, the greater of (i) $50,000,000 and (ii) 40% of Adjusted Cash EBITDA as of the most recently ended Reference Period for which financial statements have been delivered under this Agreement; and (p) any unsecured Permitted Convertible Indebtedness, any guarantee by any Credit Party thereof, and any Permitted Refinancing in respect thereof; provided, that in the case of each incurrence of such Permitted Convertible Indebtedness: (i) no Default or Event of Default shall have occurred and be continuing or would be caused by the incurrence of such Indebtedness; (ii) after giving effect to the issuance of such Indebtedness and the use of proceeds thereof on a Pro Forma Basis as of the most recently ended Reference Period, the Consolidated Total Net Leverage Ratio would not exceed 3.50 to 1.00; (iii) such Indebtedness does not mature, or require any principal amortization, mandatory prepayment, put right or sinking fund obligation prior to the date that is 91 days after the then latest scheduled maturity date of the Term Loans; provided that (x) any Indebtedness consisting of a customary bridge facility shall be deemed to satisfy this requirement so long as such Indebtedness automatically converts into long-term debt which satisfies this clause (iii), (y) reasonable and customary prepayment, redemption, repurchase or defeasance obligations in connection with a change of control, asset sale or the exercise of remedies after an event of default shall not disqualify such Indebtedness from satisfying the requirements of this clause (iii) and (z) neither any settlement upon conversion of or exchange for such Permitted Convertible Indebtedness (whether in cash, stock or other property) nor any required redemption or repurchase thereof upon a \u201cfundamental change\u201d (as customarily defined for such Permitted Convertible Indebtedness) shall disqualify such Permitted Convertible Indebtedness from satisfying such requirements\n78 188841529_7 notwithstanding a possible occurrence prior to the then latest scheduled maturity date of the Term Loans; (iv) such Permitted Convertible Indebtedness shall not be guaranteed by or otherwise recourse to any Person other than the Credit Parties; and (v) the covenants and events of default applicable to such Permitted Convertible Indebtedness shall not be more restrictive, taken as a whole, to the Borrower and its Subsidiaries than the covenants and events of default contained in this Agreement (it being understood that customary provisions with respect to a \u201cfundamental change\u201d or any other provision that is customary with respect to convertible notes shall not be considered, for the purposes of this clause (v), to be more restrictive to the Borrower and its Subsidiaries than the covenants and events of default contained in this Agreement). ","found":true},{"n":7,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"The Borrower shall not, and shall not permit any Subsidiary to, create, incur, permit or grant a security interest or suffer to exist or permit a Lien, claim or other encumbrance or any charges to attach to or affect any of their Properties, except (collectively, \u201cPermitted Liens\u201d): (a) (i) any Lien existing on the Property of a Credit Party or a Subsidiary of a Credit Party on the Closing Date and set forth in Schedule 9.3 securing Indebtedness and/or other obligations outstanding on such date and permitted by Section 9.2, including replacement Liens on the Property currently subject to such Liens securing Indebtedness and/or other obligations permitted by Section 9.2 and (ii) prior to the funding of the Delayed Draw Term Loan, Liens existing on the Property of a Credit Party or a Subsidiary thereof securing obligations outstanding under the Existing Credit Agreement; (b) any Lien created under any Loan Document; (c) Liens for Taxes, fees, assessments or other charges (i) which are not past due or remain payable without penalty, (ii) the non-payment of which is permitted by Section 7.11 or (iii) are being contested in good faith by appropriate proceedings and for which adequate reserves have been made in accordance with GAAP (to the extent so required); (d) statutory Liens of landlords, carriers, warehousemen, mechanics, repairmen, landlords, materialmen or other similar Liens incurred in the ordinary course of business for sums which are not delinquent for more than ninety (90) days or remain payable without penalty or that are being contested in good faith by appropriate proceedings being diligently conducted and for which the Borrower maintains adequate reserves in accordance with GAAP (to the extent so required); (e) Liens arising from judgments, decrees or attachments in circumstances which do not constitute an Event of Default; (f) to the extent made in the ordinary course of business, deposits under worker\u2019s compensation, unemployment insurance, social security and other similar laws, or to secure the performance of bids, tenders or contracts (other than for the repayment of borrowed money) or to secure indemnity, performance or other similar bonds for the performance of bids, tenders or contracts (other than for the repayment of borrowed money) or to secure statutory obligations (other than Liens arising under ERISA or the Code or environmental Liens) or surety or appeal bonds, or to secure indemnity, performance or other similar bonds;\n79 188841529_7 (g) banker\u2019s Liens, rights of setoff and similar Liens arising by operation of law on deposits made in the ordinary course of business, provided such Liens do not arise in respect of borrowed money; (h) (i) licenses and sublicenses of, or any other grant of right to use or otherwise exploit, Intellectual Property or any other intangible assets granted by the Borrower or any of its Subsidiaries in the ordinary course of business and (ii) licenses under or other grants of rights in Intellectual Property granted by the Borrower or any of its Subsidiaries in connection with participation in the \u201cLicense on Transfer Network\u201d administered by LOT Network Inc. or its successor or another entity appointed thereby; (i) Liens arising in connection with Indebtedness described in Section 9.2(e); provided that (i) any such Lien attaches to such Property concurrently with the acquisition thereof, (ii) such Lien attaches solely to the Property so acquired in such transaction and the proceeds thereof (other than improvements, accessions or proceeds in respect thereof and assets fixed or appurtenant thereto), and (iii) the principal amount of the Indebtedness secured thereby does not exceed 100% of the cost of such Property plus fees, costs, expenses and other liabilities incurred in connection with the acquisition of such Property; (j) Liens in favor of customs and revenue authorities arising as a matter of law to secure payments of custom duties in connection with the importation of goods; (k) Liens on insurance proceeds securing the payment of financed insurance premiums; (l) with respect to leased real estate, Liens to which the fee or other superior interest in such real property is subject; (m) Liens arising from the filing of precautionary uniform commercial code financing statements with respect to any lease not prohibited by this Agreement; (n) licenses and sublicenses granted by a Credit Party or any Subsidiary of a Credit Party and leases and subleases (by a Credit Party or any Subsidiary of a Credit Party as lessor or sublessor), in each case in the ordinary course of business not interfering in any material respect with the business of the Credit Parties or any of their Subsidiaries; (o) Liens in favor of collecting banks arising by operation of law under Section 4-210 of the UCC or, with respect to collecting banks located in the State of New York, under Section 4- 208 of the UCC; (p) easements, covenants, conditions, rights-of-way and other restrictions, exceptions, defects, other irregularities in title or other matters of record, and other similar encumbrances which, either individually or in the aggregate, do not in any case interfere in any material respect with the ordinary conduct of the businesses of the Credit Parties and their Subsidiaries, taken as a whole; (q) zoning, building codes and other land use laws regulating the use or occupancy of real estate or the activities conducted thereon which are imposed by any Governmental Authority having jurisdiction over such real estate; (r) Liens attaching solely to cash earnest money deposits in connection with Investments permitted under Section 9.5; (s) Liens on Property, and only such Property, which is the subject of an unconsummated asset purchase agreement in connection with an Asset Disposition permitted hereunder, which Liens secure the obligation of a Credit Party or any Subsidiary of a Credit Party under such agreement;\n80 188841529_7 (t) Liens consisting of prepayments and security deposits in connection with leases, subleases, licenses, sublicenses, use and occupancy agreements, utility services and similar transactions entered into by the applicable Credit Party or Subsidiary of a Credit Party in the ordinary course of business and not required as a result of any breach of any agreement or default in payment of any obligation; (u) Liens on cash collateral securing letters of credit permitted pursuant to Section 9.2(l); (v) with respect to any Property subject to a Mortgage, (1) any exceptions listed on the applicable title policy that are accepted by the Administrative Agent and (2) matters that are disclosed by the ALTA survey (or survey equivalent) and accepted by the Administrative Agent; and (w) other Liens not to exceed $10,000,000 in the aggregate at any one time outstanding; provided that, to the extent any such Liens encumber the Collateral or are incurred by Credit Party such Liens must be junior to the Liens securing the Secured Obligations. ","found":true},{"n":8,"document":"First Amendment to Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373125000070/a101_firstamendmenttoter.htm","text":"As of the last day of any fiscal quarter (commencing with the fiscal quarter ending September 30, 2024), the Borrower shall not permit the Consolidated Total Net Leverage Ratio to be greater than 4.50 to 1.00.\u201d ","found":true},{"n":9,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"As of the last day of any fiscal quarter (commencing with the fiscal quarter ending September 30, 2024), the Borrower shall not permit the Consolidated Secured Leverage Ratio to be greater than 2.50 to 1.00. ","found":true},{"n":10,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"As of the last day of any fiscal quarter (commencing with the fiscal quarter ending September 30, 2024), the Borrower shall not permit the Consolidated Interest Coverage Ratio to be less than 3.00 to 1.00. ","found":true},{"n":11,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"The Borrower expressly acknowledges and agrees that each covenant contained in Articles VIII or IX hereof shall be given independent effect. ","found":true},{"n":12,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"The Borrower shall make mandatory principal prepayments of the outstanding Term Loans in the manner set forth in clause (iv) below in an amount equal to one hundred percent (100%) of the aggregate Net Cash Proceeds from any Debt Issuance not otherwise permitted pursuant to Section 9.2. ","found":true}]},{"question":"If the borrower missed its financial covenant next quarter, what happens? Is there an equity cure or a grace period, and what can the lenders do?","answer":"**Short answer: a financial covenant miss is an immediate Event of Default. There is no grace period and no equity cure.**\n\n**Current covenants (Section 9.16, as amended)**\n- Total net leverage: the Borrower shall not permit the Consolidated Total Net Leverage Ratio to be greater than 4.50 to 1.00 [1]. The First Amendment replaced the earlier step-downs with this flat level.\n- Secured leverage: maximum 2.50 to 1.00 [2].\n- Interest coverage: minimum 3.00 to 1.00 [3].\n\n**No grace period**\nSection 10.1(c)(i) makes it an Event of Default if Borrower or any other Credit Party fails or neglects to perform, keep or observe any term, provision, condition or covenant contained in Section 8.2(a), 8.3(a), 8.15, 8.16 or Article IX [4]. The 10-business-day and 30-day cure periods in 10.1(c)(ii)\u2013(iii) do not cover Article IX. The only relief is that a late Compliance Certificate gets 10 business days, but the breach itself does not.\n\n**No equity cure**\nNeither document contains an equity cure right.\n\n**Lender remedies**\n- **Acceleration (Section 10.2):** with the consent of the Required Lenders, the Administrative Agent may, or upon the request of the Required Lenders, the Administrative Agent shall [5] declare the principal of and interest on the Term Loans at the time outstanding... to be forthwith due and payable [6]. The agent can also enforce against the collateral.\n- **Setoff:** lenders may set off deposits after obtaining the prior written consent of the Administrative Agent [7].\n- **Inspections:** the one-per-year limit on inspections falls away, and inspections occur at the expense of the Borrower at any time [8].\n- **Default interest:** the 2% default rate is not triggered by a covenant breach alone. It applies to payment defaults and bankruptcy.\n\n**Practical path**\nThe borrower must give notice within five business days (Section 8.2(a)). A waiver or covenant reset needs only Required Lenders (more than 50%). only the consent of the Required Lenders shall be necessary to amend any financial covenant hereunder [9].\n\nWhether the breach also triggers default under the 2028 convertible notes depends on the indenture, which isn't provided.","citations":[{"n":1,"document":"First Amendment to Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373125000070/a101_firstamendmenttoter.htm","text":"As of the last day of any fiscal quarter (commencing with the fiscal quarter ending September 30, 2024), the Borrower shall not permit the Consolidated Total Net Leverage Ratio to be greater than 4.50 to 1.00.\u201d ","found":true},{"n":2,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"As of the last day of any fiscal quarter (commencing with the fiscal quarter ending September 30, 2024), the Borrower shall not permit the Consolidated Secured Leverage Ratio to be greater than 2.50 to 1.00. ","found":true},{"n":3,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"As of the last day of any fiscal quarter (commencing with the fiscal quarter ending September 30, 2024), the Borrower shall not permit the Consolidated Interest Coverage Ratio to be less than 3.00 to 1.00. ","found":true},{"n":4,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"One or more of the following events shall constitute an \u201cEvent of Default\u201d: (a) any Credit Party fails (i) to pay when and as required to be paid herein, any amount of principal of any Term Loan, including after maturity of the Term Loans, or (ii) to pay within three (3) Business Days after the same shall become due and payable, interest on any Term Loan, any fee or any other amount payable hereunder or pursuant to any other Loan Document; or (b) any representation, warranty, or certification by or on behalf of any Credit Party or any of its Subsidiaries made or deemed made herein, in any other Loan Document, or which is contained in any certificate, document or financial or other statement by any such Person, or their respective Responsible Officers, furnished at any time under this Agreement, or in or under any other Loan Document, shall prove to have been incorrect in any material respect when made or deemed made (or in any respect if such representation, warranty, financial statement, statement, report or certificate is qualified as to materiality or Material Adverse Effect); (c) (i) if Borrower or any other Credit Party fails or neglects to perform, keep or observe any term, provision, condition or covenant contained in Section 8.2(a), 8.3(a), 8.15, 8.16 or Article IX of this Agreement which is required to be performed, kept or observed by the Borrower or such Credit Party, (ii) if Borrower or any other Credit Party fails or neglects to perform, keep or observe any term, provision, condition, covenant or agreement contained in Section 8.1(a), 8.1(b) or 8.1(c), and such default under this\n89 188841529_7 clause (ii) continues for a period of ten (10) Business Days, or (iii) if the Borrower or any Credit Party fails or neglects to perform, keep or observe any other term, provision, condition or covenant in this Agreement or in any other Loan Document which is required to be performed, kept or observed by the Borrower or such Credit Party and such default shall continue unremedied for a period of thirty (30) days after the earlier to occur of (A) the date upon which a Responsible Officer of any Credit Party becomes aware of such default and (B) the date upon which written notice thereof is given to the Borrower by the Administrative Agent; (d) any Credit Party or any Subsidiary of any Credit Party (i) fails to make any payment in respect of any Material Indebtedness (other than the Secured Obligations or any intercompany Indebtedness) when due (whether by scheduled maturity, required prepayment, acceleration, demand, or otherwise) and such failure continues after the applicable grace or notice period, if any, specified in the document relating thereto on the date of such failure; or (ii) fails to perform or observe any other condition or covenant, or any other breach shall occur, under any agreement or instrument relating to any such Material Indebtedness (other than (x) any event that permits holders of any Permitted Convertible Indebtedness to convert or exchange such Indebtedness or (y) the conversion or exchange of any Permitted Convertible Indebtedness, in either case, into common stock of the Borrower (or other securities or property following a merger event, reclassification or other change of the common stock of the Borrower), cash or a combination thereof) if the effect of such failure or breach is to cause, or to permit the holder or holders of such Material Indebtedness or beneficiary or beneficiaries of such Material Indebtedness (or a trustee or agent on behalf of such holder or holders or beneficiary or beneficiaries) to cause such Material Indebtedness to be declared to be due and payable, redeemed, or repurchased, in each case prior to its stated maturity (without regard to any subordination terms with respect thereto); provided that (x) this clause (d) shall not apply to secured Indebtedness permitted hereunder that becomes due solely as a result of (A) an Insurance and Condemnation Event or (B) the applicable Credit Party\u2019s voluntary sale or transfer of only the property securing such Indebtedness, if such sale or transfer is expressly permitted hereunder and under the documents providing for such Indebtedness to the extent that such Credit Party\u2019s obligations with respect to such Indebtedness are extinguished in full upon such sale or transfer and (y) clause (d)(ii) shall not apply to the occurrence of any early termination or cancellation and payment (each howsoever defined) under any Permitted Bond Hedge Transaction or any Permitted Warrant Transaction. ","found":true},{"n":5,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"Upon the occurrence and during the continuance of an Event of Default, with the consent of the Required Lenders, the Administrative Agent may, or upon the request of the Required Lenders, the Administrative Agent shall, by notice to the Borrower: (a) Acceleration; Termination of Term Loan Facility. ","found":true},{"n":6,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"Terminate the Delayed Draw Term Loan Commitments and declare the principal of and interest on the Term Loans at the time outstanding, and all other amounts owed to the Lenders and to the Administrative Agent under this Agreement or any of the other Loan Documents and all other Obligations, to be forthwith due and payable, whereupon the same shall immediately become due and payable without presentment, demand, protest or other notice of any kind, all of which are expressly waived by each Credit Party, anything in this Agreement or the other Loan Documents to the contrary notwithstanding, and terminate the Term Loan Facility and any right of the Borrower to request borrowings thereunder; provided, that upon the occurrence of an Event of Default specified in Section 10.1(e), the Term Loan Facility shall be automatically terminated and all Obligations shall automatically become due and payable without presentment, demand, protest or other notice of any kind, all of which are expressly waived by each Credit Party, anything in this Agreement or in any other Loan Document to the contrary notwithstanding. ","found":true},{"n":7,"document":"Term Loan Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/1023731/000102373124000062/a8x8_ex101xcreditagreeme.htm","text":"If an Event of Default shall have occurred and be continuing, each Lender and each of their respective Affiliates is hereby authorized at any time and from time to time, after obtaining the prior written consent of the Administrative Agent, to the fullest extent permitted by Applicable Law, to setoff and apply any and all deposits (general or special, time or demand, provisional or final, in whatever currency) at any time held and other obligations (in whatever currency) at any time owing by such Lender or any such Affiliate to or for the credit or the account of the Borrower or any other Credit Party against any and all of the obligations of the Borrower or such Credit Party now or hereafter existing under this Agreement or any other Loan Document to such Lender or any of its respective Affiliates, irrespective of whether or not such Lender or any such Affiliate shall have made any demand under this Agreement or any other Loan Document and although such obligations of the Borrower or such Credit Party may be contingent or unmatured or are owed to a branch or office of such Lender or such Affiliate different from the branch, office or Affiliate holding such deposit or obligated on such indebtedness; provided that in the event that any Defaulting Lender or any Affiliate thereof shall exercise any such right of setoff, (x) all amounts so setoff shall be paid over immediately to the Administrative Agent for further application in accorda
