ied":null},{"kind":"serta_protection","present":"no","section":"Section 8.3","quote":null,"summary":"Required Lenders can amend the agreement. Affected-lender consent is limited to economic terms (maturity, principal, rate, fees, commitment increases). All-lender consent covers Required Lender percentage changes, amendments to 8.3, and guarantor releases. There is no lender-consent requirement for subordinating the loans or liens.","quote_verified":null},{"kind":"chewy_protection","present":"partial","section":"Section 6.20(b)","quote":"(ii) the Guarantor being released has a Net Worth of less than $3,000,000, or is being sold or otherwise disposed of in a transaction permitted by this Agreement to a Person other than Borrower or one of the other Loan Parties;","summary":"There is no automatic release when a guarantor ceases to be wholly owned. Release requires one of the following: net worth under $3M, or a permitted sale/disposition of the guarantor. It also requires release from all other pari passu guarantees, no default, and pro forma compliance; otherwise all-lender consent is needed. There is no express Chewy-style language.","quote_verified":true},{"kind":"unrestricted_sub_cap","present":"no","section":"Section 6.14","quote":null,"summary":"There are no unrestricted subsidiaries. Investments in non-guarantor subsidiaries and other persons are permitted subject only to no Event of Default and pro forma financial covenant compliance, with no hard dollar cap (aside from a separate $20M general basket).","quote_verified":null},{"kind":"addback_cap","present":"partial","section":"Definition of Consolidated EBITDA (Section 1.1)","quote":"(i) non-recurring expenses and charges, provided that the amount of such expenses and charges shall not exceed 7.5% of Consolidated EBITDA (without giving effect to this clause (i)) in the aggregate for any four consecutive fiscal quarters","summary":"There is no add-back for projected cost savings or synergies. Non-recurring expenses are capped at 7.5% of EBITDA and transaction expenses at $10M per transaction / $20M per year. ASC 805 transaction and restructuring charges are added back without a cap.","quote_verified":true},{"kind":"equity_cure","present":"no","section":"Section 6.19(c)","quote":null,"summary":"There is no equity cure right. The only cure-like mechanic is a liquidity cure for the Interest Coverage Test: holding Unrestricted Cash at or above the Liquidity Cure Amount avoids default, with no limit on how often it can be used.","quote_verified":null}],"accuracy":[{"metric":"total_leverage","period_end":"2026-03-31","reported":9.2,"reported_limit":60.0,"our_limit":0.6,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1561680/000156168026000026/tph-20260331.htm"},{"metric":"interest_coverage","period_end":"2026-03-31","reported":5.6,"reported_limit":1.5,"our_limit":1.5,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1561680/000156168026000026/tph-20260331.htm"},{"metric":"other","period_end":"2026-03-31","reported":3158820.0,"reported_limit":2346759.0,"our_limit":0.95,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1561680/000156168026000026/tph-20260331.htm"},{"metric":"total_leverage","period_end":"2026-06-30","reported":19.0,"reported_limit":60.0,"our_limit":0.6,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1561680/000156168026000040/tph-20260630.htm"},{"metric":"interest_coverage","period_end":"2026-06-30","reported":5.1,"reported_limit":1.5,"our_limit":1.5,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1561680/000156168026000040/tph-20260630.htm"},{"metric":"total_leverage","period_end":"2026-09-30","reported":21.9,"reported_limit":60.0,"our_limit":0.6,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1561680/000156168026000047/tph-20260930.htm"},{"metric":"interest_coverage","period_end":"2026-09-30","reported":4.6,"reported_limit":1.5,"our_limit":1.5,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1561680/000156168026000047/tph-20260930.htm"}],"notes":"Covenants are as restated in the conformed Second A&R Credit Agreement attached to the Sixth Modification (Sept 18, 2025). The Seventh Modification (Apr 16, 2026) does not change the financial covenants. It consents to the Sumitomo Forestry merger, waives the change-of-control default arising from it, and redefines Change in Control so that Sumitomo must keep >50% ownership and control. Leverage Test details: the Leverage Ratio is a net debt-to-capitalization ratio expressed as a percentage, with the limit of 60% recorded as 0.60. The numerator is Consolidated Indebtedness less Unrestricted Cash above $50M; the denominator is Consolidated Indebtedness plus Consolidated Tangible Net Worth less Unrestricted Cash above $50M. Cash is only netted above a $50M floor, and there is no cap on the amount netted. Interest Coverage Test details: this is the only covenant that uses EBITDA, measured as EBITDA to Consolidated Interest Incurred (including capitalized interest). A shortfall is not a default if Unrestricted Cash is kept at or above the Liquidity Cure Amount, defined as the greater of $50M and trailing-twelve-month interest incurred. Consolidated Tangible Net Worth floor: the $2.22B base rises by 50% of positive quarterly net income and 50% of equity offering proceeds after 12/31/2024. EBITDA add-backs include: other non-cash charges; non-ordinary-course losses; ASC 805 transaction and restructuring charges (uncapped); non-recurring expenses (capped at 7.5% of EBITDA); and transaction expenses ($10M per transaction / $20M per rolling four quarters). Other features: - A breach of 6.19 is an immediate Event of Default with no grace period (7.3). - Borrowing Base Debt may not exceed the Borrowing Base, with a mandatory paydown within 3 business days (2.1, 2.2). - Secured real-estate debt is capped at 20% of Consolidated Tangible Net Worth (6.11, incurrence-style). - Restricted payments are blocked on an actual or pro forma covenant violation. - Pricing is grid-based on the Leverage Ratio. - The facility is unsecured and guaranteed by Significant Homebuilding Subsidiaries. - Required Lenders is >66 2/3%. - There is no unrestricted subsidiary concept.","compliance":{"form":"10-Q","filed":"2026-11-05","url":"https://www.sec.gov/Archives/edgar/data/1561680/000156168026000047/tph-20260930.htm","sentences":["Tri Pointe Connect was in compliance with all covenants and requirements as of September 30, 2026.","The Company was in compliance with all applicable financial covenants as of September 30, 2026 and December 31, 2025.","As of September 30, 2026, we were in compliance with the covenants required by our Senior Notes.","As of September 30, 2026, we were in compliance with all of these financial covenants."]},"qa":[]},{"cik":"1013880","name":"TTEC Holdings Inc.","borrower":"TTEC Holdings, Inc. (formerly TeleTech Holdings, Inc.)","gold":false,"facility":"Senior secured revolving credit facility (with LC sublimit of $50M and swing line of $15M) of $945M as of Nov 9, 2026, reducing by $10M on each of Apr 1, Jul 1 and Oct 1, 2027 (plus possible Digital Sale reductions); no term loans and no further incremental capacity; matures Nov 23, 2028.","stale":true,"agreement_date":"2013-06-03","cov_lite":false,"tightest":null,"chain":{"source":"automatic","notes":["Thirteenth Amendment to Amended and Restated Credit Agreement restates the full agreement; used as the base"],"use st recently completed fiscal quarter to be less than the Expected Earn-Out Amount as of the last day of the most recently completed fiscal quarter.","quote_verified":true,"thresholds":[],"test_frequency":"quarterly","springing_condition":null,"cash_netting_cap":null,"cash_netting_cap_pct_ebitda":null,"latest":null,"steps":[],"rows":[]}],"terms":[{"kind":"j_crew_blocker","present":"partial","section":"Section 5.29","quote":"US Borrower shall not, and US Borrower shall not permit any of its Subsidiaries to, enter into any Liability Management Transaction (as defined below).","summary":"The agreement has no unrestricted subsidiary concept and no IP-specific transfer ban. Instead, a general Liability Management Transaction covenant prohibits transfers of Collateral (which would include IP) to non-Credit Party affiliates to raise new financing or preserve value for affiliates, subject to exceptions for permitted-basket transactions and transactions under $5M.","quote_verified":true},{"kind":"serta_protection","present":"yes","section":"Section 11.3(b)(i)(G)","quote":"(2) subordinate, or have the effect of subordinating, the Obligations in right of payment or otherwise adversely affect the priority of payment of any of such Obligations or (3) subordinate the Liens securing any Obligations in a disproportionate and adverse manner relative to the effect on the Liens of any other holder of the Obligations, in each case of clause (2) and (3) without the written consent of each of the Lenders directly and adversely affected thereby","summary":"Subordinating the loans in right of payment, or subordinating their liens disproportionately, requires the consent of each directly and adversely affected lender. In addition, Section 5.29 bans non-pro-rata uptier exchanges, and amending Section 5.29 needs affected-lender consent unless each such lender is offered a pro rata share of the transaction.","quote_verified":true},{"kind":"chewy_protection","present":"yes","section":"Section 11.3(b)(i)(E)","quote":"release (i) the US Borrower without the written consent of each Lender or (ii) except in connection with an asset sale or disposition transaction otherwise permitted under this Agreement of all of the equity of a Guarantor of Payment to a purchaser that is unaffiliated with the US Borrower, any Guarantor of Payment;","summary":"A guarantor can be released without lender consent only when all of its equity is sold to an unaffiliated purchaser in a permitted transaction, so becoming non-wholly owned does not trigger release. The drafting of the consent requirement in clause (ii) is somewhat garbled. Section 5.29(iii) also bars guarantor releases made to support new financing.","quote_verified":true},{"kind":"unrestricted_sub_cap","present":"no","section":null,"quote":null,"summary":"The agreement has no unrestricted subsidiary designation mechanism, so it has no cap on unrestricted subsidiaries. Investments in non-guarantor subsidiaries are instead limited by the general investment covenant and the $12.5M post-Tenth Amendment basket cap.","quote_verified":null},{"kind":"addback_cap","present":"yes","section":"Section 1.1 (definition of Consolidated EBITDA, clauses (d) and (f))","quote":"synergies resulting from Acquisitions (to be achieved within eighteen (18) months of the consummation of such Acquisition and are not anticipated to be incurred on an ongoing basis following the consummation thereof), to the extent the synergies included in this clause (f) (1) are certified by a Financial Officer in form and substance reasonably satisfactory to Agent, (2) are reasonably acceptable to Agent and (3) do not exceed ten percent (10%) of Consolidated EBITDA","summary":"Acquisition synergy add-backs are capped at 10% of Consolidated EBITDA and must be realized within 18 months and acceptable to the Agent. Separately, one-time cash charges including severance and restructuring are capped at $20M per fiscal year.","quote_verified":true},{"kind":"equity_cure","present":"no","section":null,"quote":null,"summary":"The agreement has no equity cure right for the financial covenants. Equity issuance proceeds must instead be applied 100% to prepay the revolver during the Covenant Adjustment Period.","quote_verified":null}],"accuracy":[{"metric":"net_leverage","period_end":"2025-12-31","reported":3.58,"reported_limit":4.0,"our_limit":4.0,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1013880/000110465926020532/ttec-20251231x10k.htm"},{"metric":"interest_coverage","period_end":"2025-12-31","reported":null,"reported_limit":2.5,"our_limit":2.5,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1013880/000110465926020532/ttec-20251231x10k.htm"},{"metric":"net_leverage","period_end":"2026-03-31","reported":null,"reported_limit":3.75,"our_limit":4.0,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1013880/000110465926093402/ttec-20260630x10q.htm"},{"metric":"net_leverage","period_end":"2026-06-30","reported":3.85,"reported_limit":3.75,"our_limit":3.75,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1013880/000110465926093402/ttec-20260630x10q.htm"},{"metric":"net_leverage","period_end":"2026-09-30","reported":3.63,"reported_limit":4.25,"our_limit":4.25,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1013880/000110465926124608/ttec-20260930x10q.htm"}],"notes":"Covenants are shown as amended through the Thirteenth Amendment (Nov 9, 2026).\n\nCovenant mechanics:\n- The Covenant Adjustment Period runs from the fiscal quarter ending 9/30/2024 to the maturity date.\n- The Net Leverage covenant applies until a Qualifying Debt Issuance; after that, the Secured Net Leverage covenant applies on the same schedule. Section 5.7(b) refers to an 'Optional Leverage Ratio Increase', but that term is not set out in the text provided.\n- Net leverage nets the lesser of 70% of unrestricted cash and Cash Equivalents and $100M. Secured net leverage nets 70% of unrestricted cash with no dollar cap.\n- The minimum liquidity test has no fixed dollar level. Available Liquidity (unrestricted cash and cash equivalents plus revolver availability, less repatriation costs) must be at least the Expected Earn-Out Amount (estimated earn-outs payable in the next 12 months).\n- Interest Coverage uses cash interest expense and excludes the Exit Fee.\n\nConsolidated EBITDA add-backs:\n- Non-cash charges (excluding receivables impairment).\n- One-time cash charges, including severance and restructuring, capped at $20M per fiscal year.\n- Acquisition synergies, capped at 10% of EBITDA, realized within 18 months and subject to Agent acceptance.\n- Transaction costs.\n- Exit Fee charges.\n- Pro forma adjustments for significant acquisitions and dispositions.\n\nDistressed-credit features:\n- Pricing is a flat SOFR + 4.00% / Base Rate + 3.00%.\n- There is a 3.00% Exit Fee, partly payable Jan 3, 2028, with potential reductions.\n- 100% mandatory prepayment sweeps apply to debt issuances, equity issuances and asset sales during the Covenant Adjustment Period.\n- Acquisitions and most Restricted Payments are prohibited after the Tenth Amendment.\n- Basket debt, investments and asset sales are each capped at $12.5M.\n- Non-domestic cash above $115M is swept monthly.\n- A Digital segment sale process is required, overseen by Supermajority Lenders, with automatic $10M commitment reductions if milestones are missed.\n- Reporting includes a 13-week cash flow forecast, weekly variance reports and monthly lender calls, with FTI as lender financial advisor.\n- Material foreign subsidiaries must become guarantors.\n- A broad Liability Management Transaction prohibition was added in Section 5.29.\n\nIncurrence-only test (not a maintenance covenant): unsecured debt under Section 5.8(o) requires Net Leverage of no more than 4.75x after a Qualifying Debt Issuance.","compliance":{"form":"10-Q","filed":"2026-11-09","url":"https://www.sec.gov/Archives/edgar/data/1013880/000110465926124608/ttec-20260930x10q.htm","sentences":["In the event that the Company does not remain in compliance with such financial covenants, it may be required to negotiate additional amendments to, or waivers of, the terms of the Credit Agreement, refinance its debt, or raise additional capital.","In the event the Company does not remain in compliance with such financial covenants, it may be required to negotiate additional amendments to, or waivers of, the terms of Credit Facility, refinance its debt, or raise additional capital.","00 for the quarter, and we were in compliance with all covenants under the Credit Agreement."]},"qa":[]},{"cik":"832101","name":"IDEX Corp.","borrower":"IDEX Corporation","gold":false,"facility":"$800M multicurrency senior unsecured revolving credit facility (sublimits: $500M alternative currency, $100M letters of credit, $50M swing line) maturing September 3, 2031, with two 1-year extension options and a $400M uncommitted incremental (revolver increases or term loans).","stale":false,"agreement_date":"2026-09-03","cov_lite":false,"tightest":{"name":"Net Leverage Ratio","period_end":"2026-09-30","basis":"reported","value":1.39,"limit":3.5,"headroom":0.602857142857143,"cushion":0.6028571428571429},"chain":{"source":"automatic","notes":[],"used":[{"url":"https://www.sec.gov/Archives/edgar/data/832101/000119312526381880/d421581dex101.htm","title":"Second Amended & Restated Credit Agreement","dated":"2026-09-03"}]},"covenants":[{"name":"Net Leverage Ratio","metric":"net_leverage","direction":"max","section":"Section 7.15","quote":"The Company shall not permit the Net Leverage Ratio as of the end o sted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/319201/000031920126000034/klac-20260930.htm"}],"notes":"Investment-grade style unsecured revolver with ratings-based and sustainability-linked pricing. The only financial maintenance covenant is the Leverage Ratio (Section 6.06), tested at the end of each fiscal quarter on a trailing four-quarter basis. It is a net ratio: Consolidated Total Indebtedness is reduced by the lesser of US-held cash, cash equivalents and marketable securities and $2.5bn. Acquisition Indebtedness for a signed but unconsummated Material Acquisition is disregarded. Acquisition holiday: if an Acquisition (or series within 180 days) involves $1bn or more of incurred or assumed debt and raises pro forma leverage, the Company may elect within 30 days to raise the maximum to 3.75x. The higher level applies for the quarter of closing and the next three quarters, and the Company can end it early by notice. A new election requires at least two consecutive quarters at or below 3.25x after the prior holiday ends. EBITDA add-backs: interest, taxes, D&A, non-cash stock compensation, other non-cash charges (later cash payments are subtracted), debt extinguishment losses, cash restructuring/severance capped at $200m per four quarters, and uncapped extraordinary, unusual or non-recurring cash charges. There is no add-back for projected cost savings or synergies. Pro forma adjustments for Material Acquisitions/Dispositions ($75m+) are made under Regulation S-X Article 11. Guarantees come from Designated Subsidiaries (wholly-owned domestic Material Subsidiaries, excluding FSHCOs and securitization subsidiaries). There is no unrestricted subsidiary concept, no collateral and no equity cure. Negative covenants: subsidiary debt and liens share a basket of 15% of Consolidated Net Tangible Assets, plus a securitization basket of the greater of $600m and 10% of CNTA.","compliance":{"form":"10-Q","filed":"2026-10-29","url":"https://www.sec.gov/Archives/edgar/data/319201/000031920126000034/klac-20260930.htm","sentences":["As of September 30, 2026, we were in compliance with all of our covenants under the Indenture associated with the Senior Notes.","We were in compliance with all covenants under the Credit Agreement as of September 30, 2026.","As of September 30, 2026, we were in compliance with all of our covenants under the relevant indentures associated with the Senior Notes.","We were in compliance with all covenants under the Credit Agreement as of September 30, 2026 (the net leverage ratio was 0."]},"qa":[]},{"cik":"1377630","name":"National CineMedia Inc.","borrower":"NCM Holdings, LLC and National CineMedia, LLC (co-borrowers; Captivate Holdings, LLC and Captivate, LLC joined as Borrowers upon the Debt Assumption)","gold":false,"facility":"$275M Initial Term Loan and $25M Revolving Facility (including a $5M LC sublimit and $3M swingline), both maturing September 18, 2031","stale":false,"agreement_date":"2026-09-18","cov_lite":false,"tightest":null,"chain":{"source":"automatic","notes":[],"used":[{"url":"https://www.sec.gov/Archives/edgar/data/1377630/000119312526396098/ncmi-ex10_1.htm","title":"Credit Agreement","dated":"2026-09-18"}]},"covenants":[{"name":"Net Total Leverage Ratio","metric":"net_leverage","direction":"max","section":"Section 6.11","quote":"Permit the Net Total Leverage Ratio as of the last day of any fiscal quarter (beginning with the end of the first full fiscal quarter ending after the Closing Date), to exceed the level set forth below with respect to the fiscal quarter ending on or about the date set forth opposite such level:","quote_verified":true,"thresholds":[{"value":5.0,"applies_from":"2026-12-31"},{"value":4.75,"applies_from":"2028-06-30"},{"value":4.5,"applies_from":"2029-12-31"}],"test_frequency":"quarterly","springing_condition":null,"cash_netting_cap":15000000.0,"cash_netting_cap_pct_ebitda":null,"latest":null,"steps":[{"from":"2026-12-31","limit":5.0,"headroom_at_today":null},{"from":"2028-06-30","limit":4.75,"headroom_at_today":null},{"from":"2029-12-31","limit":4.5,"headroom_at_today":null}],"rows":[{"period_end":"2023-06-29","before_agreement":true,"limit":null,"xbrl":null,"adjusted":null,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":null,"ltm_ebitda_adjusted":null,"debt":0,"cash":15500000},{"period_end":"2023-12-28","before_agreement":true,"limit":null,"xbrl":null,"adjusted":null,"reported":null,"reported_limit":null,"ltm_ebitda_xbrl":null,"ltm_ebitda_adjusted":null,"debt":10000000,"cash":34600000}]}],"terms":[{"kind":"j_crew_blocker","present":"yes","section":"Section 5.13 (also Section 6.06, final paragraph)","quote":"The Borrowers shall not, and shall ensure that their Restricted Subsidiaries shall not, (i) designate as an Unrestricted Subsidiary any Restricted Subsidiary that owns Material Assets or any Captivate Equipment or permit any Unrestricted Subsidiary to own or exclusively license any Material Assets or any Captivate Equipment at any time or (ii) transfer (in the form of an Investment, contribution, Restricted Payment, Disposition or otherwise) any Material Assets or any Captivate Equipment owned or exclusively licensed by any Loan Party to any Subsidiary that is not a Loan Party;","summary":"Material Assets (including Material Intellectual Property) and Captivate Equipment may not be transferred or exclusively licensed to non-Loan Party subsidiaries, may not be owned by Unrestricted Subsidiaries, and no subsidiary owning them may be designated unrestricted. Ordinary-course non-exclusive licenses are excepted.","quote_verified":true},{"kind":"serta_protection","present":"yes","section":"Section 9.08(b)(vi); see also Section 6.08","quote":"subordinate the Liens with respect to all or substantially all of the value of the Collateral securing the Secured Obligations to any Lien securing Indebtedness solely in the form of third party Indebtedness for borrowed money","summary":"Subordinating the liens on all or substantially all collateral value, or the payment priority of the loans or guarantees, to other third-party borrowed money needs every non-defaulting lender's consent. The exception is where each lender is offered a pro rata chance to participate on the same terms (other than Ancillary Fees); DIP financings and Permitted Modifications are carved out. Section 6.08 separately prohibits Liability Management Exercises.","quote_verified":true},{"kind":"chewy_protection","present":"yes","section":"Section 9.18(b)","quote":"no Subsidiary Loan Party shall be automatically released from its obligations under the Loan Documents solely by reason of such Subsidiary Loan Party becoming an Excluded Subsidiary of the type described in clause (b) of the definition thereof unless no Specified Event of Default is continuing and either (x) it is no longer a direct or indirect Subsidiary of Holdings or (y) such Subsidiary Loan Party ceases to be a Wholly Owned Subsidiary as a result of a sale, issuance or transfer of Equity Interests for fair market value to a third party that is not an Affiliate of the Borrowers or the Ultimate Parent","summary":"A guarantor is not released just because it becomes non-wholly owned. Release requires no Specified Event of Default and either full exit as a subsidiary or a fair-value equity sale to an unaffiliated third party for a bona fide business purpose, not primarily to release the guarantee.","quote_verified":true},{"kind":"unrestricted_sub_cap","present":"yes","section":"Section 5.13; Section 6.04(ee)","quote":"Notwithstanding anything herein to the contrary (but subject to the immediately preceding sentence), transfers (in the form of an Investment, contribution, Restricted Payment, Disposition or otherwise) to Unrestricted Subsidiaries shall only be permitted to be made solely and exclusively (including by virtue of the designation of any Subsidiary as an Unrestricted Subsidiary) in the form of an Investment pursuant to Section 6.04(ee) (and not pursuant to any other clause or exception) and any such Investments shall not be reclassified, divided or re-divided.","summary":"All investments in and designations of Unrestricted Subsidiaries must use Section 6.04(ee), which is capped at the greater of $5M and 7% of EBITDA. That cap is shared with joint venture and similar-business investments under 6.04(cc). Designation also requires no default and pro forma compliance with the financial covenant.","quote_verified":true},{"kind":"addback_cap","present":"yes","section":"Definition of \"EBITDA\" (final paragraph), Section 1.01","quote":"the aggregate amount added to or included in EBITDA pursuant to subclauses (a)(iv), (a)(ix) and (a)(xx) of the definition of EBITDA, shall not, for any Test Period, exceed an amount equal to 20% of EBITDA for such Test Period, calculated after giving effect to any such add-backs or inclusions and all other add-backs and inclusions","summary":"Restructuring and business optimization charges, run-rate cost savings and synergies, and extraordinary or non-recurring charges are together capped at 20% of EBITDA (measured after the add-backs). QofE, Model and Regulation S-X adjustments under clause (a)(xi) fall outside this cap.","quote_verified":true},{"kind":"equity_cure","present":"yes","section":"Section 7.03","quote":"(i) in each four fiscal quarter period there shall be at least two fiscal quarters in which a Cure Right is not exercised, (ii) a Cure Right shall not be exercised more than four times during the term of the Facility","summary":"Holdings may cure a breach of the leverage covenant with cash equity contributed to a Borrower, which is added to EBITDA. Limits: no more than two cures in any four consecutive quarters and four over the life of the facility; the cure is limited to the amount needed; no debt reduction or cash netting in the cure quarter; and proceeds must be applied to prepay term loans.","quote_verified":true}],"accuracy":[{"metric":"fixed_charge_coverage","pe ],"notes":"The only maintenance covenant is the Section 6.11 Net Total Leverage Ratio. It is tested every quarter for all lenders, not only on revolver usage. It steps down from 5.00x (Q4 2026 through Q1 2028) to 4.75x (Q2 2028 through Q3 2029) to 4.50x (Q4 2029 onward).\n\nCash netting: Unrestricted Cash counts only cash of Holdings, the Borrowers and Subsidiary Loan Parties. It is capped at the lesser of $15M and, after the Control Agreement Delivery Date, cash held in accounts under Control Agreements.\n\nEBITDA definition:\n- Includes deemed quarterly EBITDA for the four quarters before closing ($14.3M, $44.9M, $(9.8)M and $7.9M), adjustable for pro forma synergies.\n- Add-backs include run-rate cost savings and synergies (12-month look-forward), QofE, Model and Regulation S-X adjustments under (a)(xi), which are not subject to the 20% cap.\n- Transaction Expenses are added back up to $45M; New Project losses are capped at 5% of EBITDA; litigation settlements and extraordinary or non-recurring charges are also added back.\n\nAmendments: the Required Revolving Facility Lenders alone may amend or waive Section 6.11 and related definitions, or waive a resulting default (Section 9.08(h)).\n\nDrafting inconsistency: Section 1.10 refers to the Net First Lien Leverage Ratio in the context of Section 6.11 compliance.\n\nIncurrence-only tests are excluded from the covenant list:\n- Net First Lien Leverage 3.90x (incremental debt)\n- Net Total Leverage 3.40x (investments), 2.90x (restricted payments) and 2.40x (junior debt payments)\n- Fixed Charge Coverage 2.00x (acquired debt)\n\nOther lender protections:\n- Section 6.08 flatly prohibits Liability Management Exercises, but the definition excludes transactions approved by the Required Lenders and Required Revolving Facility Lenders, bona fide transactions, and pro rata open offers.\n- Section 9.18(h) bars lien or guarantee releases that are part of a refinancing or exchange, or of a financing benefiting lenders or affiliates, unless the loans are paid in full in cash, absent Required Lenders and Required Revolving Facility Lenders consent.\n- Net short lender voting is disenfranchised.\n- Material Assets and Captivate Equipment are protected from sale-leasebacks and certain liens.\n\nPricing and prepayment:\n- Term loan pricing is SOFR + 7.00% with a 1.50% floor.\n- A PIK toggle of up to 2% is available for the first two years at a +0.50% margin.\n- Call protection is 3/2/1.\n- Amortization is 2.5% per year for 3 years, then 5% per year.","compliance":{"form":"10-Q","filed":"2026-08-11","url":"https://www.sec.gov/Archives/edgar/data/1377630/000119312526344956/ncmi-ex10_1.htm","sentences":[]},"qa":[]},{"cik":"712034","name":"ACCO Brands Corp","borrower":"ACCO Brands Corporation (with ACCO Brands Australia Holding Pty. Ltd. as Australian Borrower)","gold":false,"facility":"$467.5M multicurrency revolving credit facility and \u20ac122.89M Euro Term A loan (plus an AUD Term A tranche of up to AUD 61M), maturing the earlier of Oct 30, 2029 and 180 days before maturity of the 4.25% 2029 Notes unless refinanced","stale":true,"agreement_date":"2017-01-27","cov_lite":false,"tightest":{"name":"Consolidated Leverage Ratio","period_end":"2026-09-30","basis":"reported","value":3.6,"limit":4.25,"headroom":0.15294117647058822,"cushion":0.15294117647058825},"chain":{"source":"automatic","notes":["Eighth Amendment to Third Amended and Restated Credit Agreement restates the full agreement; used as the base"],"used":[{"url":"https://www.sec.gov/Archives/edgar/data/712034/000095017025100909/acco-ex10_1.htm","title":"Eighth Amendment to Third Amended and Restated Credit Agreement","dated":"2025-07-29"}]},"covenants":[{"name":"Consolidated Leverage Ratio","metric":"net_leverage","direction":"max","section":"Section 7.11(a)","quote":"(iii) for the fiscal quarters ending September 30, 2025 and December 31, 2025, to be greater than 4.50:1.00, (iv) for the fiscal quarters ending March 31, 2026 and June 30, manner that would by its terms alter the pro rata sharing of payments required thereby or the relative priorities of such payments, without the written consent of each Lender;","summary":"Changes to pro rata sharing and to the payment waterfall priorities need each lender's (or each adversely affected lender's) consent, and releasing all or substantially all collateral or guarantees needs all lenders. However, there is no express all-lender consent requirement for subordinating the loans or their liens to other debt.","quote_verified":true},{"kind":"chewy_protection","present":"partial","section":"Section 9.10(a)(iii)","quote":"to release any Guarantor from its Guarantee of the Obligations under any Loan Document if such Person ceases to be a Subsidiary as a result of a transaction permitted hereunder (unless such Person continues to guarantee the SpinCo Notes or the 2029 Notes); and","summary":"A guarantor is released only if it stops being a Subsidiary (a majority-owned or controlled entity), not merely because it stops being wholly owned. There is no express Chewy-style provision, though.","quote_verified":true},{"kind":"unrestricted_sub_cap","present":"no","section":null,"quote":null,"summary":"The agreement has no unrestricted subsidiary designation mechanism, so it contains no such cap. Investments in non-Loan Party subsidiaries are limited by baskets in Section 7.02.","quote_verified":null},{"kind":"addback_cap","present":"yes","section":"Section 1.01 (Consolidated EBITDA)","quote":"in any four consecutive fiscal quarter period shall not exceed 10% of Consolidated EBITDA for such period prior to giving effect to this","summary":"Projected cost savings and synergies from Permitted Acquisitions are capped at 10% of EBITDA. Severance, restructuring, retention and integration cash charges are separately capped at 15% of EBITDA.","quote_verified":true},{"kind":"equity_cure","present":"no","section":null,"quote":null,"summary":"The agreement has no equity cure righ e leverage schedule has been reconstructed. (1) Leverage schedule outside the Covenant Relief Period is seasonal: 4.50x at Q1/Q2 quarter-ends and 4.00x at Q3/Q4 quarter-ends. This produced 4.50x at 3/31/24, 6/30/24, 3/31/25 and 6/30/25, and 4.00x at 9/30/24 and 12/31/24. (2) Covenant Relief Period runs from July 29, 2025 through Dec 31, 2026, with these levels: 4.50x at 9/30/25 and 12/31/25; 4.75x at 3/31/26 and 6/30/26; 4.25x at 9/30/26 and 12/31/26. The seasonal 4.50x/4.00x pattern resumes from 2027. (3) Material Acquisition step-up: after an acquisition over $200M, the leverage limit rises by 0.50x for the closing quarter and the next three quarters. Only one step-up may be in effect at a time, the limit is capped at 5.00x, and the step-up is unavailable for quarters ending in the Covenant Relief Period. (4) The leverage ratio is a net ratio. Consolidated Funded Indebtedness is netted by Unrestricted Cash of up to $100M (excluding Brazilian subsidiaries), plus all Unrestricted Cash of Brazilian subsidiaries without a cap. Permitted Supply Chain Financing is excluded from debt. Interest coverage uses cash interest net of interest income. (5) EBITDA add-backs include: non-cash write-offs, write-downs and impairments; non-cash stock compensation; other non-cash charges; severance, restructuring, retention and integration cash charges capped at 15% of EBITDA; Third Restatement transaction costs capped at $5M; Permitted Acquisition transaction expenses; and fair value accounting losses. Pro forma acquisition cost savings and synergies are capped at 10% of EBITDA. The addback_cap_pct field reports 0.10 for cost savings; restructuring has its own separate 15% cap. (6) During the Covenant Relief Period: pricing is fixed at Level 1 (SOFR + 2.25%, commitment fee 0.375%); lien, debt, purchase-money and foreign-debt baskets are reduced; the receivables financing basket is suspended; and the leverage-based restricted payment builder basket is unavailable. (7) An additional Euro Term A repayment equal to $35M is due by Sept 30, 2025. (8) Pro forma covenant tests for Permitted Acquisitions use tighter deemed levels: 3.75x through 12/31/25, 4.25x at Q1/Q2 2026, 3.75x at Q3/Q4 2026, then 0.25x inside the covenant. (9) Revolver borrowings are conditioned on Loan Party cash not exceeding $100M after giving effect (anti-cash hoarding). (10) There is no equity cure and no unrestricted subsidiary concept. (11) Maturity springs to 180 days before the 2029 Notes maturity unless those notes are refinanced.","compliance":{"form":"10-K","filed":"2026-03-09","url":"https://www.sec.gov/Archives/edgar/data/712034/000119312526098616/acco-20251231.htm","sentences":["As of and for the period ended December 31, 2025, the Company was in compliance with all applicable loan covenants under the Credit Agreement and the Senior Unsecured Notes.","60 ACCO Brands Corporation and Subsidiaries Notes to Consolidated Financial Statements (Continued) Compliance with Loan Covenants As of and for the period ended December 31, 2025, the Company was in compliance with all applicable loan covenants under its senior secured credit facilities and the Senior Unsecured Notes."]},"qa":[]},{"cik":"825542","name":"Scotts Miracle-Gro Co.","borrower":"The Scotts Miracle-Gro Company","gold":false,"facility":"$1.5B multicurrency revolver ($1,409.775M Global Tranche + $90.225M US Tranche) and $500M Tranche A term loan (amortizing $6.25M/quarter), both maturing November 21, 2030 (springing earlier maturity tied to 2029 senior notes); plus $500M+ incremental capacity.","stale":false,"agreement_date":"2025-11-21","cov_lite":false,"tightest":{"name":"Leverage Ratio","period_end":"2026-06-27","basis":"reported","value":3.78,"limit":5.0,"headroom":0.24400000000000005,"cushion":0.244},"chain":{"source":"automatic","notes":[],"used":[{"url":"https://www.sec.gov/Archives/edgar/data/825542/000082554225000018/exhibit101smg2025-11x248xk.htm","title":"Seventh Amended and Restated Credit Agreement"," anic; all subsidiaries are subject to the covenants. Investments are limited by the general Section 6.04 baskets and ratio tests, not by an unrestricted-sub cap.","quote_verified":null},{"kind":"addback_cap","present":"no","section":null,"quote":null,"summary":"EBITDA adds back non-recurring losses and non-cash charges without a cap. The ratio definitions credit savings from acquisitions and dispositions with no percentage cap or time limit.","quote_verified":null},{"kind":"equity_cure","present":"no","section":null,"quote":null,"summary":"There is no equity cure right; a breach of Section 5.09 or 5.10 is an immediate Event of Default.","quote_verified":null}],"accuracy":[{"metric":"total_leverage","period_end":"2025-09-30","reported":4.1,"reported_limit":4.75,"our_limit":5.0,"limit_match":null,"xbrl":null,"adjusted":3.6385330759782417,"xbrl_error":null,"adjusted_error":-0.1125529082979897,"url":"https://www.sec.gov/Archives/edgar/data/825542/000082554225000022/smg-20250930.htm"},{"metric":"fixed_charge_coverage","period_end":"2025-09-30","reported":1.42,"reported_limit":1.0,"our_limit":null,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/825542/000082554225000022/smg-20250930.htm"},{"metric":"total_leverage","period_end":"2025-12-27","reported":4.03,"reported_limit":5.0,"our_limit":5.0,"limit_match":true,"xbrl":null,"adjusted":4.405944055944056,"xbrl_error":null,"adjusted_error":0.09328636623921982,"url":"https://www.sec.gov/Archives/edgar/data/825542/000082554226000008/smg-20251227.htm"},{"metric":"total_leverage","period_end":"2026-03-28","reported":3.71,"reported_limit":5.0,"our_limit":5.0,"limit_match":true,"xbrl":null,"adjusted":3.8525830865416255,"xbrl_error":null,"adjusted_error":0.0384320987982818,"url":"https://www.sec.gov/Archives/edgar/data/825542/000082554226000024/smg-20260328.htm"},{"metric":"total_leverage","period_end":"2026-06-27","reported":3.78,"reported_limit": ve licenses granted to third parties outside the U.S.","quote_verified":true},{"kind":"serta_protection","present":"yes","section":"Section 10.01(j)","quote":"prior to the occurrence of an Event of Default pursuant to Section 8.01(f), (i) subordinate in right of payment, or have the effect of subordinating in right of payment, the Obligations hereunder to any other Indebtedness or other obligation without the written consent of each Lender directly affected thereby or (ii) subordinate in priority, or have the effect of subordinating in right of priority, the Liens securing the Obligations to Liens securing any other Indebtedness or other obligation without the written consent of each Lender directly affected thereby; or","summary":"Payment or lien subordination of the loans, including amendments having that effect, needs each directly affected lender's consent; the protection lapses once an insolvency Event of Default occurs (e.g., to allow a DIP facility). Changes to pro rata sharing also require each affected lender's consent, and assignments to the Borrower or its affiliates are prohibited.","quote_verified":true},{"kind":"chewy_protection","present":"partial","section":"Section 9.10(b)","quote":"to release any Subsidiary Guarantor from its obligations under the Subsidiary Guaranty and release the pledge of its assets, stock and indebtedness if such Person (i) ceases to be a Subsidiary as a result of a transaction permitted hereunder or (ii) becomes an Excluded Subsidiary (it being understood that no Subsidiary Guarantor shall be released from its Guarantee in connection with a de minimis transfer of Equity Interests in such Subsidiary Guarantor if there is no bona fide business purpose for such transfer of Equity Interests and/or such transfer of Equity Interest is intended solely to obtain a release of the Guarantee, in each case as determined in good faith by the Borrower).","summary":"A guarantor is released if it becomes an Excluded Subsidiary, which includes a subsidiary that is no longer wholly owned. A de minimis equity transfer made solely to obtain the release, without a bona fide business purpose, does not trigger release, but that determination is made by the Borrower in good faith.","quote_verified":true},{"kind":"unrestricted_sub_cap","present":"no","section":null,"quote":null,"summary":"The agreement has no unrestricted subsidiary mechanism. Investments in non-guarantor Excluded Subsidiaries are limited by baskets (e.g., greater of $40M/10% of EBITDA per year subject to 3.50x leverage), but other baskets are leverage-based and unlimited, so there is no hard overall cap.","quote_verified":null},{"kind":"addback_cap","present":"yes","section":"Section 1.01 (definitions of Consolidated EBITDA clauses (a)(vii) and (a)(xiv), and Permitted Cost Savings)","quote":"provided that the aggregate amount of all cost savings, operating expense reductions and synergies that may be added back to Consolidated EBITDA of the Borrower and its consolidated Subsidiaries (including pursuant to the definition of \u201cPro Forma Basis\u201d) during such measurement period (together with all amounts added back to Consolidated EBITDA pursuant to clauses (a)(vii) and (a)(xiv) of the definition thereof) does not exceed the greater of (x) $100,000,000 and (y) 25% of Consolidated EBITDA of the Borrower and its consolidated Subsidiaries (as calculated after giving effect to such adjustments) for any four fiscal quarter period.","summary":"Restructuring charges, integration costs and projected cost savings/synergies are capped in aggregate at the greater of $100M and 25% of Consolidated EBITDA, with EBITDA calculated after giving effect to the add-backs. Other add-backs, such as general non-cash charges and EU MDR costs, are uncapped.","quote_verified":true},{"kind":"equity_cure","present":"no","section":null,"quote":null,"summary":"The agreement has no equity cure right for the financial covenants.","quote_verified":null}],"accuracy":[{"metric":"net_leverage","period_end":"2025-12-31","reported":4.5,"reported_limit":5.0,"our_limit":null,"limit_match":null,"xbrl":null,"adjusted":1.548103119734169,"xbrl_error":null,"adjusted_error":-0.655977084503518,"url":"https://www.sec.gov/Archives/edgar/data/917520/000091752026000011/iart-20251231.htm"},{"metric":"net_leverage","period_end":"2026-03-31","reported":4.12,"reported_limit":5.0,"our_limit":null,"limit_match":null,"xbrl":null,"adjusted":1.4544457505726094,"xbrl_error":null,"adjusted_error":-0.6469791867542211,"url":"https://www.sec.gov/Archives/edgar/data/917520/000091752026000041/iart-20260331.htm"},{"metric":"net_leverage","period_end":"2026-06-30","reported":4.1,"reported_limit":5.0,"our_limit":null,"limit_match":null,"xbrl":null,"adjusted":1.4611128572191023,"xbrl_error":null,"adjusted_error":-0.6436310104343652,"url":"https://www.sec.gov/Archives/edgar/data/917520/000091752026000058/iart-20260630.htm"},{"metric":"net_leverage","period_end":"2026-09-30","reported":3.8,"reported_limit":4.75,"our_limit":4.75,"limit_match":null,"xbrl":null,"adjusted":1.3149720017011624,"xbrl_error":null,"adjusted_error":-0.6539547363944309,"url":"https://www.sec.gov/Archives/edgar/data/917520/000091752026000077/iart-20260930.htm"}],"notes":"Although named 'Total' leverage, Consolidated Funded Indebtedness is defined net of all available unrestricted cash and Cash Equivalents on the latest balance sheet, with no cap, so the leverage covenant is effectively a net leverage test. Leverage covenant may be stepped up by up to 0.50x (never above 4.50x) for 12 months following a Material Acquisition (aggregate consideration > $200M), at the Borrower's election, up to two times during the term. Interest coverage uses Consolidated Cash Interest Charges in the denominator. Financial covenants protect the pro rata facilities (revolver and Term A) only: amendments/waivers of Section 7.17 need only Required Pro Rata Lenders, and a breach is an Event of Default for Term B lenders only after the Required Pro Rata Lenders accelerate (Term B is effectively covenant-lite). For Section 7.17 tests, events after the end of the Reference Period are not given pro forma effect. EBITDA add-backs are broad: all non-cash charges (which captures stock compensation and impairments), restructuring, integration costs, Permitted Cost Savings (24-month look-forward), transaction fees, ERP costs ($5M/yr cap), manufacturing remediation ($10M/yr cap), SKU rationalization ($25M/yr cap), EU MDR compliance costs (uncapped), non-recurring milestone/royalty/upfront payments, and extraordinary or non-recurring cash losses. The Consolidated Senior Secured Net Leverage Ratio is used only for the ECF sweep and for incurrence tests. Collateral package: first lien shared pari passu with $450M 9.500% senior secured notes due 2033 under a First Lien Intercreditor Agreement. The agreement has no unrestricted subsidiary concept; non-guarantor 'Excluded Subsidiaries' play that role. Term B carries 101 soft call for 12 months.","compliance":{"form":"10-Q","filed":"2026-10-23","url":"https://www.sec.gov/Archives/edgar/data/917520/000091752026000077/iart-20260930xexx104.htm","sentences":[]},"qa":[]},{"cik":"885725","name":"Boston Scientific Corp.","borrower":"Boston Scientific Corporation","gold":false,"facility":"$2.0bn 364-day revolving credit facility (including a $600m multicurrency sublimit, plus optional Local Currency Facilities) to fund the Penumbra acquisition. It matures 364 days after the earlier of the Closing Date and consummation of the acquisition, with an option to term out for one year for a 0.50% fee.","stale":false,"agreement_date":"2026-02-26","cov_lite":false,"tightest":null,"chain":{"source":"automatic","notes":[],"used":[{"url":"https://www.sec.gov/Archives/edgar/data/885725/000088572526000017/exhibit102-creditagreement.htm","title":"Credit Agreement","dated":"2026-02-26"}]},"covenants":[{"name":"Consolidated Leverage Ratio","metric":"total_leverage","direction": uote_verified":null},{"kind":"addback_cap","present":"no","section":null,"quote":null,"summary":"EBITDA has no add-back for projected cost savings, synergies or restructuring, so there is no such cap. The only capped add-back is cash litigation payments, limited to $1.16bn cumulative since 12/31/2025.","quote_verified":null},{"kind":"equity_cure","present":"no","section":null,"quote":null,"summary":"There is no equity cure right; a breach of the leverage covenant is an immediate Event of Default under Section 10(c).","quote_verified":null}],"accuracy":[{"metric":"total_leverage","period_end":"2025-12-31","reported":1.92,"reported_limit":4.5,"our_limit":null,"limit_match":null,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/885725/000088572526000010/bsx-20251231.htm"},{"metric":"total_leverage","period_end":"2026-03-31","reported":1.87,"reported_limit":4.25,"our_limit":4.25,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/885725/000088572526000033/bsx-20260331.htm"},{"metric":"total_leverage","period_end":"2026-06-30","reported":2.02,"reported_limit":4.0,"our_limit":4.0,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/885725/000088572526000053/bsx-20260630.htm"},{"metric":"total_leverage","period_end":"2026-09-30","reported":1.95,"reported_limit":3.75,"our_limit":3.75,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/885725/000088572526000070/bsx-20260930.htm"}],"notes":"The Maximum Leverage Ratio is 3.75x. After any Qualified Acquisition it steps up for the four fiscal quarters ending after the deal, counting the quarter of closing: 4.75x for those four quarters, then 4.50x, 4.25x and 4.00x, then back to 3.75x. A Qualified Acquisition is one financed with at least $1bn of debt and designated by notice to the Agent. The agreement deems the step-ups from the November 15, 2024 acquisition to be in effect. On our reading of that schedule: 4.75x ran Q4 2024 through Q3 2025, 4.50x Q4 2025, 4.25x Q1 2026, 4.00x Q2 2026, and 3.75x from Q3 2026. These threshold dates are our derivation, not stated in the agreement. If the Penumbra acquisition (the purpose of this facility) is designated a Qualified Acquisition, a new 4.75x step-up period would start. Consolidated Total Debt is gross (no cash netting) and excludes debt raised to prefund a Qualified Acquisition until it closes or is abandoned. ASC 842 lease changes are excluded. EBITDA add-backs include: non-cash extraordinary, unusual or nonrecurring charges; acquisition-related charges (including inventory step-up and purchased R&D); non-cash stock comp; Non-Cash Charges (including intangible asset impairment); business combination contingent consideration; and cash litigation payments, capped at $1.16bn cumulative since 12/31/2025. There is no add-back for projected cost savings or synergies. Other terms: the facility is unsecured with no subsidiary guarantors (the Borrower guarantees any Foreign Subsidiary Borrowers). It is investment-grade style, with no unrestricted subsidiary concept and no restricted payments or investments covenants. Subsidiary debt is capped at 12.5% of Consolidated Tangible Assets, subject to exceptions. The general lien basket is the greater of $500m and 7.5% of Consolidated Tangible Assets. Commitments terminate automatically if the Penumbra acquisition is not consummated by the Outside Date. The financial covenant breach is an immediate Event of Default with no grace period.","compliance":{"form":"10-Q","filed":"2026-11-02","url":"https://www.sec.gov/Archives/edgar/data/885725/000088572526000070/bsx-20260930.htm","sentences":["Financial Covenant As of September 30, 2026, we were in compliance with the financial covenant required by our credit agreements described above.","47 Table of Contents Financial Covenant As of September 30, 2026, we were in compliance with the financial covenant required by our credit agreements described above."]},"qa":[]},{"cik":"89089","name":"Service Corp. International","borrower":"Service Corporation International","gold":false,"facility":"$1.75B senior unsecured revolving credit facility and $750M Tranche A term loan, both maturing on the fifth anniversary of the Effective Date (about November 2030), plus $750M incremental capacity","stale":false,"agreement_date":"2025-11-20","cov_lite":false,"tightest":{"name":"Consolidated Total Net Leverage Ratio","period_end":"2026-09-30","basis":"reported","value":3.69,"limit":5.0,"headroom":0.262,"cushion":0.262},"chain":{"source":"automatic","notes":[],"used":[{"url":"https://www.sec.gov/Archives/edgar/data/89089/000008908925000097/sci2025creditagreement.htm","title":"Third Amended and Restated Credit Agreement","dated":"2025-11-20"}]},"covenants":[{"name":"Consolidated Total Net Leverage Ratio","metric":"net_leverage","direction":"max","section":"Section 6.12","quote":"The Company will not permit the Consolidated Total Net Leverage Ratio as of the last day of any Test Period to exceed 5.00 to 1.00; provided that, upon the consummation of a Qualified Material Acquisition, with respect to the fiscal quarter in which such Qualified Material Acquisition is consummated and the subsequent three consecutive fiscal quarters, the maximum permitted Consolidated Total Net Leverage Ratio set forth above shall, at the election of the Company by written notice to the Administrative Agent, be increased to 5.50 to 1.00 (a \u201cLeverage Increase Election\u201d); provided further that not more than two Leverage Increase Elections may be made since the Effective Date.","quote_verified":true,"thresholds":[{"value":5.0,"applies_from":null}],"test_frequency":"quarterly","springing_condition":null,"cash_netting_cap":null,"cash_netting_cap_pct_ebitda":nu d":true},{"kind":"unrestricted_sub_cap","present":"no","section":null,"quote":null,"summary":"There are no unrestricted subsidiaries, so there is no designation cap. Investments by loan parties in non-guarantor subsidiaries and JVs are capped at $300M under Section 6.06(b)/(c), but the general basket in Section 6.06(u) allows unlimited investments subject to pro forma covenant compliance.","quote_verified":null},{"kind":"addback_cap","present":"yes","section":"Section 1.01 (definition of \"EBITDA\")","quote":"Notwithstanding the foregoing, the aggregate amount of the add-backs permitted pursuant to clauses (e) and (l) above, shall not exceed 25% of Consolidated EBITDA for the applicable four quarter period (calculated after giving effect to any such add-backs).","summary":"Restructuring, integration and business-optimization costs (clause (e)) and run-rate cost savings and synergies (clause (l)) together are capped at 25% of Consolidated EBITDA, measured after the add-backs. Transaction fees and nonrecurring items are not subject to the cap.","quote_verified":true},{"kind":"equity_cure","present":"no","section":null,"quote":null,"summary":"The agreement contains no equity cure right for the financial covenant; a breach of Section 6.12 is an immediate Event of Default under Section 7.01(d).","quote_verified":null}],"accuracy":[{"metric":"total_leverage","period_end":"2025-12-31","reported":3.67,"reported_limit":5.0,"our_limit":5.0,"limit_match":true,"xbrl":3.9686639799501346,"adjusted":null,"xbrl_error":0.08137983104908297,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/89089/000162828026007695/sci-20251231.htm"},{"metric":"total_leverage","period_end":"2026-03-31","reported":3.68,"reported_limit":5.0,"our_limit":5.0,"limit_match":true,"xbrl":3.9935685794287363,"adjusted":null,"xbrl_error":0.08520885310563475,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/89089/000008908926000034/sci-20260331.htm"},{"metric":"total_leverage","period_end":"2026-06-30","reported":3.77,"reported_limit":5.0,"our_limit":5.0,"limit_match":true,"xbrl":4.077839343244188,"adjusted":null,"xbrl_error":0.08165499820800726,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/89089/000008908926000081/sci-20260630.htm"},{"metric":"total_leverage","period_end":"2026-09-30","reported":3.69,"reported_limit":5.0,"our_limit":5.0,"limit_match":true,"xbrl":3.9504914121383536,"adjusted":null,"xbrl_error":0.07059387862828004,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/89089/000008908926000098/sci-20260930.htm"}],"notes":"Single maintenance covenant: max Consolidated Total Net Leverage Ratio of 5.00x, tested on the last day of each Test Period (rolling four quarters), applying to both revolver and term loan. The borrower may elect a temporary step-up to 5.50x for the quarter in which a Qualified Material Acquisition (cash consideration of $250M or more) closes and the next three quarters; at most two such elections over the life of the deal. Restricted payments made during Leverage Increase Election periods are capped at $300M in aggregate. Net debt deducts 100% of unrestricted cash and Cash Equivalents with no dollar cap. Debt counts borrowed money, capital leases and notes/bonds; undrawn letters of credit are excluded. EBITDA starts from consolidated operating income, not net income. Add-backs include: impairments and losses on asset sales; D&A; non-cash stock comp; other non-cash expenses; restructuring, integration, severance and similar costs for 24 months; run-rate cost savings and synergies with a 24-month realization window; transaction fees, including for deals not completed; extraordinary, nonrecurring or unusual losses; and mark-to-market hedge losses. Surety premiums are deducted. Restructuring/integration costs (clause (e)) and run-rate synergies (clause (l)) together are capped at 25% of Consolidated EBITDA. ASC 842 lease liabilities are excluded from debt. The facility is unsecured and guaranteed by material wholly-owned domestic subsidiaries. There is no unrestricted subsidiary concept; all subsidiaries are restricted. A mandatory term loan prepayment from asset sale proceeds applies when pro forma net leverage is 4.00x or higher, with reinvestment allowed if 5.00x or lower. Releasing all or substantially all guarantee value requires all-lender consent. Incremental capacity is $750M.","compliance":{"form":"10-Q","filed":"2026-10-29","url":"https://www.sec.gov/Archives/edgar/data/89089/000008908926000098/sci-9302026x10q.pdf","sentences":[]},"qa":[]},{"cik":"2014596","name":"Concentra Group Holdings Parent Inc.","borrower":"Concentra Health Services, Inc.","gold":false,"facility":"$950M Tranche B-1 Term Loan maturing July 26, 2031 and $450M Revolving Credit Facility ($75M LC sublimit) maturing July 26, 2029","stale":false,"agreement_date":"2024-07-26","cov_lite":false,"tightest":{"name":"Total Net Leverage Ratio","period_end":"2026-09-30","basis":"reported","value":2.9,"limit":6.5,"headroom":0.5538461538461539,"cushion":0.5538461538461539},"chain":{"source":"automatic","notes":["Amendment No. 1 to Credit Agreement restates the full agreement; used as the base"],"used":[{"url":"https://www.sec.gov/Archives/edgar/data/2014596/000201459625000009/amendment1creditagreemen.htm","title":"Amendment No. 1 to Credit Agreement","dated":"2025-03-03"}]},"covenants":[{"name":"Total Net Leverage Ratio","metric":"net_leverage","direction":"max","section":"Section 6.12","quote":"On any Compliance Date, the Borrower will not permit the Total Net Leverage Ratio as of such Compliance Date to be greater than 6.50 to 1.00 (the \u201cFinancial Covenant\u201d).","quote_verified":true,"thresholds":[{"value":6.5,"applies_from":null}],"test_frequency":"quarterly","springing_condition":null,"cash_netting_cap":null,"cash_netting_cap_pct_ebitda":null,"latest":{"period_end":"2026-09-30","basis":"reported","value":2.9,"limit":6.5,"headroom":0.5538461538461539,"cush  Section 5.14(iv)","quote":"Notwithstanding any provision to the contrary contained in this Agreement, neither Holdings nor the Borrower will, nor will they permit any Restricted Subsidiary to, consummate any transaction that results in the transfer by Holdings or any Restricted Subsidiary of Material Intellectual Property (whether by Investment, Restricted Payment, or any sale, lease or disposition, and whether in a single transaction or a series of related transactions) to any Unrestricted Subsidiary.","summary":"Transfers of Material Intellectual Property to Unrestricted Subsidiaries are prohibited. Under Section 5.14(iv), no subsidiary may be designated as, or continue as, an Unrestricted Subsidiary if it owns or exclusively licenses Material Intellectual Property.","quote_verified":true},{"kind":"serta_protection","present":"yes","section":"Section 9.02(b)(xii)","quote":"contractually subordinate the Obligations in right of payment or the Liens securing the Obligations to other Indebtedness (other than (A) in respect of any \u201cdebtor-in-possession\u201d facility or (B) to the extent the Borrower has offered each Lender directly affected thereby an opportunity on a pro rata basis to participate in the applicable indebtedness on the same terms as the other lenders participating in such transaction) without the written consent of each Lender adversely affected thereby","summary":"Payment or lien subordination of the Obligations to other debt requires the consent of each adversely affected lender. Two carve-outs apply: DIP financings, and deals where every affected lender was offered pro rata participation on the same terms.","quote_verified":true},{"kind":"chewy_protection","present":"yes","section":"Section 1.01 (definition of \"Excluded Subsidiary\")","quote":"provided, further, that any Guarantor that ceases to be a wholly-owned subsidiary of Holdings as a result of a transfer of Equity Interests to (i) an Affiliate of the Borrower or (ii) in a transaction that is not a bona fide arm\u2019s-length transaction shall not be released from its Guarantee.","summary":"A guarantor that stops being wholly owned is not released if the equity went to a Borrower affiliate or the transfer was not a bona fide arm's-length transaction. A genuine arm's-length sale of a minority stake to a third party could still lead to release.","quote_verified":true},{"kind":"unrestricted_sub_cap","present":"partial","section":"Section 6.04(w); Section 5.14","quote":"Investments in Unrestricted Subsidiaries in an amount not to exceed the greater of $100,000,000 and 25% of Consolidated EBITDA for the most recently ended Test Period.","summary":"There is a dedicated basket of the greater of $100M and 25% of EBITDA for investments in Unrestricted Subsidiaries, and a designation counts as an investment at fair market value. This is not a hard cap, because other investment baskets can also be used: the Available Amount, the general basket, and an unlimited basket available at 4.75x Total Net Leverage.","quote_verified":true},{"kind":"addback_cap","present":"yes","section":"Section 1.01 (definition of \"Consolidated EBITDA\", clauses (xiii) and (xiv))","quote":"in an aggregate amount not to exceed 30% (together with amounts under clause (xiii) above) of Consolidated EBITDA in such Test Period (calculated after giving effect to the applicable addbacks and adjustments)","summary":"Restructuring and cost-savings charges plus projected run-rate cost savings and synergies are capped together at 30% of Consolidated EBITDA. The cap is calculated after giving effect to the add-backs themselves.","quote_verified":true},{"kind":"equity_cure","present":"yes","section":"Section 7.02","quote":"Notwithstanding anything herein to the contrary, (a) in each four-fiscal-quarter period there shall be at least two fiscal quarters in which the Cure Right is not exercised and no more than five (5) Cure Rights shall be exercised during the Revolving Availability Period, (b) the Cure Amount shall be no greater than the amount required for purposes of complying with the Financial Covenant and (c) the Cure Amount shall be set forth in an officer\u2019s certificate delivered to the Administrative Agent.","summary":"Holdings may cure a Financial Covenant breach with new equity, which is added to EBITDA. Cures cannot be used in more than two quarters of any four-quarter period, are limited to five over the life of the revolver, and may not exceed the amount needed to comply.","quote_verified":true}],"accuracy":[{"metric":"net_leverage","period_end":"2025-12-31","reported":3.4,"reported_limit":6.5,"our_limit":6.5,"limit_match":true,"xbrl":3.5557948032234195,"adjusted":null,"xbrl_error":0.045822000948064545,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/2014596/000201459626000029/cghp-20251231.htm"},{"metric":"total_leverage","period_end":"2026-03-31","reported":3.4,"reported_limit":6.5,"our_limit":6.5,"limit_match":true,"xbrl":3.43813750752012,"adjusted":null,"xbrl_error":0.011216913976505927,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/2014596/000201459626000044/cghp-20260331.htm"},{"metric":"total_leverage","period_end":"2026-09-30","reported":2.9,"reported_limit":6.5,"our_limit":6.5,"limit_match":true,"xbrl":2.9179254507127856,"adjusted":null,"xbrl_error":0.006181189900960504,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/2014596/000201459626000077/cghp-20260930.htm"}],"notes":"The only maintenance covenant is the 6.50x Total Net Leverage Ratio in Section 6.12. It is tested on each Compliance Date, meaning the last day of each Test Period starting December 31, 2024. It is not tied to revolver usage, but it exists for the benefit of the Revolving Lenders only. The Required Revolving Lenders alone may amend or waive it. A breach is not an Event of Default for the Term Loans unless and until the Required Revolving Lenders terminate their commitments and accelerate. Amendment No. 1 (March 3, 2025) did not change the covenant level. It refinanced the Initial Term Loans into $950M Tranche B-1 Term Loans, funding the Nova Medical Centers acquisition. It also added $50M of revolving commitments and cut pricing. Total Net Indebtedness nets all unrestricted cash and Permitted Investments with no cap. For covenant testing, cash may be measured as of the calculation date under Section 1.06. Consolidated EBITDA add-backs include: broad non-cash charges, including impairments (ASC 350/360 charges are also excluded from Consolidated Net Income); non-cash stock and management equity plan costs; transaction, equity and debt issuance costs; and restructuring, integration, severance and similar charges. Projected run-rate cost savings and synergies are also added back, realizable within 18 months; together with the restructuring add-back they are capped at 30% of Consolidated EBITDA. Further add-backs cover losses from facilities open 18 months or less, earn-out changes, and insured or indemnified losses. Under the equity cure, the Cure Amount is added to EBITDA. Debt paydown from cure proceeds is disregarded for four test periods. Other notable terms: $650M New Unsecured Notes; an incremental free-and-clear amount of the greater of $400M and 100% of EBITDA; a ratio incremental at 5.00x First Lien Net Leverage; and an unlimited ratio-based investment basket at 4.75x Total Net Leverage, which can be used for Unrestricted Subsidiaries.","compliance":{"form":"10-K","filed":"2026-02-26","url":"https://www.sec.gov/Archives/edgar/data/2014596/000201459626000029/cghp-20251231.htm","sentences":["As of December 31, 2025, the Company was in compliance with all debt covenants."]},"qa":[]},{"cik":"37785","name":"FMC Corp.","borrower":"FMC Corporation","gold":false,"facility":"$2.0 billion multicurrency revolving credit facility (including $400M letter of credit sublimit and $50M swingline; accordion to $2.75 billion), maturing six years after the June 2022 Effective erage is still tested in those quarters. Both leverage ratios net only unrestricted cash above a $150M floor; this is a floor, not a cap, and escrowed debt proceeds count as unrestricted cash. EBITDA adds back all non-cash charges (which covers stock comp), Non-Recurring Items (restructuring provisions, discontinued operations, special reserves, asset write-downs/write-offs), and M&A/divestiture fees, plus up to $100M of non-recurring cash restructuring charges during the relief period. It also gives pro forma credit for acquisitions. There are no cost-savings or synergy add-backs. Amendment 6 converted the facility to a secured, guaranteed structure (Guarantee and Collateral Agreement, subsidiary guarantors in Eligible Jurisdictions, intercompany subordination) and added the Secured Leverage covenant. It also permits pari passu secured debt on the Collateral subject to covenant compliance, and a First Lien Pari Passu Intercreditor Agreement dated June 5, 2026 exists with U.S. Bank as Additional First Lien Agent. Relief-period restrictions: dividends capped at $0.08/quarter unless pro forma leverage <=3.75x; buybacks limited; non-guarantor subsidiary debt capped at $350M. Amendment 7 permits a first-priority lien on the Rimisoxafen ('Rimi IP') in favor of Corteva securing up to $200M of refund obligations, released the lenders' lien on that IP, and requires re-grant when the Corteva lien ends. Amendment 8 waived missed joinder deadlines (New US LLC guarantor joinder; New Dutch BV intercompany subordination joinder). It also released liens on FMC India equity, contributed cash (<=$25M), cancelled receivables and intercompany claims, and releases two guarantors at the closing of the FMC India sale, with reinstatement if the sale does not close by Dec 31, 2026. Sale proceeds must go to repaying debt under the facility or to general corporate purposes. Events of default include a Change of Control.","compliance":{"form":"10-Q","filed":"2026-10-30","url":"https://www.sec ry, no release of a Guarantor shall be required pursuant to it ceasing to be a wholly-owned Subsidiary unless either (i) it is the result of a bona fide sale of equity interests to an un-Affiliated third party or (ii) in the case of any other sale or investment of equity interests that results in the release of such Guarantor due to such Guarantor ceasing to be a wholly-owned subsidiary, the investment of the fair market value of the balance of the equity interests would have been otherwise permitted as an Investment in a non-Guarantor.","summary":"A guarantor is not released merely by ceasing to be wholly owned unless the change comes from a bona fide sale to an unaffiliated third party. Alternatively, the release is allowed if the retained equity's fair market value could have been invested in a non-guarantor under the investment baskets. That alternative weakens the protection.","quote_verified":true},{"kind":"unrestricted_sub_cap","present":"yes","section":"Definition of \"Permitted Investment\" (clause (28) and final proviso); Section 6.15(a)","quote":"and (b) no Investment (including, without limitation, any Restricted Investment) may be made by the Borrower and its Restricted Subsidiaries in, to or for the benefit of any Unrestricted Subsidiary other than Investments made in reliance on clause (28) above.","summary":"Investments in Unrestricted Subsidiaries may only be made under clause (28). That basket is capped at the greater of $200 million and 50% of LTM EBITDA outstanding, shared with investments in similar businesses. Designation also requires pro forma Total Net Leverage of 3.50x or less and no Event of Default.","quote_verified":true},{"kind":"addback_cap","present":"yes","section":"Definition of \"Consolidated EBITDA\", clause (1)(d)","quote":"provided, that such aggregate amounts pursuant to this clause (d), together with any add-backs made pursuant to clause (5) of the definition of \u201cConsolidated Net Income\u201d, shall not exceed 20% of Cons ps://www.sec.gov/Archives/edgar/data/1076930/000119312526335404/novt-20260703.htm"},{"metric":"total_leverage","period_end":"2026-10-02","reported":2.43,"reported_limit":4.0,"our_limit":4.0,"limit_match":true,"xbrl":3.4855696444348925,"adjusted":2.8200386398763526,"xbrl_error":0.43439080017896803,"adjusted_error":0.16050972834417787,"url":"https://www.sec.gov/Archives/edgar/data/1076930/000119312526453802/novt-20261002.htm"},{"metric":"fixed_charge_coverage","period_end":"2026-10-02","reported":4.0,"reported_limit":1.25,"our_limit":1.25,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1076930/000119312526453802/novt-20261002.htm"}],"notes":"Both covenants are tested quarterly, starting with the Measurement Period ending September 26, 2025. The Third Amendment (June 8, 2026) restated both covenants; the amended text is quoted above.\n\nLeverage covenant:\n- The base maximum is 4.00x, previously 3.75x.\n- At the Borrowers' election, the limit rises to 4.50x (previously 4.25x) for the four consecutive quarters after a Designated Acquisition, meaning a Permitted Acquisition with consideration of at least $50M.\n- This holiday may be used no more than twice.\n- Despite its name, the 'Consolidated Leverage Ratio' is a net ratio. It nets unrestricted cash and Cash Equivalents of Loan Parties, cash held with the Agent or Lenders or in the US, and cash pledged to the Secured Parties, capped at $100M.\n\nFixed charge coverage covenant:\n- The minimum is 1.00x for the four fiscal quarters after the Specified Acquisition closes, then reverts to 1.25x.\n- The Specified Acquisition is the equity purchase under the June 8, 2026 Equity Purchase Agreement with Runway Midco/Runway Buyer.\n- The 1.00x step is tied to a closing that had not occurred as of the amendment date, so no calendar date is recorded for it.\n- Numerator: EBITDA less cash capex less cash taxes.\n- Denominator: cash interest, scheduled amortization (deemed paid even if prepaid), other scheduled debt payments, and Restricted Payments under 7.06(d).\n\nThe interest coverage slot in 7.10(a) is [Reserved].\n\nOther Third Amendment changes:\n- Deferred purchase price and non-contingent seller debt for the Specified Acquisition is excluded from Consolidated Funded Indebtedness unless unpaid 10 Business Days after it falls due.\n- A new pricing level 5 applies above 3.75x leverage: SOFR+2.00% and Base Rate+1.00%.\n\nConsolidated EBITDA add-backs:\n- Acquisition expenses, capped at 15% of EBITDA.\n- Unusual or non-recurring charges including restructuring, capped at 25%.\n- Run-rate cost savings and synergies from Specified Transactions over a 12-month window, capped at 15%.\n- Non-Cash Charges, which include impairments and write-downs, equity-method losses, purchase accounting, mark-to-market hedging losses, non-cash disposition losses and stock-based compensation. This category is uncapped.\n\nThe 2026 delayed draw term loans (Second Amendment, May 15, 2026) require pro forma compliance with Section 7.10 at each funding.\n\nPro forma compliance with 7.10 is also used as an incurrence test for:\n- Permitted Acquisitions, where a Designated Acquisition is tested at 4.25x per the unamended text of 7.03(j);\n- restricted payments under 7.06(h);\n- other investments under 7.03(p);\n- unsecured debt under 7.02(n).\nThese incurrence tests are not separate maintenance covenants.\n\nRequired Lenders alone can amend the financial covenants.\n\nThere is no unrestricted subsidiary concept; all subsidiaries are restricted.","compliance":{"form":"10-Q","filed":"2026-11-09","url":"https://www.sec.gov/Archives/edgar/data/1076930/000119312526453802/novt-20261002.htm","sentences":["The Company was in compliance with these covenants as of October 2, 2026."]},"qa":[]},{"cik":"71557","name":"Nuvera Communications Inc.","borrower":"Nuvera Communications, Inc.","gold":false,"facility":"$30M revolving credit facility (i her than a percentage of EBITDA. EBITDA deducts interest income, dividends and patronage income. It is pro forma for acquisitions and dispositions.\n\nIncurrence-style leverage tests (not reported as maintenance covenants):\n- DDTL draws require pro forma Leverage Ratio \u22645.00x.\n- Restricted payments are allowed up to $3M per year at \u22644.25x and unlimited at \u22643.50x.\n- Permitted Acquisitions require a 0.50x cushion to the Section 8.1 level and are also capped at $500k individually / $1.5M aggregate.\n\nOther terms:\n- Financial covenant amendments require only Required Lenders.\n- Applicable margin grid is leverage-based (SOFR + 2.75%\u20134.00%).\n- All Subsidiaries must be Guarantors (Section 7.10).\n- There is no unrestricted subsidiary concept.","compliance":{"form":"10-Q","filed":"2026-11-16","url":"https://www.sec.gov/Archives/edgar/data/71557/000143774926037015/nuvr20260930_10q.htm","sentences":[]},"qa":[]},{"cik":"1345126","name":"Compass Diversified Holdings","borrower":"Compass Group Diversified Holdings LLC","gold":false,"facility":"$54.0M revolving credit facility (reduced by the Sixth Amendment; $54.0M L/C sublimit, $13.5M swingline) and an amortizing Term Loan (initial $400M plus first incremental, extended; $11.25M quarterly installments; outstanding amount on Schedule 2.01, not stated), with the $100M Incremental DDTL availability period ended; all maturing January 12, 2028.","stale":true,"agreement_date":"2022-07-12","cov_lite":false,"tightest":{"name":"Consolidated Total Leverage Ratio","period_end":"2026-06-30","basis":"reported","value":4.82,"limit":5.75,"headroom":0.16173913043478255,"cushion":0.1617391304347826},"chain":{"source":"automatic","notes":["Sixth Amendment to Credit Agreement restates the full agreement; used as the base"],"used":[{"url":"https://www.sec.gov/Archives/edgar/data/1345126/000134512626000062/exhibit101-sixthcreditfaci.htm","title":"Sixth Amendment to Credit Agreement","dated":"2026-08-06"}]},"covenants":[{"
