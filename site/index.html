ull,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1345126/000134512626000071/codi-20260930.htm"},{"metric":"secured_leverage","period_end":"2026-09-30","reported":0.48,"reported_limit":2.5,"our_limit":2.5,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1345126/000134512626000071/codi-20260930.htm"},{"metric":"total_leverage","period_end":"2026-09-30","reported":4.53,"reported_limit":5.75,"our_limit":5.75,"limit_match":true,"xbrl":null,"adjusted":null,"xbrl_error":null,"adjusted_error":null,"url":"https://www.sec.gov/Archives/edgar/data/1345126/000134512626000071/codi-20260930.htm"}],"notes":"Only one document was provided: the Sixth Amendment (Aug 6, 2026), which attaches a redlined conformed copy of the Third A&R Credit Agreement. The Sixth Amendment added a new step in 7.11(a): 5.00x for the quarters ending June 30, 2027 and September 30, 2027. It also reset the final total leverage level from 5.00x to 4.50x thereafter, i.e. from the quarter ending December 31, 2027 until the January 12, 2028 maturity. The quoted 7.11(a) text covers steps (i)-(iii) only, because the redline splits the amended clauses (iv)-(v) across inserted text. Covenant holiday: no Default arises from financial covenant failures for the quarters ending June 30, 2025 and September 30, 2025, and no levels are set for those quarters. For covenant calculations after the Fifth Amendment, the Lugano Entities (in Chapter 11) are deemed disposed as of December 31, 2024. Leverage ratios are net. Consolidated Net Indebtedness nets all Borrower cash in Agent-controlled accounts with no dollar cap, plus up to $25,000,000 of Portfolio Company unrestricted cash (domestic only), and cannot go below zero. Netting caps are therefore left null. Separately, a weekly anti-cash-hoarding sweep in 2.05(b)(v) holds Borrower cash at about $10,000,000. Consolidated EBITDA is the sum of Portfolio Company EBITDA less net income attributable to non-controlling interests. Add-backs include: interest, taxes and D&A; management fees; acquired IPR&D charges; non-cash forgiveness of management loans; other non-cash expenses with no cash outlay foreseeable before maturity; integration services fees and deal closing costs; and capped add-on integration costs. Pre-acquisition pro forma EBITDA may include identifiable and verifiable expense reductions under Reg S-X Article 11, subject to Agent adjustments, with no percentage cap. The FCCR numerator deducts cash taxes and tax distributions, capex, cash management fees and Borrower Expenses. Up to $50M of Lugano investigation/bankruptcy costs are excluded from Borrower Expenses for periods through December 31, 2025. The FCCR denominator is cash interest plus scheduled principal. Covenants are also tested pro forma as conditions to each credit extension (4.02(d)). Separate 4.50x pro forma Total Leverage incurrence tests now gate acquisitions, capital contributions, Dispositions, certain Restricted Payments, unsecured debt prepayments, new subsidiaries and earn-outs; these are not maintenance covenants. Revolver availability is limited by a Borrowing Base-style 'Borrowing Availability' tied to Portfolio Company EBITDA multiples and Qualified Intercompany Debt. Pricing is at Tier 6 (SOFR+3.25%) until the first compliance certificate after the Sixth Amendment. Section 2.09(b) carries a $4M milestone fee if the Term Loans are not repaid by December 31, 2026; the Sixth Amendment separately waived the milestone fees under the Fifth Amendment Transaction Letter. Distress features: the Agent's financial advisor (FTI), biweekly 13-week cash flow forecasts, mandatory prepayment of 100% of asset sale and Fifth Amendment transaction proceeds, management fee caps, and incremental capacity cut to $150M or 2.00x senior secured leverage. There are no subsidiary guarantors; the credit is a holdco loan secured by Borrower assets, including pledged portfolio company equity and intercompany loans. The 4.01 and 5.06 sections contain duplicated text in the conformed copy.","compliance":{"form":"10-Q","filed":"2026-11-04","url":"https://www.sec.gov/Archives/edgar/data/1345126/000134512626000071/codi-20260930.htm","sentences":["00 As of September 30, 2026, the Company was in compliance with all covenants as defined by the 2022 Credit Facility, as amended.","Velocity was not in compliance with the fixed charge coverage ratio or leverage ratio in their intercompany credit agreement at September 30, 2025, December 31, 2025, March 31, 2026 and June 30, 2026 and was granted a waiver for the covenant violations in each period.","At September 30, 2025, Arnold was not in compliance with the fixed charge coverage ratio and leverage ratio covenants contained within its intercompany credit agreement.","Arnold was not in compliance with the fixed charge coverage ratio and leverage ratio covenants contained within its intercompany credit agreement at December 31, 2025, and was not in compliance with the fixed charge coverage ratio at March 31, 2026 and was granted a waiver for the covenant violations in each period."]},"qa":[]},{"cik":"795266","name":"KB Home","borrower":"KB Home","gold":false,"facility":"$360,000,000 delayed-draw term loan (single draw within 90 days of closing; accordion up to $600,000,000), unsecured, maturing November 12, 2029; KB Home also has a separate Revolving Loan Agreement dated November 12, 2025 (Bank of America, agent).","stale":false,"agreement_date":"2025-11-12","cov_lite":false,"tightest":null,"chain":{"source":"automatic","notes":[],"used":[{"url":"https://www.sec.gov/Archives/edgar/data/795266/000079526626000017/kbh-113025x10kexhibit1025.htm","title":"Amended and Restated Term Loan Agreement","dated":"2025-11-12"}]},"covenants":[{"name":"Consolidated Tangible Net Worth","metric":"other","direction":"min","section":"Section 6.9","quote":"Permit Consolidated Tangible Net Worth to be, at the end of any Fiscal Quarter, less than an amount equal to (a) $ 2,701,014,000","quote_verified":true,"thresholds":[{"value":2701014000.0,"applies_from":null}],"test_frequency":"quarterly","springing_condition":null,"cash_netting_cap":null,"cash_netting_cap_pct_ebitda":null,"latest":null,"steps":[],"rows":[]},{"name":"Consolidated Leverage Ratio","metric":"other","direction":"max","section":"Section 6.10","quote":"Permit the Consolidated Leverage Ratio to be, at the end of any Fiscal Quarter, greater than 0.60 to 1.00.","quote_verified":true,"thresholds":[{"value":0.6,"applies_from":null}],"test_frequency":"quarterly","springing_condition":null,"cash_netting_cap":null,"cash_netting_cap_pct_ebitda":null,"latest":null,"steps":[],"rows":[]},{"name":"Consolidated Interest Coverage Ratio","metric":"interest_coverage","direction":"min","section":"Section 6.11(b)","quote":"the Consolidated Interest Coverage Ratio to be, at the end of any Fiscal Quarter, less than 1.50 to 1.00.","quote_verified":true,"thresholds":[{"value":1.5,"applies_from":null}],"test_frequency":"quarterly","springing_condition":"Breach occurs only if, for the same Fiscal Quarter, Liquidity (unrestricted cash of Borrower and Borrowing Base Subsidiaries not counted in the Borrowing Base, plus undrawn revolver commitments) is also less than Consolidated Interest Incurred for the four most recently ended Fiscal Quarters; meeting either test satisfies Section 6.11.","cash_netting_cap":null,"cash_netting_cap_pct_ebitda":null,"latest":null,"steps":[],"rows":[]}],"terms":[{"kind":"j_crew_blocker","present":"no","section":null,"quote":null,"summary":"The agreement has no unrestricted subsidiary concept and no restriction on transferring or licensing intellectual property; there is no J.Crew blocker.","quote_verified":null},{"kind":"serta_protection","present":"partial","section":"Section 11.2(a)(iii)","quote":"to amend or modify the provisions of the definition in Section 1.1 of \u201cRequired Banks\u201d or of Sections 11.2, 11.9, 11.10, or 11.11, or any provision providing for the ratable or pro rata treatment of the Banks without the consent of each Bank;","summary":"Changes to pro rata sharing and payment waterfall provisions need each Bank's consent, which hampers non-pro-rata exchanges. However, there is no express requirement of affected-lender consent to subordinate the (unsecured) loans or any liens to other debt.","quote_verified":true},{"kind":"chewy_protection","present":"no","section":"Section 10.11","quote":null,"summary":"Guarantor Subsidiaries are defined as wholly owned. A guarantor that ceases to be a Subsidiary, or that Borrower designates as no longer required to be a guarantor (e.g., after ceasing to be wholly owned), is automatically released on an officer's certificate. There is no protection against release upon loss of wholly owned status.","quote_verified":null},{"kind":"unrestricted_sub_cap","present":"partial","section":"Section 6.16","quote":"Permit, as of the last day of any Fiscal Quarter, Borrower\u2019s equity interest, computed in accordance with Generally Accepted Accounting Principles consistently applied, in all Subsidiaries of Borrower (other than Guarantor Subsidiaries), Financial Subsidiaries, Foreign Subsidiaries, all Joint Ventures and all other entities with financial statements not consolidated with those of Borrower under Generally Accepted Accounting Principles consistently applied to exceed an amount equal to the sum of (a) $104,811,000","summary":"There are no unrestricted subsidiaries. A quarterly-tested cap limits equity investment in non-guarantor subsidiaries, joint ventures and unconsolidated entities to $104.8 million plus 20% of Consolidated Tangible Net Worth. It is a grower cap rather than a fixed hard cap.","quote_verified":true},{"kind":"addback_cap","present":"no","section":null,"quote":null,"summary":"The EBITDA definition has no add-backs for projected cost savings, synergies or restructuring, v/Archives/edgar/data/795266/000079526626000071/kbh-20260831.htm"}],"notes":"Amended and restated term loan agreement dated November 12, 2025 (original Term Loan Agreement dated August 25, 2022), unsecured, guaranteed by wholly owned domestic Significant Subsidiaries. No later amendments were provided.\n\nSection 6.9 TNW floor: $2,701,014,000 plus 50% of positive quarterly Consolidated Net Income for quarters after August 31, 2025 (no reduction for losses), plus 50% of net equity issuance proceeds after August 31, 2025. The floor therefore ratchets up over time.\n\nSection 6.10 Consolidated Leverage Ratio is a debt-to-capitalization test, not debt/EBITDA: Consolidated Total Indebtedness divided by (Consolidated Total Indebtedness plus Consolidated Tangible Net Worth). Consolidated Total Indebtedness is net of all Unrestricted Cash in excess of $15,000,000, with no upper cap on netting. It also excludes non-recourse debt of Financial Subsidiaries and Foreign Subsidiaries.\n\nSection 6.11 is an either/or test: it is breached only if both (a) Liquidity is below trailing four-quarter Consolidated Interest Incurred and (b) the interest coverage ratio is below 1.50x. Liquidity has no fixed dollar minimum, so it is not listed as a separate covenant.\n- Interest coverage uses Consolidated Adjusted EBITDA: Consolidated EBITDA (adds back extraordinary losses, interest, taxes, D&A and all other non-cash expenses) plus capitalized interest expensed in cost of sales plus non-cash Net Realizable Value (inventory impairment) adjustments.\n- The denominator is Consolidated Interest Incurred, including capitalized interest, net of interest income.\n\nOther quarterly-tested limits:\n- Section 6.16 caps Borrower's equity investment in non-guarantor subsidiaries, Financial and Foreign Subsidiaries, joint ventures and unconsolidated entities at $104,811,000 plus 20% of CTNW.\n- Section 6.17 (borrowing base) applies only while Borrower lacks an Investment Grade Credit Rating. Borrowing Base Indebtedness may not exceed the Borrowing Base: 100% escrow receivables, 90% homes under construction, 65% land under development, 50% land held (capped at 40% of the base), and unrestricted cash over $15M.\n\nRestrictions when interest coverage is below 2.0x: share repurchases and optional payments on subordinated debt are restricted unless unrestricted cash is at least the revolver commitments and the revolver is undrawn.\n\nDefaults and other terms:\n- Breach of the financial covenants is an immediate Event of Default with no grace period.\n- There is a cross-default to the Revolving Credit Agreement.\n- Pricing grid is SOFR + 1.35%\u20131.90%, based on the leverage ratio.\n- A change in control gives Required Banks a put.\n- Investment-grade style document: no unrestricted subsidiary concept, no IP covenants, no equity cure.","compliance":{"form":"10-Q","filed":"2026-10-08","url":"https://www.sec.gov/Archives/edgar/data/795266/000079526626000071/kbh-20260831.htm","sentences":["As of the date of this report, we were in compliance with the relevant covenants.","KBHS was in compliance with these covenants as of August 31, 2026.","As of August 31, 2026, we were in compliance with the applicable terms of all of our covenants and other requirements under the Credit Facility, the Term Loan, the senior notes, the indenture, the LOC Facility, and the mortgages and land contracts due to land sellers and other loans.","As of August 31, 2026, we were in compliance with the applicable terms of all of our covenants and other requirements under the Credit Facility, the Term Loan, the senior notes, the indenture, the LOC Facility and the mortgages and land contracts due to land sellers and other loans."]},"qa":[]},{"cik":"1408075","name":"Graphic Packaging Holding Co.","borrower":"Graphic Packaging International, LLC","gold":false,"facility":"Multi-currency Revolving Credit Facility (L/C-BA sublimit $125M), Revolving Euro Tranche and Revolving Yen Tranche facilities, Term A <script>

const GLOSSARY = {
  covenant: ["Covenant", "A promise in a loan agreement. Financial covenants are tests the borrower has to pass every quarter, such as keeping debt below a multiple of earnings."],
  ebitda: ["EBITDA", "Earnings before interest, taxes, depreciation and amortization: a rough measure of the cash a business produces. Every loan agreement writes its own definition, usually with extra add-backs."],
  leverage: ["Leverage ratio", "Debt divided by EBITDA. 3.0x means debt equals three years of EBITDA. Net leverage subtracts cash from debt first. The test sets a maximum."],
  coverage: ["Coverage ratio", "EBITDA divided by interest (or by all fixed charges). Higher is safer, so the test sets a minimum."],
  headroom: ["Headroom", "How much of the limit is still unused. +25% means the ratio sits a quarter of the way inside its limit; a negative number means it is past the limit."],
  cushion: ["EBITDA cushion", "How far EBITDA could fall before the test trips, holding debt, cash and interest where they are today."],
  stepdown: ["Step-down", "A change to a limit that the agreement schedules in advance, usually tightening it over time."],
  springing: ["Springing test", "A test that only applies under a condition, for example only while the revolving credit line is drawn."],
  reported: ["Reported", "The company's own covenant figure from its 10-Q or 10-K. It comes from the compliance certificate the company sends its lenders, so it is the closest public thing to the real number."],
  estimate: ["Estimate", "Rebuilt from public filings because the company does not publish this ratio. Usually less exact than a reported figure."],
  addbacks: ["Add-backs", "Costs the agreement lets the borrower add back to EBITDA, such as stock compensation or one-time charges. More add-backs make the test easier to pass."],

};

// A ruler: where the ratio sits against its limit. For a maximum the forbidden side is to the right of the limit,

function ruler(value, limit, direction, big) {

  const top = Math.max(limit * 1.3, value * 1.12), x = v => L + Math.max(0, Math.min(v, top)) / top * (W - L - R);
  const y = big ? 30 : 4, h = big ? 12 : 6, over = direction === "max" ? value > limit : value < limit;
  const id = "h" + Math.random().toString(36).slice(2, 7);

  let ticks = "";
  if (big) for (let t = 0; t <= top; t += (top > 8 ? 2 : 1)) ticks += `<line x1="${x(t)}" x2="${x(t)}" y1="${y + h + 4}" y2="${y + h + 9}" stroke="var(--line-strong)"/><text x="${x(t)}" y="${y + h + 22}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-data)">${t}x</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${x2(value)} against a ${direction === "max" ? "maximum" : "minimum"} of ${x2(limit)}">
    <defs><pattern id="${id}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--critical)" stroke-width="1.6" opacity="0.55"/></pattern></defs>
    <rect x="${L}" y="${y}" width="${W - L - R}" height="${h}" rx="${h / 2}" fill="var(--clause)"/>
    <rect x="${bad[0]}" y="${y}" width="${Math.max(0, bad[1] - bad[0])}" height="${h}" fill="url(#${id})"/>
    <rect x="${L}" y="${y}" width="${Math.max(0, x(value) - L)}" height="${h}" rx="${h / 2}" fill="${over ? "var(--critical)" : "var(--ink-2)"}"/>
    <line x1="${x(limit)}" x2="${x(limit)}" y1="${y - (big ? 8 : 3)}" y2="${y + h + (big ? 2 : 3)}" stroke="var(--critical)" stroke-width="${big ? 2 : 1.5}"/>
    ${big ? `<text x="${x(limit)}" y="${y - 12}" text-anchor="${direction === "max" ? "start" : "end"}" dx="${direction === "max" ? -4 : 4}" font-size="12" fill="var(--critical-ink)">Limit ${x2(limit)}</text>
      <text x="${x(value)}" y="${y - 12}" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink)" font-family="var(--f-data)">${x2(value)}</text>
      <path d="M${x(value) - 5} ${y - 7}L${x(value) + 5} ${y - 7}L${x(value)} ${y - 1}Z" fill="var(--ink)"/>${ticks}` : ""}

}

let sortKey = "headroom", sortDir = 1, filt = {q: "", basis: "all", covlite: true};

}
function nextStep(b) {

  for (const c of b.covenants) for (const s of c.steps || []) if (!best || s.from < best.from) best = {...s, cov: c.name};

}

// ------------------------------------------------------------------ accuracy
function strip(points, key, label, color, max) {

  return `<g><text x="0" y="${H / 2 + 4}" fill="var(--ink-2)" font-size="12.5">${label}</text>
    ${dots.map((p, i) => `<circle cx="${xs(p[key]).toFixed(1)}" cy="${H / 2 + ((i % 5) - 2) * 4}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(p.name)} ${p.period_end}: ${pct(p[key], true)}</title></circle>`).join("")}

  </g>`;
}
function accuracy() {

        <g transform="translate(0,4)">${strip(pts, "adjusted_error", "Adjusted EBITDA", "var(--series-2)", max)}</g>

function method() {
  return `<section id="method"><h2>How it works</h2>
  <ol class="steps">
    <li><span><b>Find the borrowers.</b> EDGAR full-text search for 10-Qs that state covenant ratios, screened by Claude reading only the relevant excerpts.</span></li>
    <li><span><b>Find the contract.</b> Every loan exhibit the company filed since 2016 is pulled, Claude reads each cover page, and code links the latest base agreement to its later amendments.</span></li>
    <li><span><b>Read it once.</b> Claude Opus reads the whole chain in one request (up to about 500K tokens) and returns each maintenance covenant, its step-downs, the EBITDA add-backs, cash netting caps, and six lender protections, quoting each one.</span></li>
    <li><span><b>Check every quote in code.</b> A quote that isn't found word for word in the filing is flagged. The same rule applies to every number taken from a 10-Q or earnings release.</span></li>
    <li><span><b>Do the math in code.</b> Quarterly figures rebuilt from XBRL year-to-date facts, summed to trailing twelve months, tested against the limit in force that quarter, three ways: company-reported, company adjusted EBITDA, and GAAP line items.</span></li>
    <li><span><b>Grade it.</b> Limits and ratios the companies report are the answer key. The scores above are recomputed on every build.</span></li>
  </ol></section>`;

// ------------------------------------------------------------------ borrower page
function chart(c) {
  const rows = c.rows, W = 640, H = 230, L = 46, R = 70, T = 14, B = 28;
  const series = [["reported", "var(--series-1)", "Company reported"], ["adjusted", "var(--series-2)", "Est. from adjusted EBITDA"],
                  ["xbrl", "var(--series-3)", "Est. from GAAP line items"]].filter(([k]) => rows.some(r => r[k] != null));
  if (!series.length) return `<p class="note">${c.metric === "fixed_charge_coverage" || c.metric.startsWith("secured") || c.metric === "minimum_liquidity"
    ? "Public filings don't break out the inputs this ratio needs (secured debt, fixed charges or liquidity as the agreement defines them), so it isn't estimated."
    : "No quarter has enough public data to compute this ratio."}</p>`;
  const vals = rows.flatMap(r => [r.limit, r.reported_limit, ...series.map(([k]) => r[k])]).filter(v => v != null && isFinite(v));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.15 || 0.5; lo = Math.max(0, lo - pad); hi = hi + pad;
  const step = niceStep((hi - lo) / 4), y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
  const xs = i => L + (rows.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (rows.length - 1));
  const ys = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const ticks = []; for (let v = y0; v <= y1 + 1e-9; v += step) ticks.push(v);
  const path = k => { let d = "", on = false; rows.forEach((r, i) => { const v = r[k]; if (v == null || !isFinite(v)) { on = false; return; }
    d += (on ? "L" : "M") + xs(i).toFixed(1) + " " + ys(v).toFixed(1); on = true; }); return d; };
  const limitPath = () => { let d = "", prev = null; rows.forEach((r, i) => { const v = r.reported_limit ?? r.limit; if (v == null) { prev = null; return; }
    const x = xs(i), y = ys(v); d += prev == null ? `M${x} ${y}` : `L${x} ${ys(prev)}L${x} ${y}`; prev = v; }); return d; };
  const before = rows.map((r, i) => r.before_agreement ? i : -1).filter(i => i >= 0);
  const lastLimit = [...rows].reverse().find(r => (r.reported_limit ?? r.limit) != null);
  const id = "c" + Math.random().toString(36).slice(2, 8);
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.name)} by quarter">
    ${before.length ? `<rect x="${L}" y="${T}" width="${Math.max(0, xs(Math.max(...before)) - L + (W - L - R) / Math.max(1, rows.length - 1) / 2)}" height="${H - T - B}" fill="var(--clause)"/>
      <text x="${L + 6}" y="${T + 14}" font-size="11" fill="var(--muted)">Before this agreement</text>` : ""}
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${L - 8}" y="${ys(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-data)">${v.toFixed(step < 0.5 ? 2 : 1)}x</text>`).join("")}
    ${rows.map((r, i) => `<text x="${xs(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${qlabel(r.period_end)}</text>`).join("")}
    <path d="${limitPath()}" fill="none" stroke="var(--limit)" stroke-width="2" stroke-dasharray="6 4"/>
    ${lastLimit ? `<text x="${W - R + 6}" y="${ys(lastLimit.reported_limit ?? lastLimit.limit) + 4}" font-size="11.5" fill="var(--ink-2)">Limit ${x2(lastLimit.reported_limit ?? lastLimit.limit)}</text>` : ""}
    ${series.map(([k, col]) => `<path d="${path(k)}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
      ${rows.map((r, i) => r[k] == null || !isFinite(r[k]) ? "" : `<circle cx="${xs(i)}" cy="${ys(r[k])}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`).join("")}`).join("")}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>
    <rect class="hit" x="${L - 10}" y="0" width="${W - L - R + 20}" height="${H}" fill="transparent"/>
  </svg>`;
  setTimeout(() => wireChart(id, c, rows, series, xs), 0);
  return `<div class="legend">${series.map(([, col, label]) => `<span><i style="border-color:${col}"></i>${label}</span>`).join("")}
      <span><i class="dash" style="border-color:var(--limit)"></i>Covenant limit</span></div>
    <div class="chart" id="${id}">${svg}<div class="tip" hidden></div></div>
    <button class="toggle" data-table="${id}">Show the numbers</button>
    <div class="tablebox" id="${id}-t" hidden style="margin-top:8px"><table><thead><tr><th>Quarter</th><th class="n">Limit</th>
      ${series.map(([, , l]) => `<th class="n">${l}</th>`).join("")}<th class="n">LTM EBITDA (GAAP)</th><th class="n">LTM adj. EBITDA</th><th class="n">Debt</th><th class="n">Cash</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${r.period_end}${r.before_agreement ? " (before agreement)" : ""}</td><td class="n">${x2(r.reported_limit ?? r.limit)}</td>
        ${series.map(([k]) => `<td class="n">${x2(r[k])}</td>`).join("")}<td class="n">${money(r.ltm_ebitda_xbrl)}</td><td class="n">${money(r.ltm_ebitda_adjusted)}</td>
        <td class="n">${money(r.debt)}</td><td class="n">${money(r.cash)}</td></tr>`).join("")}</tbody></table></div>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function wireChart(id, c, rows, series, xs) {
  const box = document.getElementById(id); if (!box) return;
  const svg = $("svg", box), tip = $(".tip", box), xh = $(".xh", svg), hit = $(".hit", svg);
  const W = svg.viewBox.baseVal.width;
  const move = e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
    let i = 0, best = 1e9; rows.forEach((_, j) => { const d = Math.abs(xs(j) - x); if (d < best) { best = d; i = j; } });
    const row = rows[i];
    xh.setAttribute("x1", xs(i)); xh.setAttribute("x2", xs(i)); xh.setAttribute("visibility", "visible");
    tip.innerHTML = `<div class="eyebrow">${row.period_end}${row.before_agreement ? " · before agreement" : ""}</div>` +
      [["Limit", row.reported_limit ?? row.limit], ...series.map(([k, , l]) => [l, row[k]])].map(([l, v]) => `<div class="row2"><span>${l}</span><span>${x2(v)}</span></div>`).join("");
    tip.hidden = false;
    const px = xs(i) / W * r.width; tip.style.left = Math.min(Math.max(0, px + 12), r.width - tip.offsetWidth) + "px"; tip.style.top = "8px";
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
}
function thresholds(c) {
  return c.thresholds.map(t => x2(t.value) + (t.applies_from ? ` from ${t.applies_from}` : "")).join(", then ");
}
function borrower(b) {
  const t = b.tightest, used = b.chain.used || [];
  return `<a class="back" href="#">← Watchlist</a>
  <div class="eyebrow">CIK ${b.cik}${b.gold ? " · hand-labeled for evaluation" : ""}</div>
  <h1 style="margin-top:4px">${esc(b.name)}</h1>
  <p class="sub" style="margin:8px 0 0">${esc(b.facility || "")}</p>
  ${b.stale ? `<p class="note">This agreement marks deleted terms with strikethrough. The reading shown was made before the pipeline
    started removing deleted text; quotes are re-checked against the corrected text, and a fresh read is queued.</p>` : ""}
  <div class="facts">${t ? `<span>Tightest: <b>${esc(t.name)}</b> at <b class="num">${x2(t.value)}</b> vs <b class="num">${x2(t.limit)}</b> (${BASIS_LONG[t.basis]}, ${t.period_end})</span>
    <span>${chip(t.headroom)}</span><span>${g("cushion")} <b class="num">${pct(t.cushion)}</b></span>` :
    `<span>${b.cov_lite ? "No financial maintenance test: this loan is covenant-lite." : "No covenant could be computed from public data."}</span>`}</div>
  <section><h2>The contract</h2>
    <p class="small">${b.chain.source === "automatic" ? "Found automatically from EDGAR exhibits" : "Hand-picked documents"}; ${g("amendment", "amendments")} in order, the latest controls.</p>
    <ol class="small" style="margin:8px 0 0;padding-left:20px">${used.map(d => `<li><a href="${esc(d.url)}" rel="noopener" target="_blank">${esc(d.title)}</a>${d.dated ? `, dated ${d.dated}` : ""}</li>`).join("")}</ol>
    ${(b.chain.notes || []).map(n => `<p class="note">${esc(n)}</p>`).join("")}
  </section>
  <section><h2>Covenants</h2>${b.covenants.length ? b.covenants.map(c => `
    <div class="card cov">
      <div class="cov-head"><h3>${esc(c.name)}</h3><span class="lim">${c.direction === "max" ? "at most" : "at least"} ${thresholds(c)}</span></div>
      ${c.latest ? ruler(c.latest.value, c.latest.limit, c.direction, true) : ""}
      <div class="facts">${c.latest ? `<span>Latest <b class="num">${x2(c.latest.value)}</b> (${BASIS_LONG[c.latest.basis]})</span><span>${chip(c.latest.headroom)}</span>
        <span>${g("cushion")} <b class="num">${pct(c.latest.cushion)}</b></span>` : ""}
        <span>Tested ${c.test_frequency === "springing" ? g("springing", "only when triggered") : esc(c.test_frequency)}</span>
        ${c.cash_netting_cap ? `<span>Netted cash capped at <b class="num">${money(c.cash_netting_cap)}</b></span>` : ""}
        ${c.cash_netting_cap_pct_ebitda ? `<span>Netted cash capped at <b class="num">${pct(c.cash_netting_cap_pct_ebitda)}</b> of EBITDA</span>` : ""}</div>
      ${c.springing_condition ? `<p class="note">${esc(c.springing_condition)}</p>` : ""}
      ${(c.steps || []).map(s => `<p class="note">Steps to ${x2(s.limit)} from ${s.from}. At today's ratio that leaves ${pct(s.headroom_at_today, true)} headroom.</p>`).join("")}
      <div class="clause"><span class="sec">${esc(c.section)}</span><span><q>${esc(c.quote)}</q>
        <span class="${c.quote_verified ? "ok" : "bad"}"> ${c.quote_verified ? "✓ found in filing" : "✗ not found, check by hand"}</span></span></div>
      ${chart(c)}
    </div>`).join("") : `<p class="small">No financial maintenance covenants in this agreement.</p>`}
  </section>
  ${b.terms.length ? `<section><h2>Lender protections</h2>
    <p class="small">Terms lenders now check after liability management deals moved collateral or priority away from them. Red means the agreement lacks the protection.</p>
    <div class="termgrid">${b.terms.map(tm => { const prot = PROTECTIVE.includes(tm.kind);
      const cls = tm.present === "partial" ? "partial" : (tm.present === "yes") === prot ? "shut" : "open";
      const word = tm.kind === "equity_cure" ? (tm.present === "no" ? "None" : "Allowed") : {yes: "In the agreement", no: "Missing", partial: "Partial"}[tm.present];
      return `<div class="card term"><h3>${TERM[tm.kind][0]}<span class="state ${tm.kind === "equity_cure" ? "" : cls}">${word}</span></h3>
        <p>${esc(tm.summary)}</p>${tm.quote ? `<blockquote>${tm.section ? `<span class="mono small">${esc(tm.section)}</span> ` : ""}“${esc(tm.quote)}”
        <span class="${tm.quote_verified ? "ok" : "bad"}">${tm.quote_verified ? "✓ found" : "✗ not found"}</span></blockquote>` : ""}</div>`; }).join("")}</div></section>` : ""}
  ${b.accuracy.length ? `<section><h2>Against the company's own numbers</h2><div class="tablebox"><table><thead><tr><th>Quarter</th><th>Ratio</th>
    <th class="n">Reported</th><th class="n">Reported limit</th><th class="n">Limit read from contract</th><th class="n">Est. adj. EBITDA</th><th class="n">Est. GAAP</th><th>Source</th></tr></thead><tbody>
    ${b.accuracy.map(a => `<tr><td>${a.period_end}</td><td>${esc(a.metric.replace(/_/g, " "))}</td><td class="n">${x2(a.reported)}</td><td class="n">${x2(a.reported_limit)}</td>
      <td class="n">${x2(a.our_limit)} ${a.limit_match === true ? '<span class="ok">✓</span>' : a.limit_match === false ? '<span class="bad">✗</span>' : ""}</td>
      <td class="n">${x2(a.adjusted)} <span class="small">${pct(a.adjusted_error, true)}</span></td><td class="n">${x2(a.xbrl)} <span class="small">${pct(a.xbrl_error, true)}</span></td>
      <td><a href="${esc(a.url)}" target="_blank" rel="noopener">filing</a></td></tr>`).join("")}</tbody></table></div></section>` : ""}
  ${(b.qa || []).length ? `<section><h2>Questions answered from the contract</h2>
    <p class="small">Claude answers from the agreement with citations turned on; each numbered citation is the exact passage, checked against the filing.</p>
    ${b.qa.map(q => `<div class="card cov"><h3>${esc(q.question)}</h3><p class="sub" style="margin-top:8px;white-space:pre-line">${esc(q.answer)}</p>
      <details style="margin-top:8px"><summary class="small">${q.citations.length} citations</summary>
      ${q.citations.map(c => `<div class="clause"><span class="sec">[${c.n}]</span><span><q>${esc(c.text.length > 400 ? c.text.slice(0, 400) + "…" : c.text)}</q>
        <span class="${c.found ? "ok" : "bad"}"> ${c.found ? "✓ found" : "✗ not found"}</span></span></div>`).join("")}</details></div>`).join("")}</section>` : ""}
  ${b.compliance && b.compliance.sentences && b.compliance.sentences.length ? `<section><h2>What the company says</h2>
    <p class="small">From its ${esc(b.compliance.form)} filed ${esc(b.compliance.filed)} (<a href="${esc(b.compliance.url)}" target="_blank" rel="noopener">filing</a>)</p>
    ${b.compliance.sentences.map(s => `<p class="note">${esc(s)}</p>`).join("")}</section>` : ""}
  ${b.notes ? `<section><h2>Notes from the agreement</h2><p class="sub">${esc(b.notes)}</p></section>` : ""}`;
}

// ------------------------------------------------------------------ routing
function render() {
  const h = location.hash.slice(1), app = $("#app");
  const b = h.startsWith("b-") && D.borrowers.find(x => x.cik === h.slice(2));
  app.innerHTML = b ? borrower(b) : watchlist();
  document.title = b ? b.name + " · Covenant Lens" : "Covenant Lens";
  if (!b && (h === "accuracy" || h === "method")) document.getElementById(h)?.scrollIntoView();
  else window.scrollTo(0, 0);
  wire();
}
function wire() {
  document.querySelectorAll("tr.row").forEach(tr => {
    const go = () => { location.hash = "b-" + tr.dataset.cik; };
    tr.addEventListener("click", go); tr.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  });
  document.querySelectorAll("th button[data-sort]").forEach(btn => btn.addEventListener("click", () => {
    const k = btn.dataset.sort; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; rerenderList(); }));
  const q = $("#q"); if (q) q.addEventListener("input", () => { filt.q = q.value.toLowerCase(); rerenderList(true); });
  const bs = $("#basis"); if (bs) bs.addEventListener("change", () => { filt.basis = bs.value; rerenderList(); });
  const cl = $("#covlite"); if (cl) cl.addEventListener("change", () => { filt.covlite = cl.checked; rerenderList(); });
  document.querySelectorAll("button[data-table]").forEach(btn => btn.addEventListener("click", () => {
    const t = document.getElementById(btn.dataset.table + "-t"); t.hidden = !t.hidden; btn.textContent = t.hidden ? "Show the numbers" : "Hide the numbers"; }));
}
function rerenderList(keepFocus) {
  const y = window.scrollY; $("#app").innerHTML = watchlist(); wire(); window.scrollTo(0, y);
  if (keepFocus) { const q = $("#q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
// glossary popover: hover or focus on desktop, tap on phones; Escape, scrolling or tapping elsewhere closes it
const pop = document.getElementById("glpop");
let popFor = null;
function showGl(btn) {
  const [t, d] = GLOSSARY[btn.dataset.g];
  pop.innerHTML = `<b>${t}</b>${d}`;
  pop.hidden = false;
  const r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let top = r.bottom + 8;
  if (top + ph > window.innerHeight - 8) top = r.top - ph - 8;
  pop.style.left = Math.min(Math.max(16, r.left), window.innerWidth - pw - 16) + "px";
  pop.style.top = Math.max(8, top) + "px";
  popFor = btn;
}
function hideGl() { pop.hidden = true; popFor = null; }
document.addEventListener("mouseover", e => { const b = e.target.closest(".gl"); if (b) showGl(b); });
document.addEventListener("mouseout", e => { const b = e.target.closest(".gl"); if (b && b === popFor) hideGl(); });
document.addEventListener("focusin", e => { const b = e.target.closest(".gl"); if (b) showGl(b); });
document.addEventListener("focusout", e => { if (e.target.closest(".gl")) hideGl(); });
document.addEventListener("click", e => { const b = e.target.closest(".gl"); if (b) { e.stopPropagation(); showGl(b); } else hideGl(); }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") hideGl(); });
window.addEventListener("scroll", () => { if (!pop.hidden) hideGl(); }, {passive: true});

$("#updated").textContent = "Updated " + D.summary.generated;
if (D.repo) $("#repo").href = D.repo;
window.addEventListener("hashchange", render);
render();
</script>
