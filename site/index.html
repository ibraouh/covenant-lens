64078558715,"adjusted_error":0.08683386171497598,"url":"https://www.sec.gov/Archives/edgar/data/911177/000091117726000059/cwst-20260930.htm"},{"metric":"interest_coverage","period_end":"2026-09-30","reported":7.63,"reported_limit":3.0,"our_limit":3.0,"limit_match":true,"xbrl":5.928467651070391,"adjusted":6.831524639743818,"xbrl_error":-0.2230055503184285,"adjusted_error":-0.10464945743855592,"url":"https://www.sec.gov/Archives/edgar/data/911177/000091117726000059/cwst-20260930.htm"}],"notes":"Elevated TNL Ratio Period: after a Permitted Acquisition, or series of them, with consideration over $25M, the Borrowers may raise the total net leverage maximum from 4.00x to 4.50x. The higher level applies for the acquisition quarter and the next three quarters. Only one such period may run at a time, and at least one quarter at 4.00x must separate two periods. The 4.00x level is quoted as written ('4:00 to 1.00'). Financial covenants are calculated excluding the assets, liabilities and operations of Excluded Subsidiaries, except liabilities of Excluded Subsidiaries that are recourse to the Borrowers. Excluded Interim Debt (refinanced debt whose proceeds are held in a pledged blocked account) is excluded from Consolidated Funded Debt for covenant purposes. Netted cash is unencumbered cash and Cash Equivalents of the Parent and its Domestic Subsidiaries, capped at $100M. EBITDA add-backs: non-cash asset sale losses and impairment, abandonment or closure charges are capped at $50M cumulative from closing. Cash and non-cash severance and reorganization charges are capped at $10M cumulative. Other add-backs include acquisition expenses and integration costs, financing and disposition fees, derivative charges, PIK dividend charges, IRB write-offs, and other non-cash items acceptable to the Agent. Pro forma acquired-business EBITDA may include expected synergies up to 15% of Consolidated EBITDA, or another amount agreed with the Agent. Non-recurring private-company expenses may be added back, but not for the interest coverage test. Limited Condition Acquisition provisions do not apply pro forma treatment to Section 7.11 compliance until the acquisition closes. Financial covenant amendments require only Required Lenders. Incremental facilities may carry different or no financial covenants, but only if no more restrictive. Section 7.03(j) debt cannot carry a financial maintenance covenant unless it is also added for the Revolving Credit Lenders. Pricing grid is based on Consolidated Total Net Leverage Ratio, with sustainability-linked (KPI) margin adjustments through FY2026. The facility is secured. Each subsidiary is a co-Borrower jointly and severally liable rather than a guarantor.","compliance":{"form":"10-Q","filed":"2026-11-09","url":"https://www.sec.gov/Archives/edgar/data/911177/000091117726000059/cwst-20260930.htm","sentences":["As of September 30, 2026, we were in compliance with the covenants contained in the Credit Agreement.","As of September 30, 2026, we were in compliance with all financial covenants contained in the Credit Agreement as follows (in millions): Credit Facility Covenant Twelve Months Ended September 30, 2026 Covenant Requirements at September 30, 2026 Maximum consolidated net leverage ratio (1) 2."]},"qa":[{"question":"How much additional debt could the borrower take on today, and under which baskets or ratio tests? Name the sections.","answer":"**Short answer:** The capacity can't be stated as a single dollar figure. The ratio baskets depend on current Consolidated EBITDA, funded debt, cash (netting is capped at $100M), and how much of each fixed basket is already used, and none of these appear in the agreement. Only the 2024 A&R agreement was provided, with no amendments.\n\n**Ratio-based (likely the largest capacity):**\n- **\u00a72.14 Incrementals:** Up to the greater of (A) $200,000,000 plus (B) the aggregate amount of all voluntary prepayments of Term Loans [1] and revolver reductions, and any additional amount that keeps pro forma Consolidated Total Net Leverage Ratio ... not greater than 4.00 to 1.00 [2].\n- **\u00a77.03(j):** Unsecured or junior-secured debt.\n  - **Junior-secured:** Pro forma TNLR may not exceed 4.00x.\n  - **Unsecured:** Pro forma TNLR may not exceed the maximum permitted Consolidated Total Net Leverage Ratio under Section 7.11(b) [3]. That is 4.00x, or 4.50 to 1.00 [4] during an Elevated TNL Ratio Period following acquisitions over $25M.\n- **\u00a77.03(b) subordinated debt and \u00a77.03(m) IRBs:** Both require pro forma compliance with the \u00a77.11 covenants.\n\n**Fixed-dollar baskets (capacity is net of current usage):**\n- **\u00a77.03(e) equipment/purchase money:** shall not exceed $250,000,000 at any time [5].\n- **\u00a77.03(k) surety:** shall not exceed $600,000,000 at any time outstanding [6].\n- **\u00a77.03(h) acquisition unsecured debt:** $25,000,000 [7], less any outstanding subordinated debt.\n- **\u00a77.03(o) guarantees of Excluded/Foreign Subsidiaries:** $50,000,000 [8], reduced by \u00a77.02(i) investments.\n- **\u00a77.03(q) general:** $50,000,000 at any time outstanding [9].\n\n**Note:** Any liens securing the \u00a77.03(q) general basket must fit within \u00a77.01(k), which allows $25,000,000 [10].","citations":[{"n":1,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"Maximum Increase Amount\n\u201d means an amount not to exceed the greater of (i) the sum of (A) $200,000,000 plus (B) the\naggregate amount of all voluntary prepayments of Term Loans under the Term Facility and voluntary permanent reductions of commitments under the Revolving Credit Facility (including any voluntary prepayments of Term Loans under the Term Facility and\nvoluntary permanent reductions of commitments under the Revolving Credit Facility being made contemporaneously with Loans advanced under Incremental Commitments funded pursuant to\nSection\n2.14\nunder clause (i) of this\ndefinition or with Loans advanced under Incremental Commitments funded pursuant to\nSection\n2.14\nunder clause (ii) of this definition) and (ii) any additional amount so that, after giving pro forma effect to such\nproposed Incremental Facility (measured assuming any Incremental Revolving Commitment is fully drawn), any repayment of indebtedness in connection therewith and any other acquisition, disposition, debt incurrence, debt retirement and all appropriate\npro forma adjustment events (including events occurring subsequent to the end of the applicable test period and on or prior to the date of such incurrence), (x) prior to the Secured Leverage Covenant Election, the Consolidated Total Net Leverage\nRatio as of the last day of the most recently ended period of four consecutive fiscal quarters for which financial statements have been delivered hereunder is not greater than 4.00 to 1.00 or (y) on and after a Secured Leverage Covenant\nElection, the Consolidated Secured Net Leverage Ratio as of the last day of the most recently ended four consecutive fiscal quarter period for which financial statements have been delivered hereunder is not greater than 3.50 to 1.00.\n\u201c\n","found":true},{"n":2,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"Maximum Increase Amount\n\u201d means an amount not to exceed the greater of (i) the sum of (A) $200,000,000 plus (B) the\naggregate amount of all voluntary prepayments of Term Loans under the Term Facility and voluntary permanent reductions of commitments under the Revolving Credit Facility (including any voluntary prepayments of Term Loans under the Term Facility and\nvoluntary permanent reductions of commitments under the Revolving Credit Facility being made contemporaneously with Loans advanced under Incremental Commitments funded pursuant to\nSection\n2.14\nunder clause (i) of this\ndefinition or with Loans advanced under Incremental Commitments funded pursuant to\nSection\n2.14\nunder clause (ii) of this definition) and (ii) any additional amount so that, after giving pro forma effect to such\nproposed Incremental Facility (measured assuming any Incremental Revolving Commitment is fully drawn), any repayment of indebtedness in connection therewith and any other acquisition, disposition, debt incurrence, debt retirement and all appropriate\npro forma adjustment events (including events occurring subsequent to the end of the applicable test period and on or prior to the date of such incurrence), (x) prior to the Secured Leverage Covenant Election, the Consolidated Total Net Leverage\nRatio as of the last day of the most recently ended period of four consecutive fiscal quarters for which financial statements have been delivered hereunder is not greater than 4.00 to 1.00 or (y) on and after a Secured Leverage Covenant\nElection, the Consolidated Secured Net Leverage Ratio as of the last day of the most recently ended four consecutive fiscal quarter period for which financial statements have been delivered hereunder is not greater than 3.50 to 1.00.\n\u201c\n","found":true},{"n":3,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"None of the Borrowers or the\nNon-Borrower\nSubsidiaries shall,\ndirectly or indirectly, become in any way obligated under a guarantee or become or be a surety of, or otherwise create, incur, assume, or be or remain liable, contingently or otherwise, with respect to any Indebtedness, or become or be responsible\nin any manner (whether by agreement to purchase any obligations, stock, assets, goods or services, or to supply or advance any funds, assets, goods or services or otherwise) with respect to any Indebtedness of any other Person, or incur any\nIndebtedness other than:\n(a) Indebtedness of the Borrowers to the Lenders, the L/C Issuers and the Administrative Agent arising under this\nAgreement and the Loan Documents;\n(b) Permitted Subordinated Debt so long as at the time such Indebtedness is incurred (i) no\nDefault or Event of Default has occurred and is continuing or would result therefrom, (ii) the Borrowers are in pro forma compliance with the financial covenants contained in\nSections 7.11(a)\nand\n(b)\nafter giving effect to\nthe incurrence of such Indebtedness and any applicable Elevated TNL Ratio Period and (iii) after the Secured Leverage Covenant Election, the Consolidated Total Net Leverage Ratio as of the last day of the most recently ended period of four\nconsecutive fiscal quarters for which financial statements have been delivered hereunder, on a pro forma basis after giving effect to the incurrence of such Indebtedness, is not greater than 5.00 to 1.00;\n103\n(c) existing Indebtedness of the Borrowers with respect to Indebtedness, loans and\nCapitalized Leases listed on\nSchedule 7.03\n, on the terms and conditions in effect as of the Closing Date, together with any renewals, extensions or refinancing thereof that do not increase the principal amount of such Indebtedness in excess\nof the amount of reasonable premiums, fees, expenses and other customary amounts;\n(d) endorsements for collection, deposit or negotiation\nand warranties of products or services (including unsecured performance, payment, license, permit and similar bonds (\u201c\nPerformance Bonds\n\u201d), in each case incurred in the ordinary course of business and for performance of obligations,\nnot for payment of Indebtedness; provided, that Performance Bonds are only permitted under this\nclause (d)\nto the extent that, and only for so long as, they are and continue to secure obligations of a Borrower or a Joinder Subsidiary);\n(e) Indebtedness, if any, incurred in connection with (i) the acquisition or lease of any equipment by the Borrowers under any\nSynthetic Lease Obligation, Capitalized Lease or other lease arrangement or purchase money financing (\u201c\nEquipment Financing Indebtedness\n\u201d) or (ii) any\nnon-equipment\nrelated lease\narrangement or purchase money financing;\nprovided\nthat the aggregate outstanding principal amount of such Indebtedness in the foregoing clauses (i) and (ii) (together with Indebtedness outstanding under\nSection\n7.03(c)\nand listed on Part B of\nSchedule 7.03\nand renewals, extensions and refinancings thereof) shall not exceed $250,000,000 at any time;\n(f) Indebtedness of the Borrowers under price swaps, price caps, and price collar or floor agreements for materials or products marketed by a\nBorrower, including fuel, aluminum, fiber, plastic, steel, electricity and methane gas, and similar agreements or arrangements designed to protect the Borrowers against, or manage price fluctuations with respect to, such commodities purchased in the\nordinary course of business of the Borrowers (\u201c\nCommodity Derivatives Obligations\n\u201d); provided that the maturity of such agreements do not exceed\nthirty-six\n(36) months and the terms\nthereof are consistent with past practices of the Borrowers and such Commodity Derivative Obligations and are not for speculative purposes; and, provided, further, that such Commodity Derivatives Obligations are only permitted under this\nclause\n(f)\nto the extent that, and only for so long as, such Commodity Derivatives Obligations are held by a Borrower for its own benefit or for the benefit of another Borrower;\n(g) (i) Indebtedness of the Borrowers in respect of\nnon-speculative\nSwap Contracts on terms\nconsistent with past practices of the Borrowers (other than those described in\nsubsection (f)\nabove); provided, that such Swap Contracts are only permitted under this\nclause (g)\nto the extent that, and only for so long\nas, such Swap Contracts are held by a Borrower for its own benefit or for the benefit of another Borrower; and (ii) Indebtedness under Cash Management Agreements;\n(h) other unsecured Indebtedness incurred in connection with the acquisition by the Borrowers of real or personal property, including any\nIndebtedness incurred with respect to\nnon-compete\npayments in connection with such acquisition(s) and refinancing debt with respect thereto, provided that the aggregate outstanding principal amount of such\nIndebtedness of the Borrowers shall not exceed $25,000,000 at any time (less the aggregate principal amount of any outstanding Indebtedness permitted under\nSection\n7.03(b)\n);\n(i) subject in all cases to\nSections 7.02(i)\n,\n(j)\nand\n(k)\n, intercompany indebtedness among the Borrowers and the\nNon-Borrower\nSubsidiaries;\n(j) Indebtedness of any one or more of the Borrowers so long as\n(i) such Indebtedness is either (x) unsecured\nor (y) secured on a junior basis to the Obligations, (ii) subject to\nSection\n1.08\nwith respect to any incurrence of Indebtedness the proceeds of which\nare to be used, in whole or in part, to fund a Limited Condition Acquisition, immediately after giving effect thereto and to the use of the proceeds thereof, no Event of Default shall exist or result therefrom giving pro forma effect to the\nincurrence of such Indebtedness as of the last day of the fiscal quarter most recently ended on or prior to the date of determination, (iii) the terms of such Indebtedness do not provide for any scheduled repayment, mandatory repayment, or\nredemption or sinking fund obligations prior to, at the time of incurrence, the Latest Maturity\n104\nDate (other than, in each case, customary offers or obligations to repurchase upon a change of control, asset sale, or casualty or condemnation event, and customary acceleration rights after an\nevent of default) (\nprovided\nthat, at the option of the Parent, this clause (iii) shall not apply with respect to unsecured Indebtedness pursuant to customary bridge facilities of the Parent or any Subsidiary not to exceed $500,000,000 in\naggregate principal amount outstanding at any time, which Indebtedness may have a maturity date and may be prepaid, redeemed or discharged on a date that is prior to the Latest Maturity Date;\nprovided\n,\nfurther\n, that such Indebtedness\nso excluded from this clause (iii) may not have any scheduled amortization or mandatory prepayments prior to maturity other than (x) customary mandatory prepayments as a result of equity issuances or other unsecured or junior debt\nsubsequently incurred under this clause (j), and (y) customary acceleration rights after an event of default), (iv) the interest rate with respect to such Indebtedness shall not exceed the then applicable market terms for the type of\nIndebtedness issued, (v) the covenants applicable thereto shall not include any financial maintenance covenant unless such covenant is also added to this Agreement for the benefit of the Revolving Credit Lenders, (vi) if secured,\n(x) such Indebtedness is only secured by Collateral, (y) the Liens are subject to a customary \u201c\njunior lien\n\u201d intercreditor agreement among the Administrative Agent and one or more representatives for the holders of\napplicable Indebtedness that is secured (and permitted hereunder to be secured) on a junior basis to the Obligations in form and substance reasonably satisfactory to the Borrowers and the Administrative Agent and (z) the aggregate principal\namount of such secured Indebtedness shall not exceed the aggregate principal amount such that, after giving pro forma effect to such proposed secured Indebtedness (measured assuming any revolving Indebtedness is fully drawn), any repayment of other\nindebtedness in connection therewith and any other acquisition, disposition, debt incurrence, debt retirement and all appropriate pro forma adjustment events (including events occurring subsequent to the end of the applicable test period and on or\nprior to the date of such incurrence), (1) prior to the Secured Leverage Covenant Election, the Consolidated Total Net Leverage Ratio as of the last day of the most recently ended period of four consecutive fiscal quarters for which financial\nstatements have been delivered hereunder is not greater than 4.00 to 1.00 or (2) on and after a Secured Leverage Covenant Election, the Consolidated Secured Net Leverage Ratio as of the last day of the most recently ended four consecutive\nfiscal quarter period for which financial statements have been delivered hereunder is not greater than 3.50 to 1.00, and (vii) if unsecured, the aggregate principal amount of such unsecured Indebtedness shall not exceed the aggregate principal\namount such that, after giving pro forma effect to such proposed unsecured Indebtedness (measured assuming any revolving Indebtedness is fully drawn), any repayment of other indebtedness in connection therewith and any other acquisition,\ndisposition, debt incurrence, debt retirement and all appropriate pro forma adjustment events (including events occurring subsequent to the end of the applicable test period and on or prior to the date of such incurrence), the Consolidated Total Net\nLeverage Ratio as of the last day of the most recently ended period of four consecutive fiscal quarters for which financial statements have been delivered hereunder is not greater than (1) prior to the Secured Leverage Covenant Election, the\nmaximum permitted Consolidated Total Net Leverage Ratio under\nSection\n7.11(b)\nat such time or (2) on and after a Secured Leverage Covenant Election, 5.00 to 1.00;\n(k) surety and similar bonds and completion bonds and bid guarantees with respect to the closure, final-closure and post-closure liabilities,\nand other solid waste liabilities, provided by or issued on behalf of the Borrowers in connection with landfills or other solid waste operations (collectively, \u201c\nSurety Arrangements\n\u201d); provided that Surety Arrangements are only\npermitted under this\nclause (k)\nto the extent that, and only for so long as, they are and continue to secure an obligation or liability of a Borrower and relate to a landfill or other solid waste operation currently or previously owned\nor operated by a Borrower or a Joinder Subsidiary during the pendency of its execution and delivery of a Joinder Agreement in accordance with\nSection\n6.20\n); and\nprovided\n,\nfurther\n, that the aggregate\nIndebtedness under all Surety Arrangements permitted under this\nclause (k)\nshall not exceed $600,000,000 at any time outstanding;\n105\n(l) obligations under indemnity provisions or related to purchase price adjustments or\nsimilar obligations to the purchaser or seller under the purchase agreement incurred in connection with the purchase or Disposition of assets or Equity Interests of any Borrower, in each case solely to the extent that (x) such obligations are\nincurred in connection with a Permitted Acquisition or acquisition permitted hereunder or the Disposition of Equity Interests or assets of the Borrowers otherwise permitted under this Agreement, (y) such obligations run in favor of the\ncounterparties of such Permitted Acquisition, acquisition or Disposition, and (z) the maximum aggregate liability in respect of all such obligations shall at no time exceed the gross proceeds, including\nnon-cash\nproceeds, (the fair market value of such\nnon-cash\nproceeds being measured at the time received or paid and without giving effect to any subsequent changes in\nvalue) actually received or paid by the Borrowers in connection with the related Permitted Acquisition, acquisition or Disposition;\n(m)\nIndebtedness with respect to IRBs so long as, at the time such Indebtedness is incurred, (i) no Default or Event of Default has occurred and is continuing or would result therefrom, (ii) the Borrowers are in pro forma compliance with the\nfinancial covenants contained in\nSection\n7.11\nafter giving effect to the incurrence of such Indebtedness and, if applicable, any applicable Elevated TNL Ratio Period, and (iii) if the date of any such initial\nincurrence is after the Secured Leverage Covenant Election, then as of the last day of the most recently ended period of four consecutive fiscal quarters for which financial statements have been delivered hereunder, on a pro forma basis after giving\neffect to the incurrence of such Indebtedness, the Consolidated Total Net Leverage Ratio is not greater than 5.00 to 1.00, together with any refinancing thereof that does not increase the principal amount of such Indebtedness in excess of the amount\nof reasonable premiums, fees, expenses and other customary amounts;\n(n) guarantees of or similar arrangements with respect to\nIndebtedness permitted pursuant to this\nSection\n7.03(a)\nthrough\n(m)\nmade by any of the Borrowers for so long as the underlying obligor remains a Borrower hereunder;\nprovided\n, that the amount of such\nguarantees does not exceed the amount of the underlying Indebtedness and that any guarantees of Permitted Subordinated Debt are equally subordinated;\n(o) guarantees of or similar arrangements with respect to Indebtedness of the Excluded Subsidiaries and Foreign Subsidiaries in an amount not\nto exceed $50,000,000 in the aggregate outstanding at any time (less, but without duplication, the aggregate amount of all outstanding Investments in Excluded Subsidiaries and Foreign Subsidiaries in accordance with\nSection\n7.02(i))\n;\n(p) Equity Related Purchase Obligations of the Parent in respect of Qualified Preferred Stock\nor Grandfathered\nNon-Qualified\nPreferred Stock; and\n(q) other Indebtedness in an aggregate\nprincipal amount not to exceed $50,000,000 at any time outstanding.\n","found":true},{"n":4,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"As at the end of any fiscal quarter prior to the Secured Leverage Covenant Election,\nthe Borrowers shall not permit the Consolidated Total Net Leverage Ratio fo he Loan Documents;\n(b) Permitted Subordinated Debt so long as at the time such Indebtedness is incurred (i) no\nDefault or Event of Default has occurred and is continuing or would result therefrom, (ii) the Borrowers are in pro forma compliance with the financial covenants contained in\nSections 7.11(a)\nand\n(b)\nafter giving effect to\nthe incurrence of such Indebtedness and any applicable Elevated TNL Ratio Period and (iii) after the Secured Leverage Covenant Election, the Consolidated Total Net Leverage Ratio as of the last day of the most recently ended period of four\nconsecutive fiscal quarters for which financial statements have been delivered hereunder, on a pro forma basis after giving effect to the incurrence of such Indebtedness, is not greater than 5.00 to 1.00;\n103\n(c) existing Indebtedness of the Borrowers with respect to Indebtedness, loans and\nCapitalized Leases listed on\nSchedule 7.03\n, on the terms and conditions in effect as of the Closing Date, together with any renewals, extensions or refinancing thereof that do not increase the principal amount of such Indebtedness in excess\nof the amount of reasonable premiums, fees, expenses and other customary amounts;\n(d) endorsements for collection, deposit or negotiation\nand warranties of products or services (including unsecured performance, payment, license, permit and similar bonds (\u201c\nPerformance Bonds\n\u201d), in each case incurred in the ordinary course of business and for performance of obligations,\nnot for payment of Indebtedness; provided, that Performance Bonds are only permitted under this\nclause (d)\nto the extent that, and only for so long as, they are and continue to secure obligations of a Borrower or a Joinder Subsidiary);\n(e) Indebtedness, if any, incurred in connection with (i) the acquisition or lease of any equipment by the Borrowers under any\nSynthetic Lease Obligation, Capitalized Lease or other lease arrangement or purchase money financing (\u201c\nEquipment Financing Indebtedness\n\u201d) or (ii) any\nnon-equipment\nrelated lease\narrangement or purchase money financing;\nprovided\nthat the aggregate outstanding principal amount of such Indebtedness in the foregoing clauses (i) and (ii) (together with Indebtedness outstanding under\nSection\n7.03(c)\nand listed on Part B of\nSchedule 7.03\nand renewals, extensions and refinancings thereof) shall not exceed $250,000,000 at any time;\n(f) Indebtedness of the Borrowers under price swaps, price caps, and price collar or floor agreements for materials or products marketed by a\nBorrower, including fuel, aluminum, fiber, plastic, steel, electricity and methane gas, and similar agreements or arrangements designed to protect the Borrowers against, or manage price fluctuations with respect to, such commodities purchased in the\nordinary course of business of the Borrowers (\u201c\nCommodity Derivatives Obligations\n\u201d); provided that the maturity of such agreements do not exceed\nthirty-six\n(36) months and the terms\nthereof are consistent with past practices of the Borrowers and such Commodity Derivative Obligations and are not for speculative purposes; and, provided, further, that such Commodity Derivatives Obligations are only permitted under this\nclause\n(f)\nto the extent that, and only for so long as, such Commodity Derivatives Obligations are held by a Borrower for its own benefit or for the benefit of another Borrower;\n(g) (i) Indebtedness of the Borrowers in respect of\nnon-speculative\nSwap Contracts on terms\nconsistent with past practices of the Borrowers (other than those described in\nsubsection (f)\nabove); provided, that such Swap Contracts are only permitted under this\nclause (g)\nto the extent that, and only for so long\nas, such Swap Contracts are held by a Borrower for its own benefit or for the benefit of another Borrower; and (ii) Indebtedness under Cash Management Agreements;\n(h) other unsecured Indebtedness incurred in connection with the acquisition by the Borrowers of real or personal property, including any\nIndebtedness incurred with respect to\nnon-compete\npayments in connection with such acquisition(s) and refinancing debt with respect thereto, provided that the aggregate outstanding principal amount of such\nIndebtedness of the Borrowers shall not exceed $25,000,000 at any time (less the aggregate principal amount of any outstanding Indebtedness permitted under\nSection\n7.03(b)\n);\n(i) subject in all cases to\nSections 7.02(i)\n,\n(j)\nand\n(k)\n, intercompany indebtedness among the Borrowers and the\nNon-Borrower\nSubsidiaries;\n(j) Indebtedness of any one or more of the Borrowers so long as\n(i) such Indebtedness is either (x) unsecured\nor (y) secured on a junior basis to the Obligations, (ii) subject to\nSection\n1.08\nwith respect to any incurrence of Indebtedness the proceeds of which\nare to be used, in whole or in part, to fund a Limited Condition Acquisition, immediately after giving effect thereto and to the use of the proceeds thereof, no Event of Default shall exist or result therefrom giving pro forma effect to the\nincurrence of such Indebtedness as of the last day of the fiscal quarter most recently ended on or prior to the date of determination, (iii) the terms of such Indebtedness do not provide for any scheduled repayment, mandatory repayment, or\nredemption or sinking fund obligations prior to, at the time of incurrence, the Latest Maturity\n104\nDate (other than, in each case, customary offers or obligations to repurchase upon a change of control, asset sale, or casualty or condemnation event, and customary acceleration rights after an\nevent of default) (\nprovided\nthat, at the option of the Parent, this clause (iii) shall not apply with respect to unsecured Indebtedness pursuant to customary bridge facilities of the Parent or any Subsidiary not to exceed $500,000,000 in\naggregate principal amount outstanding at any time, which Indebtedness may have a maturity date and may be prepaid, redeemed or discharged on a date that is prior to the Latest Maturity Date;\nprovided\n,\nfurther\n, that such Indebtedness\nso excluded from this clause (iii) may not have any scheduled amortization or mandatory prepayments prior to maturity other than (x) customary mandatory prepayments as a result of equity issuances or other unsecured or junior debt\nsubsequently incurred under this clause (j), and (y) customary acceleration rights after an event of default), (iv) the interest rate with respect to such Indebtedness shall not exceed the then applicable market terms for the type of\nIndebtedness issued, (v) the covenants applicable thereto shall not include any financial maintenance covenant unless such covenant is also added to this Agreement for the benefit of the Revolving Credit Lenders, (vi) if secured,\n(x) such Indebtedness is only secured by Collateral, (y) the Liens are subject to a customary \u201c\njunior lien\n\u201d intercreditor agreement among the Administrative Agent and one or more representatives for the holders of\napplicable Indebtedness that is secured (and permitted hereunder to be secured) on a junior basis to the Obligations in form and substance reasonably satisfactory to the Borrowers and the Administrative Agent and (z) the aggregate principal\namount of such secured Indebtedness shall not exceed the aggregate principal amount such that, after giving pro forma effect to such proposed secured Indebtedness (measured assuming any revolving Indebtedness is fully drawn), any repayment of other\nindebtedness in connection therewith and any other acquisition, disposition, debt incurrence, debt retirement and all appropriate pro forma adjustment events (including events occurring subsequent to the end of the applicable test period and on or\nprior to the date of such incurrence), (1) prior to the Secured Leverage Covenant Election, the Consolidated Total Net Leverage Ratio as of the last day of the most recently ended period of four consecutive fiscal quarters for which financial\nstatements have been delivered hereunder is not greater than 4.00 to 1.00 or (2) on and after a Secured Leverage Covenant Election, the Consolidated Secured Net Leverage Ratio as of the last day of the most recently ended four consecutive\nfiscal quarter period for which financial statements have been delivered hereunder is not greater than 3.50 to 1.00, and (vii) if unsecured, the aggregate principal amount of such unsecured Indebtedness shall not exceed the aggregate principal\namount such that, after giving pro forma effect to such proposed unsecured Indebtedness (measured assuming any revolving Indebtedness is fully drawn), any repayment of other indebtedness in connection therewith and any other acquisition,\ndisposition, debt incurrence, debt retirement and all appropriate pro forma adjustment events (including events occurring subsequent to the end of the applicable test period and on or prior to the date of such incurrence), the Consolidated Total Net\nLeverage Ratio as of the last day of the most recently ended period of four consecutive fiscal quarters for which financial statements have been delivered hereunder is not greater than (1) prior to the Secured Leverage Covenant Election, the\nmaximum permitted Consolidated Total Net Leverage Ratio under\nSection\n7.11(b)\nat such time or (2) on and after a Secured Leverage Covenant Election, 5.00 to 1.00;\n(k) surety and similar bonds and completion bonds and bid guarantees with respect to the closure, final-closure and post-closure liabilities,\nand other solid waste liabilities, provided by or issued on behalf of the Borrowers in connection with landfills or other solid waste operations (collectively, \u201c\nSurety Arrangements\n\u201d); provided that Surety Arrangements are only\npermitted under this\nclause (k)\nto the extent that, and only for so long as, they are and continue to secure an obligation or liability of a Borrower and relate to a landfill or other solid waste operation currently or previously owned\nor operated by a Borrower or a Joinder Subsidiary during the pendency of its execution and delivery of a Joinder Agreement in accordance with\nSection\n6.20\n); and\nprovided\n,\nfurther\n, that the aggregate\nIndebtedness under all Surety Arrangements permitted under this\nclause (k)\nshall not exceed $600,000,000 at any time outstanding;\n105\n(l) obligations under indemnity provisions or related to purchase price adjustments or\nsimilar obligations to the purchaser or seller under the purchase agreement incurred in connection with the purchase or Disposition of assets or Equity Interests of any Borrower, in each case solely to the extent that (x) such obligations are\nincurred in connection with a Permitted Acquisition or acquisition permitted hereunder or the Disposition of Equity Interests or assets of the Borrowers otherwise permitted under this Agreement, (y) such obligations run in favor of the\ncounterparties of such Permitted Acquisition, acquisition or Disposition, and (z) the maximum aggregate liability in respect of all such obligations shall at no time exceed the gross proceeds, including\nnon-cash\nproceeds, (the fair market value of such\nnon-cash\nproceeds being measured at the time received or paid and without giving effect to any subsequent changes in\nvalue) actually received or paid by the Borrowers in connection with the related Permitted Acquisition, acquisition or Disposition;\n(m)\nIndebtedness with respect to IRBs so long as, at the time such Indebtedness is incurred, (i) no Default or Event of Default has occurred and is continuing or would result therefrom, (ii) the Borrowers are in pro forma compliance with the\nfinancial covenants contained in\nSection\n7.11\nafter giving effect to the incurrence of such Indebtedness and, if applicable, any applicable Elevated TNL Ratio Period, and (iii) if the date of any such initial\nincurrence is after the Secured Leverage Covenant Election, then as of the last day of the most recently ended period of four consecutive fiscal quarters for which financial statements have been delivered hereunder, on a pro forma basis after giving\neffect to the incurrence of such Indebtedness, the Consolidated Total Net Leverage Ratio is not greater than 5.00 to 1.00, together with any refinancing thereof that does not increase the principal amount of such Indebtedness in excess of the amount\nof reasonable premiums, fees, expenses and other customary amounts;\n(n) guarantees of or similar arrangements with respect to\nIndebtedness permitted pursuant to this\nSection\n7.03(a)\nthrough\n(m)\nmade by any of the Borrowers for so long as the underlying obligor remains a Borrower hereunder;\nprovided\n, that the amount of such\nguarantees does not exceed the amount of the underlying Indebtedness and that any guarantees of Permitted Subordinated Debt are equally subordinated;\n(o) guarantees of or similar arrangements with respect to Indebtedness of the Excluded Subsidiaries and Foreign Subsidiaries in an amount not\nto exceed $50,000,000 in the aggregate outstanding at any time (less, but without duplication, the aggregate amount of all outstanding Investments in Excluded Subsidiaries and Foreign Subsidiaries in accordance with\nSection\n7.02(i))\n;\n(p) Equity Related Purchase Obligations of the Parent in respect of Qualified Preferred Stock\nor Grandfathered\nNon-Qualified\nPreferred Stock; and\n(q) other Indebtedness in an aggregate\nprincipal amount not to exceed $50,000,000 at any time outstanding.\n","found":true},{"n":10,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"as administrative agent and the lenders party thereto; (ii) to the extent approved by the Administrative Agent, Liens, encumbrances and other matters\ndescribed in title policies delivered hereunder, if applicable; and (iii) Liens and encumbrances consisting of easements, rights of way, zoning restrictions, restrictions on the use of Real Property and defects and irregularities in the title\nthereto, or other matters of record, landlord\u2019s or lessor\u2019s Liens under leases to which any Borrower or\nNon-Borrower\nSubsidiary is a party, and other minor Liens none of which in the opinion Parent\ninterferes materially with the use of the Real Property, taken as a whole, in the ordinary conduct of the business of the Borrowers, and which encumbrances and defects do not individually or in the aggregate have a material adverse effect on the\nbusiness of the Borrowers on a consolidated basis;\n(f) Liens existing as of the Closing Date securing Indebtedness incurred under\nSection\n7.03\nand listed on\nSchedule 7.01\nand any renewals or extensions thereof;\nprovided\nthat (i) the property covered thereby is not changed, (ii) the amount secured or benefited thereby is not\nincreased except as contemplated by\nSection\n7.03(c)\n, (iii) the direct or any contingent obligor with respect thereto is not changed other than in connection with a corporate consolidation, restructuring, liquidation or\nreorganization, and (iv) such Liens secure only Indebtedness permitted to exist under such Section or any renewal or extension of the obligations secured or benefited thereby is permitted by\nSection\n7.03(c)\n;\n(g) Liens granted pursuant to the Security Documents to secure the Obligations (including secured Obligations hereunder with respect to\nCommodity Derivatives Obligations with Lenders or their Affiliates);\n(h) Liens on the Equity Interests of the Excluded Subsidiaries;\n101\n(i) Liens securing secured Indebtedness incurred pursuant to\nSection\n7.03(j)\n,\nso long as (i) the required intercreditor agreement has been entered into in accordance with the terms of such Section and is in effect with respect to such Indebtedness, and (ii) such\nLiens secure only Indebtedness permitted to exist under such Section;\n(j) (i) The filing of Uniform Commercial Code financing\nstatements solely as a precautionary measure (and not to evidence Liens) in connection with operating leases and (ii) Liens on Excluded Trust Accounts (as defined in the Security Agreement); and\n(k) Other Liens securing Indebtedness and other obligations in an aggregate amount not to exceed $25,000,000 at any time outstanding.\n","found":true}]},{"question":"If the borrower missed its financial covenant next quarter, what happens? Is there an equity cure or a grace period, and what can the lenders do?","answer":"**A missed financial covenant is an immediate Event of Default. The agreement has no equity cure and no grace period for it.** No amendments were provided, so this is based on the September 27, 2024 agreement alone.\n\n**The covenants (Section 7.11)**\n- Interest coverage: Consolidated EBITDA ... to (b) Consolidated Cash Interest Charges for such period to be less than 3.00 to 1.00 [1] is not permitted.\n- Total net leverage: the maximum is 4:00 to 1.00 [2]. The borrower can elect to raise it to 4.50x after Permitted Acquisitions totaling more than $25,000,000 (the \"Elevated TNL Ratio Period\"). This step-up is the only built-in relief. Whether it is available depends on the borrower's acquisition activity, which the documents don't show.\n\n**No grace period and no cure**\n- Section 8.01(c) makes it an Event of Default if the Borrowers shall fail to comply with any of the covenants contained in Sections 6.01, 6.04, 6.05, 6.10, 6.11, 6.13, 6.15, 6.19, 6.20 or Article VII [3].\n- The 30-day notice-and-cure period in 8.01(d) covers only other covenants. Article VII, which includes 7.11, is excluded.\n- I found no equity cure right anywhere in the agreement.\n\n**What the lenders can do**\n- Under Section 8.02, the Agent acts at the request (or with the consent) of the Required Lenders. It can:\n  - declare the commitment of each Lender to make Loans and any obligation of any L/C Issuer to make L/C Credit Extensions to be terminated [4]\n  - accelerate all Loans\n  - require that the Borrowers Cash Collateralize the L/C Obligations [5]\n  - enforce rights against the collateral\n- Default interest: Upon the request of the Required Lenders, while any Event of Default exists [6], interest steps up to the Default Rate. That is the normal rate plus 2% per annum [7].\n- Draw stop: no new borrowings are allowed while a Default exists (4.02(b)).\n- Setoff: lenders may set off deposits after obtaining the prior written consent of the Administrative Agent [8].\n\n**Waiver**\nA waiver or covenant reset needs only the Required Lenders, meaning holders of more than 50%. amend any financial covenant hereunder [9] is expressly a Required Lender matter.","citations":[{"n":1,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"As at the end of any fiscal quarter, the Borrowers shall not permit the ratio\nof (a) Consolidated EBITDA for the period of four (4) consecutive fiscal quarters then ending to (b) Consolidated Cash Interest Charges for such period to be less than 3.00 to 1.00.\n","found":true},{"n":2,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"As at the end of any fiscal quarter prior to the Secured Leverage Covenant Election,\nthe Borrowers shall not permit the Consolidated Total Net Leverage Ratio for the period of four (4) consecutive fiscal quarters then ending to exceed 4:00 to 1.00;\nprovided\nthat if a Permitted Acquisition or a series of Permitted\nAcquisitions with aggregate consideration (including cash deferred payments, contingent or otherwise, and the aggregate amount of all Indebtedness assumed or, in the case of an acquisition of Equity Interests, including all Indebtedness of the\ntarget company) of more than $25,000,000 occurs during a fiscal quarter ending on or after the Closing Date, the Borrowers shall have the right to elect to increase the maximum permitted Consolidated Total Net Leverage Ratio for the period of four\n(4) consecutive fiscal quarters then ending (including such fiscal quarter) and the subsequent three fiscal quarters to 4.50 to 1.00 (each period during which the maximum permitted\n111\nConsolidated Total Net Leverage Ratio may exceed 4.00 to 1.00 pursuant to this proviso, an \u201c\nElevated TNL Ratio Period\n\u201d);\nprovided\nfurther\n, that (x) there shall\nbe no more than one Elevated TNL Ratio Period in effect at any given time, and (y) there shall be at least one fiscal quarter during which the maximum permitted Consolidated Total Net Leverage Ratio is 4.00 to 1.00 between Elevated TNL Ratio\nPeriods.\n","found":true},{"n":3,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"Any of the following events shall constitute an event of default (each, an \u201c\nEvent of\nDefault\n\u201d):\n(a) if the Borrowers shall fail to pay any principal of the Loans or any L/C Obligation hereunder when the same shall\nbecome due and payable, whether at the Maturity Date or any accelerated date of maturity or at any other date fixed for payment;\n(b) if\nthe Borrowers shall fail to pay any interest or fees or other amounts owing hereunder within five (5) Business Days after the same shall become due and payable whether at the Maturity Date or any accelerated date of maturity or at any other\ndate fixed for payment;\n(c) if the Borrowers shall fail to comply with any of the covenants contained in\nSections 6.01\n,\n6.04\n,\n6.05\n,\n6.10\n,\n6.11\n,\n6.13\n,\n6.15\n,\n6.19\n,\n6.20\nor\nArticle VII\n;\n(d) if the\nBorrowers shall fail to perform any term, covenant or agreement contained herein or in any of the other Loan Documents (other than those specified in\nsubsections (a)\n,\n(b)\n, and\n(c)\nabove) within 30 days after written notice\nof such failure has been given to the Borrowers by the Lenders;\n(e) if any representation or warranty contained in this Agreement or in\nany document or instrument delivered pursuant to or in connection with this Agreement shall prove to have been false in any material respect upon the date when made or repeated (other than, for the avoidance of doubt, any Pricing Certificate\nInaccuracy, provided that the Parent complies with the terms of\nSection\n2.21(d)\nwith respect to such Pricing Certificate Inaccuracy, or any Sustainability Report or attachment thereto);\n(f) if any Borrower or\nNon-Borrower\nSubsidiary shall fail to pay at maturity, or within any applicable\nperiod of grace, any and all obligations for borrowed money or any guaranty with respect thereto or credit received or in respect of any Capitalized Leases, Synthetic Lease Obligations or Swap Contracts, in each case, in an aggregate amount greater\nthan the Threshold Amount, or fail to observe or perform any material term, covenant or agreement contained in any agreement by which it is bound, that evidences or secures borrowed money or in respect of any Capitalized Leases, in each case in an\naggregate amount greater than the Threshold Amount for such period of time as permits (after applicable grace periods have elapsed and assuming the giving of appropriate notice of acceleration if required) or results in, the holder or holders\nthereof or of any obligations issued thereunder to accelerate the maturity thereof;\n(g) if any Borrower or\nNon-Borrower\nSubsidiary (other than a De Minimis Subsidiary or an Excluded Subsidiary) makes an assignment for the benefit of creditors, or admits in writing its inability to pay or generally fails to pay its\ndebts as they mature or become due, or petitions or applies for the appointment of a trustee or other custodian, liquidator, receiver or receiver/manager of any Borrower or\nNon-Borrower\nSubsidiary (other than\na De Minimis Subsidiary or an Excluded Subsidiary) or of any substantial part of the assets of any Borrower or\nNon-Borrower\nSubsidiary (other than a De Minimis Subsidiary or an Excluded Subsidiary) or\ncommences any case or other proceeding relating to any Borrower or\nNon-Borrower\nSubsidiary (other than a De Minimis Subsidiary or an Excluded Subsidiary) under any Debtor Relief Law of any jurisdiction, now or\nhereafter in effect, or takes any action to authorize or in furtherance of any of the foregoing, or if any such petition or application is filed or any such case or other proceeding is commenced against any Borrower or\nNon-Borrower\nSubsidiary (other than a De Minimis Subsidiary or an Excluded Subsidiary) and any Borrower or\nNon-Borrower\nSubsidiary (other than a De Minimis Subsidiary or\nan Excluded Subsidiary) indicates its approval thereof, consent thereto or acquiescence therein;\n(h) a decree or order is entered\nappointing any such trustee, custodian, liquidator, receiver or receiver/manager or adjudicating any Borrower or\nNon-Borrower\nSubsidiary (other than a De Minimis Subsidiary or an Excluded Subsidiary) bankrupt\nor insolvent, or approving a petition in any such case or other proceeding, or a decree or order for relief is entered in respect of any Borrower or\nNon-Borrower\nSubsidiary (other than a De Minimis Subsidiary\nor an Excluded Subsidiary) in an involuntary case under Debtor Relief Laws as now or hereafter constituted, and such decree or order remains in effect for more than sixty (60) days, whether or not consecutive;\n115\n(i) (i) one or more final judgments or orders for the payment of money in an aggregate\namount (as to all such judgments and orders) exceeding the Threshold Amount (to the extent not covered by independent third-party insurance as to which the insurer is rated at least \u201cA\u201d by A.M. Best Company, has been notified of the\npotential claim and does not dispute coverage), or (ii) any one or more\nnon-monetary\nfinal judgments that have, or could reasonably be expected to have, individually or in the aggregate, a Material\nAdverse Effect and, in either case, (A) enforcement proceedings are commenced by any creditor upon such judgment or order which are not promptly stayed (and, if such required to perfect such stay pending appeal, bonded), or (B) there is a\nperiod of 30 consecutive days during which a stay of enforcement of such judgment, by reason of a pending appeal or otherwise, is not in effect;\n(j) (i) an ERISA Event occurs with respect to a Pension Plan which has resulted or could reasonably be expected to result in liability of\nthe Borrowers under Title IV of ERISA to the Pension Plan, or the PBGC in an aggregate amount in excess of the Threshold Amount (provided that, with respect to a Multiemployer Plan,\nclause (i)\nonly applies if the Borrowers have\nreceived written notice from such plan or otherwise become aware that an event or circumstance described in such clause has occurred), or (ii) any Borrower or any ERISA Affiliate fails to pay when due, after the expiration of any applicable\ngrace period, any installment payment with respect to its withdrawal liability under Section 4201 of ERISA under a Multiemployer Plan in an aggregate amount in excess of the Threshold Amount;\n(k) if any of the Loan Documents shall be cancelled, terminated, revoked or rescinded otherwise than in accordance with the terms thereof or\nwith the express prior written agreement, consent or approval of the Administrative Agent or the Required Lenders, or any action at law, suit or in equity or other legal proceeding to cancel, revoke or rescind any of the Loan Documents shall be\ncommenced by or on behalf of the Borrowers or any of their respective stockholders, or any court or any Governmental Authority of competent jurisdiction shall make a determination that, or issue a judgment, order, decree or ruling to the effect\nthat, any one or more of the Loan Documents is illegal, invalid or unenforceable in accordance with the terms thereof, or any Security Document shall for any reason cease to create a valid and perfected first priority Lien on the Collateral\npurported to be covered thereby (subject to\nSection\n7.04(b)\nand\nSection\n10.15\n) or as contemplated by the Loan Documents; or;\n(l) (i) the subordination provisions with respect to any Indebtedness subordinated to the Obligations that is permitted pursuant to\nSection\n7.03\n(or any permitted refinancing or replacement thereof) in excess of the Threshold Amount (the \u201c\nSubordination Provisions\n\u201d) shall, in whole or in part, terminate, cease to be effective or cease to\nbe legally valid, binding and enforceable against any holder of such subordinated Indebtedness; or (ii) the Borrowers shall, directly or indirectly, disavow or contest in any manner (A) the effectiveness, validity or enforceability of any\nof the Subordination Provisions, (B) that the Subordination Provisions exist for the benefit of the Secured Parties or (C) that all proceeds realized from the liquidation of any Collateral of any Borrower shall be subject to any of the\nSubordination Provisions; or\n(m) a Change of Control shall occur.\n","found":true},{"n":4,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"If any Event of Default occurs and is continuing, the Administrative Agent shall, at\nthe request of, or may, with the consent of, the Required Lenders, take any or all of the following actions:\n(a) declare the commitment of\neach Lender to make Loans and any obligation of any L/C Issuer to make L/C Credit Extensions to be terminated, whereupon such commitments and obligation shall be terminated;\n116\n(b) declare the unpaid principal amount of all outstanding Loans, all interest accrued and\nunpaid thereon, and all other amounts owing or payable hereunder or under any other Loan Document to be immediately due and payable, without presentment, demand, protest or other notice of any kind, all of which are hereby expressly waived by the\nBorrowers;\n(c) require that the Borrowers Cash Collateralize the L/C Obligations (in an amount equal to the then Outstanding Amount\nthereof); and\n(d) exercise on behalf of the Secured Parties all rights and remedies available to the Secured Parties under the Loan\nDocuments;\nprovided, however, that upon the occurrence of an actual or deemed entry of an order for relief with respect to the Borrowers under any Debtor\nRelief Law (including any Event of Default specified in\nSection\n8.01(g)\nor\n8.01(h)\n), the obligation of each Lender to make Loans and any obligation of the L/C Issuers to make L/C Credit Extensions shall automatically\nterminate, the unpaid principal amount of all outstanding Loans and all interest and other amounts as aforesaid shall automatically become due and payable, and the obligation of the Borrowers to Cash Collateralize the L/C Obligations as aforesaid\nshall automatically become effective, in each case without further act of the Administrative Agent or any Lender.\n","found":true},{"n":5,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"If any Event of Default occurs and is continuing, the Administrative Agent shall, at\nthe request of, or may, with the consent of, the Required Lenders, take any or all of the following actions:\n(a) declare the commitment of\neach Lender to make Loans and any obligation of any L/C Issuer to make L/C Credit Extensions to be terminated, whereupon such commitments and obligation shall be terminated;\n116\n(b) declare the unpaid principal amount of all outstanding Loans, all interest accrued and\nunpaid thereon, and all other amounts owing or payable hereunder or under any other Loan Document to be immediately due and payable, without presentment, demand, protest or other notice of any kind, all of which are hereby expressly waived by the\nBorrowers;\n(c) require that the Borrowers Cash Collateralize the L/C Obligations (in an amount equal to the then Outstanding Amount\nthereof); and\n(d) exercise on behalf of the Secured Parties all rights and remedies available to the Secured Parties under the Loan\nDocuments;\nprovided, however, that upon the occurrence of an actual or deemed entry of an order for relief with respect to the Borrowers under any Debtor\nRelief Law (including any Event of Default specified in\nSection\n8.01(g)\nor\n8.01(h)\n), the obligation of each Lender to make Loans and any obligation of the L/C Issuers to make L/C Credit Extensions shall automatically\nterminate, the unpaid principal amount of all outstanding Loans and all interest and other amounts as aforesaid shall automatically become due and payable, and the obligation of the Borrowers to Cash Collateralize the L/C Obligations as aforesaid\nshall automatically become effective, in each case without further act of the Administrative Agent or any Lender.\n","found":true},{"n":6,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"60\n(iii) Upon the request of the Required Lenders, while any Event of Default\nexists (other than as set forth in\nclauses (i)\nand\n(ii)\nabove), the Borrowers shall pay interest on the principal amount of all applicable outstanding Obligations hereunder (and, without duplication, on any past due amount) at a\nfluctuating interest rate per annum at all times equal to the Default Rate to the fullest extent permitted by Applicable Law.\n","found":true},{"n":7,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"Default Rate\n\u201d means (a) with respect to any Loan, the\ninterest rate otherwise applicable to such Loan plus 2% per annum, (b) with respect to the Letter of Credit Fee, the Letter of Credit Percentage used in determining such Letter of Credit Fee plus 2% per annum, and (c) with respect to all\nother Obligations under this Agreement, an interest rate equal to the Base Rate plus the Applicable Rate otherwise applicable to Base Rate Loans under the Revolving Credit Facility determined at Pricing Level V plus 2% per annum.\n\u201c\n","found":true},{"n":8,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"If an Event of Default shall have occurred and\nbe continuing, each Lender, each L/C Issuer and each of their respective Affiliates is hereby authorized at any time and from time to time, after obtaining the prior written consent of the Administrative Agent, to the fullest extent permitted by\nApplicable Law, to set off and apply any and all deposits (general or special, time or demand, provisional or final, in whatever currency) at any time held and other obligations (in whatever currency) at any time owing by such Lender, such L/C\nIssuer or any such Affiliate to or for the credit or the account of any of the Borrowers against any and all of the obligations of any of the Borrowers now or hereafter existing under this Agreement or any other Loan Document to such Lender or such\nL/C Issuer, irrespective of whether or not such Lender or such L/C Issuer shall have made any demand under this Agreement or any other Loan Document and although such obligations of any of the Borrowers may be contingent or unmatured or are owed to\na branch or office or Affiliate of such Lender or such L/C Issuer different from the branch or office or Affiliate holding such deposit or obligated on such indebtedness;\nprovided\n, that, in the event that any Defaulting Lender shall exercise\nany such right of setoff, (x) all amounts so set off shall be paid over immediately to the Administrative Agent for further application in accordance with the provisions of\nSection\n2.18\nand, pending such payment, shall\nbe segregated by such Defaulting Lender from its other funds and deemed held in trust for the benefit of the Administrative Agent and the Lenders, and (y) the Defaulting Lender shall provide promptly to the Administrative Agent a statement\ndescribing in reasonable detail the Obligations owing to such Defaulting Lender as to which it exercised such right of setoff. ","found":true},{"n":9,"document":"Second Amended and Restated Credit Agreement","url":"https://www.sec.gov/Archives/edgar/data/911177/000119312524228456/d823888dex101.htm","text":"Subject to\nSection\n2.21\nand\n3.03\n, no amendment or waiver of any provision of this Agreement or any other Loan Document, and no consent to any departure by any Borrower therefrom,\nshall be effective unless in writing signed by the Required Lenders and the Borrowers or applicable Borrower, as the case may be, and acknowledged by the Administrative Agent, and each such waiver or consent shall be effective only in the specific\ninstance and for the specific purpose for which given;\nprovided\n,\nhowever\n, that no such amendment, waiver or consent shall:\n(a) subject to the last paragraph of\nSection\n4.01\n, waive any condition set forth in\nSection\n4.01(a)\nwithout the written consent of each Lender except that, in the sole discretion of the Administrative Agent, only a waiver by the Administrative Agent shall be required with respect to immaterial matters and\nother items noted in any post-closing letter made available to the Lenders with respect to which the Borrowers have given assurances satisfactory to the Administrative Agent that such items shall be delivered within a reasonable period of time\nfollowing the Closing Date;\n(b) waive any condition set forth in\nSection\n4.02\nas to any Credit Extension under\na particular Facility without the written consent of the Required Revolving Lenders or the Required Term Lenders, as applicable (each of which shall not also require the consent of the Required Lenders);\n(c) extend or increase the Revolving Credit Commitment of any Lender (or reinstate any Revolving Credit Commitment terminated pursuant to\nSection\n8.02(a)\n) without the written consent of such Lender (each of which shall not also require the consent of the Required Lenders);\n(d) postpone any date fixed by this Agreement or any other Loan Document for any payment (excluding mandatory prepayments) of principal,\ninterest, fees or other amounts due to the Lenders (or any of them) or any scheduled reduction (other than as a result of mandatory prepayments) of the Revolving Credit Commitments hereunder or under any other Loan Document without the written\nconsent of each Lender directly affected thereby (it being understood that any vote to rescind any acceleration of amounts owing with respect to the Loans and other Obligations under the Loan Documents shall only require the approval of the Required\nLenders);\n(e) reduce the principal of, or the rate of interest specified herein on, any Loan or L/C Borrowing, or (subject to\nclause\n(iv)\nof the second proviso to this\nSection\n10.01\nset forth below with respect to fees paid pursuant to the Fee Letters) any fees or other amounts payable hereunder or under any other Loan Document, without the\nwritten consent of each Lender directly affected thereby except that only the consent of the Required Lenders shall be necessary to (i) amend the definition of \u201cDefault Rate\u201d or to waive any obligation of the Borrowers to pay interest\nor Letter of Credit Fees at the Default Rate or (ii) amend any financial covenant hereunder (or any defined term used therein) even if the effect of such amendment would be to reduce the rate of interest on any Loan or L/C Borrowing, to reduce\nany fee or to reduce any mandatory prepayment payable hereunder;\n(f) change (i)\nSection\n8.03\nin a manner\nthat would alter the pro rata sharing of payments required thereby without the written consent of each Lender, (ii) the order of application of any prepayment of Loans among the Facilities from the application thereof set forth in the\napplicable provisions of\nSection\n2.05(b)\n, or (iii) the ratable reduction in Commitments set forth in the applicable provisions of\nSection\n2.06\n(or change any other provision hereof in a manner\nthat would have the effect of altering the ratable reduction of Commitments or the pro rata sharing of payments otherwise required hereunder) in any manner that materially and adversely affects the Lenders under a Facility without the written\nconsent of (i) if such Facility is the Term Facility, each Term Lender, or (ii) if such Facility is the Revolving Credit Facility, each Revolving Credit Lender (each of which shall not also require the consent of the Required Lenders);\n126\n(g) change (i) any provision of this\nSection\n10.01\nor the\ndefinition of \u201cRequired Lenders\u201d or any other provision hereof specifying the number or percentage of Lenders required to amend, waive or otherwise modify any rights hereunder or make any determination or grant any consent hereunder,\n(other than the definitions specified in\nclause (ii)\nof this\nSection\n10.01(g)\n), without the written consent of each Lender or (ii) the definition of \u201cRequired Revolving Lenders\u201d or \u201cRequired\nTerm Lenders\u201d without the written consent of each Lender under the applicable Facility (each of which shall not also require the consent of the Required Lenders);\n(h) impose any greater restriction on the ability of any Lender under a Facility to assign any of its rights or obligations hereunder without\nthe written consent of (i) if such Facility is the Term Facility, the Required Term Lenders, and (ii) if such Facility is the Revolving Credit Facility, the Required Revolving Lenders (each of which shall not also require the consent of\nthe Required Lenders);\n(i) except as permitted by\nSection\n9.10\nas in effect on the Closing Date,\n(i) subordinate the right of payment of the Obligations hereunder to any other Indebtedness or other obligation or (ii) subordinate the Liens on a material portion of the Collateral securing the Obligations to Liens securing any other\nIndebtedness or other obligation without the written consent of each Lender directly and adversely affected thereby; or\n(j) release\n(i) all or substantially all of the Collateral (excluding, if any Borrower becomes a debtor under any Debtor Relief Law, the release of \u201ccash collateral\u201d, as defined in Section 363(a) of the federal Bankruptcy Code pursuant to a\ncash collateral stipulation with the debtor approved by the Required Lenders), (ii) the Parent from its Obligations under the Loan Documents, or (iii) except as permitted under this Agreement, release any Borrower (other than the Parent) from\nits Obligations under the Loan Documents, in each case without the written consent of each Lender;\nand,\nprovided\nfurther\n, that (i) no\namendment, waiver or consent shall, unless in writing and signed by (A) the affected L/C Issuer in addition to the Lenders required above, affect the rights or duties of such L/C Issuer under this Agreement or any Issuer Document relating to\nany Letter of Credit issued or to be issued by it or (B) each L/C Issuer hereunder, increase the Letter of Credit Sublimit; (ii) no amendment, waiver or consent shall, unless in writing and signed by the Swing Line Lender in addition to\nthe Lenders required above, affect the rights or duties of the Swing Line Lender under this Agreement; (iii) no amendment, waiver or consent shall, unless in writing and signed by the Administrative Agent in addition to the Lenders required\nabove, affect the rights or duties of the Administrative Agent under this Agreement or any other Loan Document; and (iv) each Fee Letter may be amended, or rights or privileges thereunder waived, in a writing executed only by the parties\nthereto. ","found":true}]}]},{"cik":"1681622","name":"Varex Imaging","borrower":"Varex Imaging Corporation (Parent Borrower), with co-borrowers Varex Imaging West, LLC and Varex Imaging Deutschland AG","gold":true,"facility":"$490M senior secured facilities: $100M revolver (with $35M L/C and $20M swingline sublimits), $350M initial term loan and $40M delayed-draw term loan (2-year availability, capex use), all maturing March 13, 2031; incremental capacity of the greater of $150M and 3.00x pro forma net leverage.","stale":false,"agreement_date":"2026-03-13","cov_lite":false,"tightest":{"name":"Consolidated Total Net Leverage Ratio","period_end":"2026-07-03","basis":"adjusted","value":2.012175324675325,"limit":4.25,"headroom":0.5265469824293353,"cushion":0.5265469824293354},"chain":{"source":"hand-picked","notes":[],"used":[{"url":"https://www.sec.gov/Archives/edgar/data/1681622/000168162226000035/exhibit101-creditandguaran.htm","title":"Credit and Guaranty Agreement","dated":"2026-03-13"}]},"covenants":[{"name":"Consolidated Total Net Leverage Ratio","metric":"net_leverage","direction":"max","section":"Section 6.12(a)","quote":"The Parent Borrower shall not permit the Consolidated Total Net Leverage Ratio, on the last day of any Fiscal Quarter, to be greater than the ratio set forth below opposite such Fiscal Quarter:","quote_verified":true,"thresholds":[{"value":4.25,"applies_from":"2026-04-03"},{"value":4.0,"applies_from":"2027-12-31"},{"value":3.75,"applies_from":"2028-12-31"}],"test_frequency":"quarterly","springing_condition":null,"cash_netting_cap":100000000.0,"cash_netting_cap_pct_ebitda":null,"latest":{"period_end":"2026-07-03","basis":"adjusted","value":2.012175324675325,"limit":4.25,"headroom":0.5265469824293353,"cushion":0.5265469824293354},"steps":[{"from":"2027-12-31","limit":4.0,"headroom_at_today":0.4969561688311688},{"from":"2028-12-31","limit":3.75,"headroom_at_today":0.46341991341991334}],"rows":[{"period_end":"2
